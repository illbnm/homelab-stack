version: "3.8"

networks:
  traefik:
    external: true
  internal:
    driver: bridge

volumes:
  nextcloud_data:
  nextcloud_db:
  nextcloud_redis:
  minio_data:
  filebrowser_data:
  syncthing_data:

services:
  # ── Nextcloud ──────────────────────────────────────────
  nextcloud-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - nextcloud_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud:
    image: nextcloud:29.0.7-fpm-alpine
    restart: unless-stopped
    networks: [internal]
    volumes:
      - nextcloud_data:/var/www/html
      - ${STORAGE_ROOT:-/data/storage}:/data/storage:ro
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN:?}
      OVERWRITEPROTOCOL: https
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy

  nextcloud-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [traefik, internal]
    volumes:
      - nextcloud_data:/var/www/html:ro
      - ./config/nginx/nextcloud.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN:?}`)"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"

  # ── MinIO ──────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    networks: [traefik, internal]
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_DOMAIN: s3.${NEXTCLOUD_DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`s3.${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=https"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=https"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # ── FileBrowser ─────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser:v2.31.1
    restart: unless-stopped
    networks: [traefik]
    volumes:
      - ${STORAGE_ROOT:-/data/storage}:/srv:ro
      - filebrowser_data:/database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.filebrowser.entrypoints=https"
      - "traefik.http.routers.filebrowser.tls=true"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"

  # ── Syncthing ───────────────────────────────────────────
  syncthing:
    image: lscr.io/linuxserver/syncthing:1.27.11
    restart: unless-stopped
    networks: [traefik, internal]
    volumes:
      - syncthing_data:/config
      - ${STORAGE_ROOT:-/data/storage}:/data/storage
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=Host(`sync.${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.syncthing.entrypoints=https"
      - "traefik.http.routers.syncthing.tls=true"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
