version: '3.8'

services:
  # DNS 过滤 + 广告屏蔽
  adguard:
    image: adguard/adguardhome:v0.107.52
    container_name: adguard-home
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "3000:3000/tcp"  # Web UI
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    depends_on:
      - unbound
    networks:
      - homelab

  # 递归 DNS 解析器
  unbound:
    image: mvance/unbound:1.21.1
    container_name: unbound
    ports:
      - "5053:53/udp"
      - "5053:53/tcp"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    restart: unless-stopped
    networks:
      - homelab

  # VPN 服务端
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wireguard
    environment:
      - WG_HOST=${WG_HOST:-vpn.example.com}
      - PASSWORD=${WG_PASSWORD:-changeme}
      - WG_PORT=51820
      - WG_DEFAULT_DNS=${WG_DEFAULT_DNS:-10.0.0.1}
      - WG_ALLOWED_IPS=10.0.0.0/24
      - WG_PERSISTENT_KEEPALIVE=25
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=bar
      - TZ=Asia/Shanghai
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"  # Web UI
    volumes:
      - ./wireguard:/etc/wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      - homelab

  # 动态 DNS 更新
  cloudflare-ddns:
    image: ghcr.io/favonia/cloudflare-ddns:1.14.0
    container_name: cloudflare-ddns
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=${CLOUDFLARE_DOMAINS:-example.com}
      - ZONE_ID=${CLOUDFLARE_ZONE_ID}
      - PROXIED=true
      - TTL=3600
      - INTERVAL=300
    restart: unless-stopped
    networks:
      - homelab

  # Nginx 反向代理
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    restart: unless-stopped
    networks:
      - homelab
    depends_on:
      - adguard
      - wireguard

networks:
  homelab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
