# AI Stack — Ollama + Open WebUI + Stable Diffusion
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Ollama — Local LLM runtime
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai

  # ---------------------------------------------------------------------------
  # Open WebUI — ChatGPT-like interface for Ollama
  # ---------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.3.35
    container_name: open-webui
    restart: unless-stopped
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH: "true"
      WEBUI_NAME: "HomeLab AI"
      ENABLE_OLLAMA_API: "true"
      ENABLE_RAG_WEB_SEARCH: "true"
      RAG_WEB_SEARCH_ENGINE: "searxng"
      RAG_WEB_SEARCH_RESULT_COUNT: 3
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      OAUTH_CLIENT_ID: ${OPEN_WEBUI_OIDC_CLIENT_ID:-}
      OAUTH_CLIENT_SECRET: ${OPEN_WEBUI_OIDC_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL:-}
      OAUTH_PROVIDER_NAME: Authentik
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`${AI_DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls.certresolver=letsencrypt"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    networks:
      - ai
      - proxy

  # ---------------------------------------------------------------------------
  # Stable Diffusion WebUI (optional, GPU recommended)
  # ---------------------------------------------------------------------------
