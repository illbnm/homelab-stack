services:
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # GPU support: uncomment the appropriate section
    # NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # AMD GPU (ROCm):
    # devices:
    #   - /dev/kfd:/dev/kfd
    #   - /dev/dri:/dev/dri
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN}`)"
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls=true
      - traefik.http.services.ollama.loadbalancer.server.port=11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.3.32
    container_name: open-webui
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - openwebui-data:/app/backend/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
    labels:
      - traefik.enable=true
      - "traefik.http.routers.openwebui.rule=Host(`ai.${DOMAIN}`)"
      - traefik.http.routers.openwebui.entrypoints=websecure
      - traefik.http.routers.openwebui.tls=true
      - traefik.http.services.openwebui.loadbalancer.server.port=8080
    depends_on:
      ollama:
        condition: service_healthy

  stable-diffusion:
    image: universonic/stable-diffusion-webui:latest
    container_name: stable-diffusion
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - sd-data:/app/data
      - sd-models:/app/models
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - CLI_ARGS=--listen --api --no-half-vae
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sd.rule=Host(`sd.${DOMAIN}`)"
      - traefik.http.routers.sd.entrypoints=websecure
      - traefik.http.routers.sd.tls=true
      - traefik.http.services.sd.loadbalancer.server.port=7860
    # GPU support same as ollama above

  perplexica:
    image: itzcrazykns1337/perplexica-backend:main
    container_name: perplexica
    restart: unless-stopped
    networks:
      - proxy
      - internal
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - OLLAMA_URL=http://ollama:11434
    labels:
      - traefik.enable=true
      - "traefik.http.routers.perplexica.rule=Host(`search.${DOMAIN}`)"
      - traefik.http.routers.perplexica.entrypoints=websecure
      - traefik.http.routers.perplexica.tls=true
      - traefik.http.services.perplexica.loadbalancer.server.port=3001
    depends_on:
      ollama:
        condition: service_healthy

networks:
  internal:
    external: true
  proxy:
    external: true

volumes:
  ollama-data:
  openwebui-data:
  sd-data:
  sd-models:
