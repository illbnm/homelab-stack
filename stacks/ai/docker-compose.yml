version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - ai
    environment:
      OLLAMA_KEEP_ALIVE: "24h"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "8080:8080"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  stable-diffusion:
    image: ghcr.io/invoke-ai/invokeai:latest
    container_name: stable-diffusion
    restart: unless-stopped
    environment:
      INVOKEAI_ROOT: /invokeai
    volumes:
      - sd_data:/invokeai
    ports:
      - "9090:9090"
    networks:
      - ai
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/api/v1/app/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  ai:
    driver: bridge

volumes:
  ollama_data:
  open_webui_data:
  sd_data:
