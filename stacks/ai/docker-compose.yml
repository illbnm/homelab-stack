version: "3.9"

x-gpu-deploy: &gpu-deploy
  deploy:
    resources:
      reservations:
        - devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

x-gpu-deploy-absent: &gpu-deploy-absent
  deploy:
    resources:
      reservations: []

services:
  ollama:
    image: ollama/ollama:0.3.12
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=4
      - GPU_SUPPORTED=${GPU_SUPPORTED:-false}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    deploy:
      $(if [ "$${GPU_SUPPORTED}" = "true" ]; then echo "resources:"; echo "  reservations:"; echo "    - devices:"; echo "      - driver: nvidia"; echo "        count: all"; echo "        capabilities: [gpu]"; else echo "resources:"; echo "  reservations: []"; fi)
    runtime: ${DOCKER_RUNTIME:-}
    networks:
      - ai-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:0.3.32
    container_name: open-webui
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${OPEN_WEBUI_SECRET_KEY:-changeme}
      - GPU_SUPPORTED=${GPU_SUPPORTED:-false}
    ports:
      - "3000:8080"
    volumes:
      - openwebui_data:/app/backend/data
    depends_on:
      - ollama
    deploy:
      $(if [ "$${GPU_SUPPORTED}" = "true" ]; then echo "resources:"; echo "  reservations:"; echo "    - devices:"; echo "      - driver: nvidia"; echo "        count: 1"; echo "        capabilities: [gpu]"; else echo "resources:"; echo "  reservations: []"; fi)
    runtime: ${DOCKER_RUNTIME:-}
    networks:
      - ai-network

  stable-diffusion-webui:
    image: universonic/stable-diffusion-webui:latest-sha
    container_name: stable-diffusion-webui
    restart: unless-stopped
    environment:
      - CMD_ARGS=--listen --api --port=7860 --xformers
      - GPU_SUPPORTED=${GPU_SUPPORTED:-false}
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "7860:7860"
    volumes:
      - sd_webui_data:/stable-diffusion-webui
      - sd_checks:/stable-diffusion-webui/checkpoints
    depends_on:
      - ollama
    deploy:
      $(if [ "$${GPU_SUPPORTED}" = "true" ]; then echo "resources:"; echo "  reservations:"; echo "    - devices:"; echo "      - driver: nvidia"; echo "        count: all"; echo "        capabilities: [gpu,utility]"; else echo "resources:"; echo "  reservations: []"; fi)
    runtime: ${DOCKER_RUNTIME:-}
    networks:
      - ai-network

  perplexica:
    image: itzcrazykns1337/perplexica:main-sha
    container_name: perplexica
    restart: unless-stopped
    environment:
      - RAILWAY_STATIC_URL=http://localhost:3001
      - CODEXTENSION_HF_BRANCH=main
      - GPU_SUPPORTED=${GPU_SUPPORTED:-false}
    ports:
      - "3001:3000"
    volumes:
      - perplexica_data:/home/user/.perplexica
    depends_on:
      - ollama
    deploy:
      $(if [ "$${GPU_SUPPORTED}" = "true" ]; then echo "resources:"; echo "  reservations:"; echo "    - devices:"; echo "      - driver: nvidia"; echo "        count: 1"; echo "        capabilities: [gpu]"; else echo "resources:"; echo "  reservations: []"; fi)
    runtime: ${DOCKER_RUNTIME:-}
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  openwebui_data:
    driver: local
  sd_webui_data:
    driver: local
  sd_checks:
    driver: local
  perplexica_data:
    driver: local
