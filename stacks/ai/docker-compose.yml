services:
  # =============================================================================
  # Ollama - LLM inference engine
  # Supports: NVIDIA GPU (CUDA), AMD GPU (ROCm), CPU fallback
  # Access: https://ollama.yourdomain.com (API) / Internal:11434
  # =============================================================================
  ollama:
    image: ollama/ollama:0.3.14
    container_name: homelab-ollama
    restart: unless-stopped
    networks:
      - proxy
      - ai
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0:11434
      # GPU selection via environment variable
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    # GPU support - will be ignored if not available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ollama.rule=Host(`ollama.${DOMAIN}`)"
      - traefik.http.routers.ollama.entrypoints=websecure
      - traefik.http.routers.ollama.tls.certresolver=letsencrypt
      - traefik.http.services.ollama.loadbalancer.server.port=11434
      # Optional: Restrict API access with basic auth
      - "traefik.http.middlewares.ollama-auth.basicauth.users=${OLLAMA_TRAEFIK_USER}:${OLLAMA_TRAEFIK_HASH}"
      - "traefik.http.routers.ollama.middlewares=ollama-auth@docker"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Open WebUI - ChatGPT-style interface for Ollama
  # Access: https://ai.yourdomain.com
  # =============================================================================
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.3.35
    container_name: homelab-open-webui
    restart: unless-stopped
    networks:
      - proxy
      - ai
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - DEFAULT_LOCALE=zh-CN
      - ENABLE_OLLAMA_API=true
      # Authentik SSO / OIDC Configuration
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
      - OAUTH_CLIENT_ID=${OPENWEBUI_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OPENWEBUI_OAUTH_CLIENT_SECRET}
      - OPENID_PROVIDER_URL=https://${AUTHENTIK_DOMAIN}/application/o/open-webui/.well-known/openid-configuration
      - OAUTH_SCOPES=openid profile email
      # Data retention
      - DATA_EXPORT_DIR=/app/backend/data/exports
      - ENABLE_RAG_WEB_SEARCH=true
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
    depends_on:
      ollama:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.open-webui.rule=Host(`ai.${DOMAIN}`)"
      - traefik.http.routers.open-webui.entrypoints=websecure
      - traefik.http.routers.open-webui.tls.certresolver=letsencrypt
      - traefik.http.services.open-webui.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Stable Diffusion WebUI - Image generation
  # Access: https://sd.yourdomain.com
  # =============================================================================
  stable-diffusion:
    image: ghcr.io/abiosoft/sd-webui-docker:cpu-v1.10.1
    container_name: homelab-stable-diffusion
    restart: unless-stopped
    networks:
      - proxy
      - ai
    volumes:
      - sd-models:/app/models
      - sd-output:/app/outputs
      - sd-data:/app/data
    environment:
      # GPU selection: cpu | cuda | rocm
      - SD_DEVICE=${SD_DEVICE:-cpu}
      # CPU mode (default)
      - COMMANDLINE_ARGS=--no-half --skip-torch-cuda-test --use-cpu all --api --listen
      # For NVIDIA GPU, use: --xformers --api --listen
      # For AMD GPU, use: --precision full --no-half --api --listen --opt-split-attention
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sd.rule=Host(`sd.${DOMAIN}`)"
      - traefik.http.routers.sd.entrypoints=websecure
      - traefik.http.routers.sd.tls.certresolver=letsencrypt
      - traefik.http.services.sd.loadbalancer.server.port=7860
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7860/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # Perplexica - AI-powered search engine
  # Access: https://search.yourdomain.com
  # =============================================================================
  perplexica:
    image: itzcrazykns1337/perplexica:main
    container_name: homelab-perplexica
    restart: unless-stopped
    networks:
      - proxy
      - ai
    volumes:
      - perplexica-data:/home/perplexica/data
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - OLLAMA_API_URL=http://ollama:11434
      - SUPER_SECRET_KEY=${PERPLEXICA_SECRET_KEY}
    depends_on:
      - searxng
      - ollama
    labels:
      - traefik.enable=true
      - "traefik.http.routers.perplexica.rule=Host(`search.${DOMAIN}`)"
      - traefik.http.routers.perplexica.entrypoints=websecure
      - traefik.http.routers.perplexica.tls.certresolver=letsencrypt
      - traefik.http.services.perplexica.loadbalancer.server.port=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # =============================================================================
  # SearXNG - Privacy-respecting metasearch engine (Perplexica backend)
  # =============================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: homelab-searxng
    restart: unless-stopped
    networks:
      - ai
    volumes:
      - searxng-data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=https://${DOMAIN}/search
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_IMAGE_PROXY=true
      - SEARXNG_DEFAULT_LOCALE=zh-CN
    labels:
      - traefik.enable=false
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
  ai:
    name: ai
    driver: bridge

volumes:
  ollama-data:
    driver: local
  open-webui-data:
    driver: local
  sd-models:
    driver: local
  sd-output:
    driver: local
  sd-data:
    driver: local
  perplexica-data:
    driver: local
  searxng-data:
    driver: local
