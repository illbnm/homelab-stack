version: "3.8"

services:
  nextcloud-db:
    image: mariadb:11.4.3
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW
    environment:
      MYSQL_ROOT_PASSWORD: ${NC_DB_ROOT_PASS:?required}
      MYSQL_PASSWORD: ${NC_DB_PASS:?required}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
    volumes:
      - nextcloud-db:/var/lib/mysql

  nextcloud:
    image: nextcloud:29.0.8-apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8081}:80"
    environment:
      MYSQL_PASSWORD: ${NC_DB_PASS}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_HOST: nextcloud-db
    volumes:
      - nextcloud-html:/var/www/html
    depends_on:
      - nextcloud-db

  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "${FILEBROWSER_PORT:-8082}:80"
    volumes:
      - ${STORAGE_ROOT:-./srv}:/srv
      - filebrowser-db:/database

volumes:
  nextcloud-db:
  nextcloud-html:
  minio-data:
  filebrowser-db:
