services:
  nextcloud-fpm:
    image: nextcloud:29.0.7-fpm-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: homelab-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: homelab-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ${STORAGE_ROOT}/nextcloud:/var/www/html
    networks:
      - databases
      - default

  nextcloud-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}/nextcloud:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${STORAGE_ROOT}/minio:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  filebrowser:
    image: filebrowser/filebrowser:v2.31.1
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}:/srv
      - ./filebrowser.db:/database.db
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN}`)"

  syncthing:
    image: lscr.io/linuxserver/syncthing:1.27.11
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT}/syncthing:/config
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=Host(`sync.${DOMAIN}`)"

networks:
  proxy:
    external: true
  databases:
    external: true