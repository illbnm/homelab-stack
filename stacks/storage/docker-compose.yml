# =============================================================================
# HomeLab Stack — Storage Stack
# Nextcloud (FPM) + MinIO (S3) + FileBrowser + Syncthing
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nextcloud — Personal cloud (FPM + Nginx)
  # ---------------------------------------------------------------------------
  nextcloud:
    image: nextcloud:29.0.7-fpm-alpine
    container_name: nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      POSTGRES_HOST: homelab-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      REDIS_HOST: homelab-redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_DOMAIN}
      NEXTCLOUD_OVERWRITE_PROTOCOL: https
      NEXTCLOUD_DEFAULT_PHONE_REGION: CN
      NEXTCLOUD_DATA_DIR: /var/www/html/data
    healthcheck:
      test: ["CMD", "php", "-f", "/var/www/html/cron.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - databases
      - storage

  nextcloud-nginx:
    image: nginx:1.27-alpine
    container_name: nextcloud-nginx
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html:ro
      - ../../config/nextcloud/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextcloud
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    networks:
      - storage
      - proxy

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      # Console
      - "traefik.enable=true"
      - "traefik.http.routers.minio-console.rule=Host(`${MINIO_DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      # S3 API
      - "traefik.http.routers.minio-api.rule=Host(`${S3_DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
    networks:
      - storage
      - proxy

  # ---------------------------------------------------------------------------
  # FileBrowser — Lightweight web-based file manager
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:v2.31.1
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ${STORAGE_ROOT:-/mnt/storage}:/srv:ro
      - filebrowser_data:/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.filebrowser.rule=Host(`${FILES_DOMAIN}`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=letsencrypt"
      - "traefik.http.routers.filebrowser.middlewares=authentik@file"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"
    networks:
      - storage
      - proxy

  # ---------------------------------------------------------------------------
  # Syncthing — P2P continuous file synchronization
  # ---------------------------------------------------------------------------
  syncthing:
    image: lscr.io/linuxserver/syncthing:1.27.11
    container_name: syncthing
    restart: unless-stopped
    volumes:
      - syncthing_config:/config
      - ${SYNC_DATA:-/mnt/sync}:/data
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8384/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=Host(`${SYNC_DOMAIN}`)"
      - "traefik.http.routers.syncthing.entrypoints=websecure"
      - "traefik.http.routers.syncthing.tls.certresolver=letsencrypt"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
    networks:
      - storage
      - proxy

volumes:
  nextcloud_data:
  minio_data:
  filebrowser_data:
  syncthing_config:

networks:
  databases:
    external: true
    name: databases
  storage:
    name: storage
  proxy:
    external: true
    name: proxy
