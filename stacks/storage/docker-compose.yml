# Storage Stack - NFS + Syncthing + MinIO
# 存储服务栈：网络文件系统 + 同步工具 + 对象存储

x-traefik-labels: &traefik-labels
  - "traefik.enable=true"
  - "traefik.http.routers.${ROUTER:-storage}.rule=Host(`${DOMAIN}`)"
  - "traefik.http.routers.${ROUTER:-storage}.entrypoints=websecure"
  - "traefik.http.routers.${ROUTER:-storage}.tls.certresolver=letsencrypt"
  - "traefik.http.services.${ROUTER:-storage}.loadbalancer.server.port=${PORT}"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ==================== NFS Server ====================
  nfs-server:
    image: itsthenetwork/nfs-server:latest
    container_name: nfs-server
    restart: unless-stopped
    privileged: true
    environment:
      - SHARED_DIRECTORY=/data/nfs
    volumes:
      - nfs-data:/data
    networks:
      - storage-internal
    labels:
      - "traefik.enable=false"  # NFS 通常不需要 Traefik 反代
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "mountpoint", "-q", "/data/nfs"]

  # ==================== Syncthing ====================
  syncthing:
    image: syncthing/syncthing:1.27.10
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
    volumes:
      - syncthing-config:/var/syncthing
      - syncthing-data:/var/lib/syncthing
      - /data/sync:/data/sync:rw  # 同步目录
    networks:
      - traefik-public
      - storage-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.syncthing.rule=Host(`syncthing.${DOMAIN}`)"
      - "traefik.http.routers.syncthing.entrypoints=websecure"
      - "traefik.http.routers.syncthing.tls.certresolver=letsencrypt"
      - "traefik.http.services.syncthing.loadbalancer.server.port=8384"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8384/rest/noauth/health"]

  # ==================== MinIO (重复，但独立实例) ====================
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: storage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BROWSER_REDIRECT_URL=https://minio.${DOMAIN}
    volumes:
      - minio-data:/data
    networks:
      - traefik-public
      - storage-internal
    labels:
      # MinIO API
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

networks:
  traefik-public:
    external: true
  storage-internal:
    driver: bridge

volumes:
  nfs-data:
  syncthing-config:
  syncthing-data:
  minio-data:
