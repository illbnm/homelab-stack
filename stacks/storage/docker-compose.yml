services:
  # ---------------------------------------------------------------------------
  # Nextcloud with FPM + Nginx (Optimized)
  # ---------------------------------------------------------------------------
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    networks:
      - storage-net
    volumes:
      - nextcloud-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${NEXTCLOUD_DB_USER:-nextcloud}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEXTCLOUD_DB_USER:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    networks:
      - storage-net
    command: redis-server --requirepass ${NEXTCLOUD_REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - nextcloud-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${NEXTCLOUD_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

  nextcloud-app:
    image: nextcloud:29.0.9-fpm-alpine
    container_name: nextcloud-app
    restart: unless-stopped
    networks:
      - storage-net
      - proxy
    volumes:
      - nextcloud-data:/var/www/html
      - ./config/nextcloud/php.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.${DOMAIN}
      # Database (dedicated PostgreSQL for Nextcloud)
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=${NEXTCLOUD_DB_USER:-nextcloud}
      - POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD}
      # Redis (dedicated Redis for Nextcloud)
      - REDIS_HOST=nextcloud-redis
      - REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASSWORD}
      - REDIS_CACHE_DATE=1
      # PHP memory optimization
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_LIMIT=10G
      - PHP_MAX_EXECUTION_TIME=3600
      - PHP_MAX_INPUT_TIME=3600
      # OIDC OAuth2 Integration via Authentik
      - OAUTH_CLIENT_ENABLED=true
      - OAUTH_CLIENT_ID=${NEXTCLOUD_OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${NEXTCLOUD_OAUTH_CLIENT_SECRET}
      - OAUTH_CLIENT_NAME=Authentik
      - OAUTH_CLIENT_SECRET_GENERATED=false
      - OAUTH_URL=https://${AUTHENTIK_DOMAIN}
      - OAUTH_AUTH_URL=https://${AUTHENTIK_DOMAIN}/application/o/authorize/
      - OAUTH_TOKEN_URL=https://${AUTHENTIK_DOMAIN}/application/o/token/
      - OAUTH_USERINFO_URL=https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
      - OAUTH_SCOPE=openid profile email
      - OAUTH_USE_AS_BASE_LOGIN=false
      # Performance optimizations
      - NEXTCLOUD_CSV_MEMORY_LIMIT=1024M
      - NEXTCLOUD_OBLITERATE_ABANDONED_CALENDARS=1
      - NEXTCLOUD_ACTIVITY_USE_NIGHTLY_ROTATION=1
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nextcloud-web:
    image: nginx:alpine
    container_name: nextcloud-web
    restart: unless-stopped
    networks:
      - storage-net
      - proxy
    volumes:
      - nextcloud-data:/var/www/html:ro
      - ./config/nextcloud/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nextcloud/site.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nextcloud-app
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN}`)"
      - traefik.http.routers.nextcloud.entrypoints=websecure
      - traefik.http.routers.nextcloud.tls=true
      - traefik.http.services.nextcloud.loadbalancer.server.port=80
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.regex=https://(.*)/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-dav.redirectregex.replacement=https://$${1}/remote.php/dav/"
      - traefik.http.routers.nextcloud.middlewares=nextcloud-dav
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO S3 Storage with Bucket Initialization
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio
    restart: unless-stopped
    networks:
      - storage-net
      - proxy
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-changeme-minio}
      - MINIO_BROWSER_REDIRECT_URL=https://minio.${DOMAIN}
    command: server /data --console-address ":9001"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
      - traefik.http.routers.minio.entrypoints=websecure
      - traefik.http.routers.minio.tls=true
      - traefik.http.services.minio.loadbalancer.server.port=9001
      - "traefik.http.routers.minio-api.rule=Host(`s3.${DOMAIN}`)"
      - traefik.http.routers.minio-api.entrypoints=websecure
      - traefik.http.routers.minio-api.tls=true
      - traefik.http.services.minio-api.loadbalancer.server.port=9000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  minio-init:
    image: minio/mc:RELEASE.2024-11-07T00-52-20Z
    container_name: minio-init
    restart: "no"
    networks:
      - storage-net
    environment:
      - MC_HOST_minio=http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-changeme-minio}@minio:9000
    volumes:
      - minio-data:/data
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to be ready...';
      until mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-changeme-minio} 2>/dev/null; do
        sleep 2;
      done;
      echo 'Creating buckets...';
      mc mb minio/nextcloud --ignore-existing;
      mc mb minio/backups --ignore-existing;
      mc mb minio/media --ignore-existing;
      mc mb minio/shared --ignore-existing;
      echo 'Setting bucket policies...';
      mc anonymous set download minio/nextcloud;
      mc anonymous set download minio/media;
      mc anonymous set download minio/shared;
      echo 'Configuring cors...';
      mc cors apply minio/nextcloud /config/cors.json;
      echo 'MinIO initialization complete!';
      "
    depends_on:
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Syncthing P2P Sync
  # ---------------------------------------------------------------------------
  syncthing:
    image: syncthing/syncthing:1.27.6
    container_name: syncthing
    restart: unless-stopped
    networks:
      - storage-net
      - proxy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - STGUIADDRESS=:8384
      - STNOUPGRADE=true
    volumes:
      - syncthing-config:/config
      - ${STORAGE_PATH:-/data}/syncthing:/data
    labels:
      - traefik.enable=true
      - "traefik.http.routers.syncthing.rule=Host(`sync.${DOMAIN}`)"
      - traefik.http.routers.syncthing.entrypoints=websecure
      - traefik.http.routers.syncthing.tls=true
      - traefik.http.services.syncthing.loadbalancer.server.port=8384
      - "traefik.http.routers.syncthing-dav.rule=Host(`sync.${DOMAIN}`) && PathPrefix(`/remote.php/dav`)"
      - traefik.http.routers.syncthing-dav.entrypoints=websecure
      - traefik.http.routers.syncthing-dav.tls=true
      - traefik.http.services.syncthing-dav.loadbalancer.server.port=8384
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8384/rest/noauth/health | grep -q 'OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # FileBrowser - Web File Manager
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:v2.31.2
    container_name: filebrowser
    restart: unless-stopped
    networks:
      - storage-net
      - proxy
    volumes:
      - filebrowser-data:/database
      - ${STORAGE_PATH:-/data}:/srv
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.filebrowser.rule=Host(`files.${DOMAIN}`)"
      - traefik.http.routers.filebrowser.entrypoints=websecure
      - traefik.http.routers.filebrowser.tls=true
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true
  storage-net:
    name: storage-net
    driver: bridge

volumes:
  nextcloud-data:
  nextcloud-db-data:
  nextcloud-redis-data:
  minio-data:
  syncthing-config:
  filebrowser-data: