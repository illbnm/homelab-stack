version: "3.9"

services:
  nextcloud:
    image: nextcloud:29.0.7-fpm-alpine
    container_name: storage-nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_DB: ${NEXTCLOUD_DB:-nextcloud}
      POSTGRES_USER: ${NEXTCLOUD_USER:-nextcloud}
      POSTGRES_PASSWORD: ${NEXTCLOUD_PASSWORD}
      REDIS_HOST: redis
    networks:
      - storage
      - databases

  nextcloud-web:
    image: nginx:1.27-alpine
    container_name: storage-nextcloud-web
    restart: unless-stopped
    volumes:
      - nextcloud_data:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      - nextcloud
    networks:
      - storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/status.php"]
      interval: 20s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: storage-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3

  filebrowser:
    image: filebrowser/filebrowser:v2.31.1
    container_name: storage-filebrowser
    restart: unless-stopped
    volumes:
      - filebrowser_data:/srv
      - filebrowser_db:/database
    ports:
      - "8083:80"
    networks:
      - storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  syncthing:
    image: lscr.io/linuxserver/syncthing:1.27.11
    container_name: storage-syncthing
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - syncthing_config:/config
      - syncthing_data:/data
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
    networks:
      - storage
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8384/"]
      interval: 25s
      timeout: 5s
      retries: 3

networks:
  storage:
    driver: bridge
  databases:
    external: true
    name: databases

volumes:
  nextcloud_data:
  minio_data:
  filebrowser_data:
  filebrowser_db:
  syncthing_config:
  syncthing_data:
