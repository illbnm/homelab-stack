upstream nextcloud-fpm {
    server nextcloud:9000;
}

server {
    listen 80;
    server_name _;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 10G;
    fastcgi_buffers 64 4K;

    root /var/www/html;
    index index.php index.html;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /.well-known/carddav {
        return 301 $scheme://$host/remote.php/dav;
    }
    location = /.well-known/caldav {
        return 301 $scheme://$host/remote.php/dav;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
        return 404;
    }

    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        return 404;
    }

    location / {
        rewrite ^ /index.php;
    }

    location ~ ^\/remote\/(.*) {
        fastcgi_pass nextcloud-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/remote.php;
        fastcgi_param PATH_INFO $1;
        include fastcgi_params;
    }

    location ~ ^\/index.php\/(.*) {
        fastcgi_pass nextcloud-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $1;
        include fastcgi_params;
    }

    location ~ ^\/ocs\/(.*) {
        fastcgi_pass nextcloud-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root/ocs/v1.php;
        fastcgi_param PATH_INFO $1;
        include fastcgi_params;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        fastcgi_pass nextcloud-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    location ~ \.(?:css|js|svg|gif|png|jpg|ico|webp|woff2?)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }

    location ~ \.(?:ttf|eot)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }
}
