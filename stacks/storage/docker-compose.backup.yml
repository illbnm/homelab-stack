services:
  restic-rest-server:
    image: restic/rest-server:0.13.0
    container_name: restic-server
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - restic-data:/data
    environment:
      - OPTIONS=--prometheus --no-auth
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.restic.rule=Host(`restic.${DOMAIN}`)"
      - traefik.http.routers.restic.entrypoints=websecure
      - traefik.http.routers.restic.tls=true
      - traefik.http.services.restic.loadbalancer.server.port=8000
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8000/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  duplicati:
    image: lscr.io/linuxserver/duplicati:2.0.8
    container_name: duplicati
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - duplicati-config:/config
      - /opt/homelab-backups:/backups:ro
      - /:/source:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Asia/Shanghai}
      - CLI_ARGS=
    labels:
      - traefik.enable=true
      - "traefik.http.routers.duplicati.rule=Host(`duplicati.${DOMAIN}`)"
      - traefik.http.routers.duplicati.entrypoints=websecure
      - traefik.http.routers.duplicati.tls=true
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  proxy:
    external: true

volumes:
  restic-data:
  duplicati-config:
