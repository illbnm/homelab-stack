; HomeLab Stack — Nextcloud PHP overrides
; Loaded by /usr/local/etc/php/conf.d/99-homelab.ini

; Memory limit for Nextcloud operations
memory_limit = 512M

; Upload limits
upload_max_filesize = 512M
post_max_size = 512M

; Execution time for large operations
max_execution_time = 3600
max_input_time = 3600

; Output buffering
output_buffering = 0

; Date timezone (overridden by env but good to have a default)
date.timezone = Asia/Shanghai

; OPcache settings for better performance
opcache.enable = 1
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
opcache.save_comments = 1
opcache.revalidate_freq = 60
