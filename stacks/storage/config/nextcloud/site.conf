upstream php-handler {
    server nextcloud-app:9000;
}

server {
    listen 80;
    listen [::]:80;
    server_name nextcloud.*;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nextcloud.*;

    # SSL configuration (handled by Traefik)
    # SSL certificates are managed by Traefik

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Robots-Tag "none" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Path to Nextcloud data
    root /var/www/html;

    # PHP configuration
    client_max_body_size 10G;
    client_body_timeout 300s;
    fastcgi_buffers 64 4K;
    fastcgi_buffer_size 256k;
    fastcgi_busy_buffers_size 256k;
    fastcgi_connect_timeout 300s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_intercept_errors off;
    fastcgi_request_buffering off;

    # Logging
    access_log /var/log/nginx/nextcloud.access;
    error_log /var/log/nginx/nextcloud.error;

    # Main Nextcloud locations
    location = / {
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass php-handler;
        include fastcgi_params;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Make sure .htaccess is not served
    location ~ ^/(?:\.htaccess|data|config|\.git|structure\.xml) {
        deny all;
    }

    # Main Nextcloud rewrite rules
    location / {
        rewrite ^ /index.php$request_uri;
    }

    location ~ ^/(?:index|remote|public|cron|status\.php|ocs/v[12]|updater/.+|ocs-provider/.+)\.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php-handler;
        include fastcgi_params;
    }

    # WebDAV
    location ~ ^/(?:remote|public|cron|status|ocs/v[12]|updater|ocs-provider)(?:$|/) {
        rewrite ^ /index.php$request_uri;
    }

    location ~ ^/(?:updater|ocs-provider)(?:$|/) {
        try_files $uri/ =404;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php-handler;
        include fastcgi_params;
    }

    # Image optimization
    location ~ \.(?:png|html|ttf|ico|jpg|jpeg)$ {
        try_files $uri /index.php$request_uri;
        access_log off;
    }

    # Static assets caching
    location ~ \.(?:css|js|svg|gif|png|html|ttf|woff|ico|jpg|jpeg)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }

    # PHP caching
    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass php-handler;
        include fastcgi_params;
    }

    # Performance: enable caching for static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|avif|woff|woff2|ttf|eot|svg|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Disable access to hidden files
    location /\. {
        deny all;
    }
}