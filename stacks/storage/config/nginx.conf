worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10G;

    fastcgi_buffers 64 4K;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-no-cache no-store private no_last_modified no_etag auth;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/calendar
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    upstream php-handler {
        server nextcloud-fpm:9000;
    }

    server {
        listen 80;
        server_name _;
        root /var/www/html;

        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }

        location = /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location = /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /.well-known/acme-challenge { }

        location ^~ /data {
            location ~ ^/data/(.dat|.part) {
                valid_methods GET HEAD PUT;
                merge_slashes off;
            }
            location ~ ^/data/(.*)$ {
                split_path_info ^/data/(.*)$;
                fastcgi_split_path_info ^(.+\.php)(/.+)$;
                include /etc/nginx/fastcgi_params;
                fastcgi_param PATH_INFO $fastcgi_path_info;
                fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                try_files $fastcgi_script_name =404;
                fastcgi_pass php-handler;
            }
        }

        location ~ ^/(build|tests|config|lib|3rdparty|templates|data)/ {
            valid_methods GET HEAD PUT;
            merge_slashes off;
        }

        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
            return 301 /$uri;
        }

        location ~ ^\/(?:index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|oc[ms]-provider\/.+)\.php(?:$|\/) {
            fastcgi_split_path_info ^(.+\.php)(\/.*)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param PATH_TRANSLATED $document_root$fastcgi_path_info;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            try_files $fastcgi_script_name =404;
            fastcgi_pass php-handler;
        }

        location ~ \.(?:css|js|svg|gif|map)$ {
            try_files $uri /index.php$uri$is_args$args;
            add_header Cache-Control "public, max-age=15778463";
            add_header X-Content-Type-Options nosniff "always";
            add_header X-Permitted-Cross-Domain-Policies "none" "always";
            access_log off;
        }

        location ~ \.(?:wav|mp3|xml|ico|png|html|ttf|otf|cof|swf)$ {
            try_files $uri /index.php$uri$is_args$args;
            add_header Cache-Control "public, max-age=15778463, immutable";
            add_header X-Content-Type-Options nosniff "always";
            add_header X-Permitted-Cross-Domain-Policies "none" "always";
            access_log off;
        }

        location ~ \.(?:css|js|svg|gif|map)$ {
            try_files $uri /index.php$uri$is_args$args;
            add_header Cache-Control "public, max-age=15778463";
            add_header X-Content-Type-Options nosniff "always";
            add_header X-Permitted-Cross-Domain-Policies "none" "always";
            access_log off;
        }

        location ~ \.(?:png|html|ttf|otf|ico|svg)$ {
            try_files $uri /index.php$uri$is_args$args;
            add_header Cache-Control "public, max-age=7776000, immutable";
            add_header X-Content-Type-Options nosniff "always";
            add_header X-Permitted-Cross-Domain-Policies "none" "always";
            access_log off;
        }

        location /apps/rainloop/app/data/{
            auth_basic "Authenticated users";
            auth_basic_user_file /var/www/html/data/.htPASSWD;
        }

        location / {
            try_files $uri /index.php$uri$is_args$args;
            add_header X-Content-Type-Options nosniff "always";
            add_header X-Frame-Options "sameorigin" "always";
            add_header X-Permitted-Cross-Domain-Policies "none" "always";
            add_header X-Robots-Tag "noindex, nofollow" "always";
        }
    }
}
