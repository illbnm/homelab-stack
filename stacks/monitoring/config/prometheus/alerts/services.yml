groups:
  - name: services
    rules:
      - alert: Traefik5xx
        expr: rate(traefik_service_request_duration_seconds_sum{code=~"5.."}[5m]) / rate(traefik_service_request_duration_seconds_sum[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik 5xx error rate > 1%"
          description: "Service {{ $labels.service }} 5xx rate is {{ $value | humanizePercentage }}"

      - alert: HighResponseTime
        expr: histogram_quantile(0.99, rate(traefik_service_request_duration_seconds_bucket[5m])) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "P99 response time > 2s"
          description: "Service {{ $labels.service }} P99 latency is {{ $value }}s"