# Unbound Configuration for Homelab Network Stack
# Recursive DNS resolver — upstream for AdGuard Home

server:
    # Network settings
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    
    # Performance
    num-threads: 2
    prefetch: yes
    prefetch-key: yes
    cache-min-ttl: 300
    cache-max-ttl: 86400
    rrset-cache-size: 100m
    msg-cache-size: 50m
    outgoing-range: 8192
    
    # Security
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: no
    val-clean-additional: yes
    
    # Privacy
    qname-minimisation: yes
    minimal-responses: yes
    refuse-any: yes
    
    # Logging
    verbosity: 0
    use-syslog: no
    logfile: ""
    
    # Access control — allow local networks
    access-control: 0.0.0.0/0 refuse
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 127.0.0.0/8 allow
    
    # Root hints for recursive resolution
    root-hints: "/opt/unbound/etc/unbound/root.hints"
    
    # DNS trust anchor
    auto-trust-anchor-file: "/opt/unbound/etc/unbound/root.key"

# Forward zones for local domain (optional)
# forward-zone:
#     name: "home.arpa."
#     forward-addr: 10.0.0.1