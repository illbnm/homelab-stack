version: "3.9"

services:
  adguard:
    image: adguard/adguardhome:v0.107.52
    container_name: net-adguard
    restart: unless-stopped
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3001:80/tcp"
      - "3000:3000/tcp"
    networks:
      - network_mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

  wireguard:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: net-wireguard
    restart: unless-stopped
    environment:
      WG_HOST: ${WG_HOST:-vpn.homelab.local}
      PASSWORD_HASH: ${WG_PASSWORD_HASH:-$$2a$$12$$...}
      WG_DEFAULT_DNS: 127.0.0.1
    volumes:
      - wireguard_data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - network_mesh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:51821/"]
      interval: 20s
      timeout: 5s
      retries: 3

  cloudflare-ddns:
    image: ghcr.io/favonia/cloudflare-ddns:1.14.0
    container_name: net-cf-ddns
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      DOMAINS: ${DOMAINS:-homelab.local}
      PROXIED: "true"
    networks:
      - network_mesh

  unbound:
    image: mvance/unbound:1.21.1
    container_name: net-unbound
    restart: unless-stopped
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    ports:
      - "5335:53/tcp"
      - "5335:53/udp"
    networks:
      - network_mesh

networks:
  network_mesh:
    driver: bridge

volumes:
  adguard_work:
  adguard_conf:
  wireguard_data:
