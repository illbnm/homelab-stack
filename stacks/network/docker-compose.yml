services:
  unbound:
    image: mvance/unbound:1.21.1
    container_name: unbound
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ../../config/unbound/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"

  adguardhome:
    image: adguard/adguardhome:v0.107.52
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf
      - ../../config/adguard/AdGuardHome.yaml:/opt/adguardhome/conf/AdGuardHome.yaml:ro
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.adguard.rule=Host(`adguard.${DOMAIN}`)"
      - traefik.http.routers.adguard.entrypoints=websecure
      - traefik.http.routers.adguard.tls=true
      - traefik.http.services.adguard.loadbalancer.server.port=3000
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: wg-easy
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - WG_HOST=${WG_HOST:-vpn.${DOMAIN}}
      - PASSWORD=${WG_PASSWORD:-admin}
      - WG_DEFAULT_DNS=1.1.1.1
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - wireguard-data:/etc/wireguard
    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.wgeasy.rule=Host(`wireguard.${DOMAIN}`)"
      - traefik.http.routers.wgeasy.entrypoints=websecure
      - traefik.http.routers.wgeasy.tls=true
      - traefik.http.services.wgeasy.loadbalancer.server.port=51821
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  cloudflare-ddns:
    image: ghcr.io/favonia/cloudflare-ddns:1.14.0
    container_name: cloudflare-ddns
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-unset}
      - DOMAINS=${DOMAIN:-example.com}
      - PROXIED=true
      - TZ=${TZ:-Asia/Shanghai}

networks:
  proxy:
    external: true

volumes:
  adguard-work:
  adguard-conf:
  wireguard-data:
