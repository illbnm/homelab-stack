# AdGuard Home Configuration
# This is a pre-configured AdGuard Home setup with common filter lists
# On first run, AdGuard Home will use this config. Adjust as needed.

http:
  address: 0.0.0.0:3000
  session_ttl: 480h
language: ""

users: []

auth_attempts: 5
block_auth_min: 15
http_proxy: ""

dns:
  bind_hosts:
    - 0.0.0.0
  port: 53
  statistics_interval: 1h
  querylog_enabled: true
  querylog_file_enabled: true
  querylog_interval: 2160h
  querylog_size_memory: 1000
  anonymize_client_ip: false
  protection_enabled: true
  protection_blocking_mode: default
  protection_allowed_clients: []
  protection_disallowed_clients: []
  protection_blocked_services: []
  upstreams:
    # Use Unbound for recursive DNS (no external dependency)
    - 5335
    # Fallback: Cloudflare DoH
    - https://1.1.1.1/dns-query
    # Fallback: Google DoH
    - https://8.8.8.8/dns-query
  upstreams_groups: []
  bootstrap_dns:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.10
  all_servers: true
  fastest_addr: false
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
    - version.bind
    - id.server
    - hostname.bind
  trusted_addresses: []
  rate_limit: 0
  rate_limit_whitelist: []
  refuse_any: true
  upstream_dns_file: ""
  edns_client_subnet: false

filters:
  # AdGuard Base filter
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  # EasyList
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_30.txt
    name: EasyList
    id: 30
  # EasyPrivacy
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_31.txt
    name: EasyPrivacy
    id: 31
  # Peter Lowe's blocklist
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_42.txt
    name: Peter Lowe's blocklist
    id: 42
  # Dan Pollock's hosts file
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_8.txt
    name: Dan Pollock's hosts file
    id: 8

whitelist_filters: []
user_rules: []
dhcp:
  enabled: false
  interface_name: ""
  dhcpv4:
    gateway_ip: ""
    subnet_cidr: ""
    range_start: ""
    range_end: ""
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ""
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false

clients: []
log_compact_queries: false
tls:
  enabled: false
  server_name: ""
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  certificate_chain: ""
  private_key: ""
  certificate_path: ""
  private_key_path: ""