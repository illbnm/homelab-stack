networks:
  homelab:
    external: true

volumes:
  authentik_db:
  authentik_redis:
  authentik_media:
  authentik_certs:
  authentik_templates:

services:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL — Authentik Database
  # ═══════════════════════════════════════════════════════════════
  authentik-postgres:
    image: postgres:16.4-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${AUTHENTIK_PG_USER:-authentik}
      - POSTGRES_PASSWORD=${AUTHENTIK_PG_PASS:?AUTHENTIK_PG_PASS must be set}
      - POSTGRES_DB=${AUTHENTIK_PG_DB:-authentik}
    volumes:
      - authentik_db:/var/lib/postgresql/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_PG_USER:-authentik} -d ${AUTHENTIK_PG_DB:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ═══════════════════════════════════════════════════════════════
  # Redis — Authentik Cache + Message Queue
  # ═══════════════════════════════════════════════════════════════
  authentik-redis:
    image: redis:7.4.0-alpine
    container_name: authentik-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - authentik_redis:/data
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════
  # Authentik Server — OIDC/SAML Provider + Web UI
  # ═══════════════════════════════════════════════════════════════
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY must be set}
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_PG_PASS}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_LOG_LEVEL=info
      # Email (optional, configure for password recovery)
      - AUTHENTIK_EMAIL__HOST=${SMTP_HOST:-}
      - AUTHENTIK_EMAIL__PORT=${SMTP_PORT:-587}
      - AUTHENTIK_EMAIL__USERNAME=${SMTP_USER:-}
      - AUTHENTIK_EMAIL__PASSWORD=${SMTP_PASS:-}
      - AUTHENTIK_EMAIL__USE_TLS=${SMTP_TLS:-true}
      - AUTHENTIK_EMAIL__FROM=${SMTP_FROM:-authentik@${DOMAIN}}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
    networks:
      - homelab
    ports:
      - "9000:9000"
      - "9443:9443"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/-/health/live/"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  # ═══════════════════════════════════════════════════════════════
  # Authentik Worker — Background Tasks (Outposts, Provisioning)
  # ═══════════════════════════════════════════════════════════════
  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY:?AUTHENTIK_SECRET_KEY must be set}
      - AUTHENTIK_POSTGRESQL__HOST=authentik-postgres
      - AUTHENTIK_POSTGRESQL__NAME=${AUTHENTIK_PG_DB:-authentik}
      - AUTHENTIK_POSTGRESQL__USER=${AUTHENTIK_PG_USER:-authentik}
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_PG_PASS}
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_ERROR_REPORTING__ENABLED=false
      - AUTHENTIK_LOG_LEVEL=info
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
    networks:
      - homelab
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A authentik.root.celery inspect ping -d celery@$(hostname) || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s