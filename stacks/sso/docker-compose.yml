# =============================================================================
# HomeLab Stack — SSO Stack
# Services: Authentik (Server + Worker) + PostgreSQL + Redis
#
# Authentik is an open-source Identity Provider supporting OIDC, SAML, LDAP.
# All other stacks authenticate through this stack.
#
# Usage:
#   cd stacks/sso && cp .env.example .env && nano .env
#   docker compose up -d
#   # Wait ~60s for first boot, then run:
#   ../../scripts/setup-authentik.sh
# =============================================================================

x-authentik-base: &authentik-base
  image: ghcr.io/goauthentik/server:2024.8.3
  # CN mirror fallback (uncomment if ghcr.io is inaccessible):
  # image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/ghcr.io/goauthentik/server:2024.8.3
  env_file:
    - .env
  environment:
    AUTHENTIK_REDIS__HOST: redis
    AUTHENTIK_REDIS__PASSWORD: ${AUTHENTIK_REDIS_PASSWORD}
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    AUTHENTIK_LOG_LEVEL: warning

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Authentik database
  # ---------------------------------------------------------------------------
  postgresql:
    image: postgres:16-alpine
    container_name: authentik-postgres
    restart: unless-stopped
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTGRES_DB: authentik
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - sso

  # ---------------------------------------------------------------------------
  # Redis — Authentik cache/queue
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    command: redis-server --requirepass ${AUTHENTIK_REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${AUTHENTIK_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sso

  # ---------------------------------------------------------------------------
  # Authentik Server — Web UI + API + OIDC/SAML endpoints
  # ---------------------------------------------------------------------------
  authentik-server:
    <<: *authentik-base
    container_name: authentik-server
    restart: unless-stopped
    command: server
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # Expose outpost port for embedded outpost
      - "traefik.http.routers.authentik-outpost.rule=HostRegexp(`{subdomain:[a-z0-9-]+}.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io`)"
      - "traefik.http.routers.authentik-outpost.entrypoints=websecure"
      - "traefik.http.routers.authentik-outpost.tls.certresolver=letsencrypt"
      - "traefik.http.routers.authentik-outpost.service=authentik"
    networks:
      - sso
      - proxy

  # ---------------------------------------------------------------------------
  # Authentik Worker — Background tasks (flows, policies, outposts)
  # ---------------------------------------------------------------------------
  authentik-worker:
    <<: *authentik-base
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sso

volumes:
  postgresql_data:
  redis_data:
  authentik_media:
  authentik_templates:

networks:
  sso:
    name: sso
  proxy:
    external: true
---
# =============================================================================
# SSO Stack — Authentik (OIDC/SSO Provider)
# =============================================================================
# Services:
#   - authentik-server: Main Authentik application (OIDC/SAML provider)
#   - authentik-worker: Background task worker
#   - authentik-db:     PostgreSQL database for Authentik
#   - authentik-redis:  Redis cache for Authentik
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Authentik Database
  # ---------------------------------------------------------------------------
  authentik-db:
    image: postgres:16.4-alpine
    container_name: authentik-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - authentik-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    networks:
      - authentik

  # ---------------------------------------------------------------------------
  # Redis — Authentik Cache
  # ---------------------------------------------------------------------------
  authentik-redis:
    image: redis:7.4.0-alpine
    container_name: authentik-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - authentik

  # ---------------------------------------------------------------------------
  # Authentik Server — OIDC/SAML Provider
  # ---------------------------------------------------------------------------
  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik-server-data:/data
      - authentik-server-media:/media
    networks:
      - authentik
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
      # ForwardAuth middleware for Traefik
      - "traefik.http.middlewares.authentik.forwardauth.address=http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      - "traefik.http.middlewares.authentik.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authentik.forwardauth.authResponseHeaders=X-authentik-username,X-authentik-groups,X-authentik-email,X-authentik-name"

  # ---------------------------------------------------------------------------
  # Authentik Worker — Background Tasks
  # ---------------------------------------------------------------------------
  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik-server-data:/data
      - authentik-server-media:/media
    networks:
      - authentik

# =============================================================================
# Volumes
# =============================================================================
volumes:
  authentik-db-data:
  authentik-server-data:
  authentik-server-media:

# =============================================================================
# Networks
# =============================================================================
networks:
  authentik:
    driver: bridge
  traefik:
    external: true
    name: proxy
