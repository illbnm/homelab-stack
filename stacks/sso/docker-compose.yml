version: '3.8'

services:
  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - sso-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK__POSTGRES__PASSWORD}
      POSTGRES_USER: ${AUTHENTIK__POSTGRES__USER}
      POSTGRES_DB: ${AUTHENTIK__POSTGRES__DB}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - sso-internal

  server:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    networks:
      - sso-internal
      - traefik-public
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK__POSTGRES__USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK__POSTGRES__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK__POSTGRES__DB}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
      - authentik_media:/media
      - authentik_custom_templates:/templates
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  worker:
    image: ghcr.io/goauthentik/server:latest
    restart: unless-stopped
    command: worker
    networks:
      - sso-internal
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK__POSTGRES__USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK__POSTGRES__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK__POSTGRES__DB}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
      - authentik_media:/media
      - authentik_custom_templates:/templates

networks:
  sso-internal:
    internal: true
  traefik-public:
    external: true

volumes:
  postgres_data:
  authentik_media:
  authentik_custom_templates:
