# =============================================================================
# HomeLab Stack — SSO Stack (Authentik)
# Services: Authentik Server + Worker + PostgreSQL + Redis
#
# Usage:
#   cd stacks/sso && cp .env.example .env && nano .env
#   docker compose up -d
#   # Wait for healthchecks, then bootstrap providers/applications:
#   ../../scripts/authentik-setup.sh --dry-run && ../../scripts/authentik-setup.sh
# =============================================================================

name: homelab-sso

networks:
  sso:
    name: sso
    driver: bridge
  proxy:
    name: proxy          # shared with Traefik stack
    external: true

services:
  authentik-db:
    image: postgres:16.4-alpine
    container_name: authentik-db
    restart: unless-stopped
    networks: [sso]
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  authentik-redis:
    image: redis:7.4.0-alpine
    container_name: authentik-redis
    restart: unless-stopped
    networks: [sso]
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - authentik-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-server
    restart: unless-stopped
    command: server
    networks: [sso, proxy]
    depends_on:
      authentik-db:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:?set}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:?set}   # used by authentik-setup.sh
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:9000
      AUTHENTIK_LISTEN__METRICS: 0.0.0.0:9300
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - ../../config/authentik/blueprints:/blueprints:ro
    healthcheck:
      # /-/health/ready/ returns 200 only when migrations + workers are ready
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9000/-/health/ready/"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.authentik.rule: "Host(`${AUTHENTIK_DOMAIN}`)"
      traefik.http.routers.authentik.entrypoints: websecure
      traefik.http.routers.authentik.tls.certresolver: letsencrypt
      traefik.http.services.authentik.loadbalancer.server.port: "9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.8.3
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    networks: [sso]
    user: root    # required for /media + /certs access in 2024.8
    depends_on:
      authentik-server:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
      - ../../config/authentik/blueprints:/blueprints:ro

volumes:
  authentik-db:
  authentik-redis:
  authentik-media:
  authentik-templates:
