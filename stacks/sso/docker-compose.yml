import logging
from typing import Dict, Any, List, Union

logging.basicConfig(
    level=logging.INFO,
    format="%(asctime)s %(levelname)s %(name)s - %(message)s",
)
logger = logging.getLogger(__name__)

def _service(
    name: str,
    image: str,
    env: Union[Dict[str, str], None] = None,
    depends_on: Union[Dict[str, Dict[str, Any]], None] = None,
    healthcheck: Union[Dict[str, Any], None] = None,
    command: Union[str, List[str], None] = None,
    volumes: Union[List[str], None] = None,
    networks: Union[List[str], None] = None,
) -> Dict[str, Any]:
    """Create a Docker‑Compose service definition."""
    service: Dict[str, Any] = {"image": image}
    if env:
        service["environment"] = env
    if command:
        service["command"] = command
    if depends_on:
        service["depends_on"] = depends_on
    if healthcheck:
        service["healthcheck"] = healthcheck
    if volumes:
        service["volumes"] = volumes
    if networks:
        service["networks"] = networks
    return service


def _healthcheck(
    command: Union[str, List[str]],
    interval: str = "30s",
    retries: int = 3,
) -> Dict[str, Any]:
    """Return a health‑check configuration."""
    return {"test": command, "interval": interval, "retries": retries}


def build_compose(domain: str) -> Dict[str, Any]:
    """Construct the Docker‑Compose configuration for the SSO stack."""
    networks = {"sso": {"driver": "bridge"}}
    volumes = {
        "postgres_data": {"driver": "local"},
        "authentik_media": {"driver": "local"},
        "authentik_custom_templates": {"driver": "local"},
    }

    # Authentik server
    server = _service(
        name="authentik_server",
        image="ghcr.io/goauthentik/server:2024.8.3",
        env={
            "AUTHENTIK_HOST": f"https://auth.{domain}",
            "AUTHENTIK_INSECURE_COOKIE": "false",
            "AUTHENTIK_REDIS__HOST": "redis",
            "AUTHENTIK_POSTGRESQL__HOST": "postgres",
            "AUTHENTIK_POSTGRESQL__USER": "authentik",
            "AUTHENTIK_POSTGRESQL__NAME": "authentik",
            "AUTHENTIK_POSTGRESQL__PASSWORD": "${POSTGRES_PASSWORD}",
        },
        depends_on={"postgres": {"condition": "service_healthy"}, "redis": {"condition": "service_healthy"}},
        healthcheck=_healthcheck(
            command=["CMD", "curl", "-f", "http://localhost:9000/health/"],
            interval="15s",
            retries=5,
        ),
        volumes=["authentik_media:/media", "authentik_custom_templates:/templates"],
        networks=["sso"],
    )

    # Authentik worker
    worker = _service(
        name="authentik_worker",
        image="ghcr.io/goauthentik/server:2024.8.3",
        command="worker",
        env={
            "AUTHENTIK_HOST": f"https://auth.{domain}",
            "AUTHENTIK_INSECURE_COOKIE": "false",
            "AUTHENTIK_REDIS__HOST": "redis",
            "AUTHENTIK_POSTGRESQL__HOST": "postgres",
            "AUTHENTIK_POSTGRESQL__USER": "authentik",
            "AUTHENTIK_POSTGRESQL__NAME": "authentik",
            "AUTHENTIK_POSTGRESQL__PASSWORD": "${POSTGRES_PASSWORD}",
        },
        depends_on={"postgres": {"condition": "service_healthy"}, "redis": {"condition": "service_healthy"}},
        healthcheck=_healthcheck(
            command=["CMD", "curl", "-f", "http://localhost:9000/health/"],
            interval="15s",
            retries=5,
        ),
        networks=["sso"],
    )

    # PostgreSQL
    postgres = _service(
        name="postgres",
        image="postgres:16.4-alpine",
        env={
            "POSTGRES_USER": "authentik",
            "POSTGRES_PASSWORD": "${POSTGRES_PASSWORD}",
            "POSTGRES_DB": "authentik",
        },
        healthcheck=_healthcheck(
            command=["CMD", "pg_isready", "-U", "authentik"],
            interval="10s",
            retries=5,
        ),
        volumes=["postgres_data:/var/lib/postgresql/data"],
        networks=["sso"],
    )

    # Redis
    redis = _service(
        name="redis",
        image="redis:7.4.0-alpine",
        healthcheck=_healthcheck(
            command=["CMD", "redis-cli", "ping"],
            interval="10s",
            retries=5,
        ),
        networks=["sso"],
    )

    # Traefik ForwardAuth
    traefik = _service(
        name="traefik",
        image="traefik:v2.11",
        command=[
            "--providers.docker",
            "--providers.docker.exposedbydefault=false",
            "--entrypoints.web.address=:80",
            "--entrypoints.websecure.address=:443",
            "--certificatesresolvers.myresolver.acme.tlschallenge=true",
            "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}",
            "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json",
            "--log.level=INFO",
        ],
        ports=["80:80", "443:443"],
        volumes=[
            "/var/run/docker.sock:/var/run/docker.sock:ro",
            "letsencrypt:/letsencrypt",
        ],
        networks=["sso"],
    )

    return {
        "version": "3.9",
        "services": {
            "authentik_server": server,
            "authentik_worker": worker,
            "postgres": postgres,
            "redis": redis,
            "traefik": traefik,
        },
        "networks": networks,
        "volumes": volumes,
    }
