name: homelab-sso
services:
  authentik:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik
    restart: unless-stopped
    networks: [proxy, sso]
    volumes: [authentik_media:/media, authentik_templates:/templates, authentik_certs:/certs]
    environment: [TZ=${TZ:-UTC}, AUTHENTIK_SECRET_KEY=***
    command: server
    healthcheck: {test: ["CMD","curl","-f","http://localhost:9000/-/health/"], interval: 30s, timeout: 10s, retries: 3, start_period: 30s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=https"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.tls.certresolver=letsencrypt"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:latest
    container_name: authentik-worker
    restart: unless-stopped
    networks: [sso]
    volumes: [authentik_media:/media, authentik_certs:/certs, /var/run/docker.sock:/var/run/docker.sock]
    environment: [TZ=${TZ:-UTC}, AUTHENTIK_SECRET_KEY=***
    command: worker
    labels: ["traefik.enable=false"]

  authentik-db:
    image: postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped
    networks: [sso]
    volumes: [authentik_db:/var/lib/postgresql/data]
    environment: [POSTGRES_DB=authentik, POSTGRES_USER=authentik, POSTGRES_PASSWORD=${AUTH…ASS}]
    healthcheck: {test: ["CMD","pg_isready","-U","authentik"], interval: 30s, timeout: 10s, retries: 5, start_period: 20s}
    labels: ["traefik.enable=false"]

  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    restart: unless-stopped
    networks: [sso]
    volumes: [authentik_redis:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 30s, timeout: 10s, retries: 3}
    labels: ["traefik.enable=false"]

networks:
  proxy: {external: true, name: proxy}
  sso: {driver: bridge}
volumes:
  authentik_media: {} authentik_templates: {} authentik_certs: {}
  authentik_db: {} authentik_redis: {}
