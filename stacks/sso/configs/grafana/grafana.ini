# =============================================================================
# Grafana OIDC Configuration for Authentik SSO
#
# Place this file at: config/grafana/grafana.ini
# Or use environment variables in docker-compose.yml (preferred)
#
# Docs: https://grafana.io/docs/grafana/latest/setup-grafana/configure-security/
# =============================================================================

[server]
domain = grafana.${DOMAIN}
root_url = https://grafana.${DOMAIN}

[auth.generic_oauth]
enabled = true
name = Authentik
client_id = ${GRAFANA_OAUTH_CLIENT_ID}
client_secret = ${GRAFANA_OAUTH_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://${AUTHENTIK_DOMAIN}/application/o/authorize/
token_url = https://${AUTHENTIK_DOMAIN}/application/o/token/
api_url = https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
signout_redirect_url = https://${AUTHENTIK_DOMAIN}/application/o/grafana/end-session/

# Role mapping: map Authentik groups to Grafana roles
# Create these groups in Authentik admin UI
role_attribute_path = contains(groups, 'homelab-admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'

# Auto-assign new users to the Viewer role
auto_assign_org = true
auto_assign_org_role = Viewer

[users]
allow_sign_up = true
auto_assign_org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
