services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ${MEDIA_PATH:-/opt/media}:/media:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.jellyfin.rule=Host(`media.${DOMAIN}`)"
      - traefik.http.routers.jellyfin.entrypoints=websecure
      - traefik.http.routers.jellyfin.tls=true
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.9
    container_name: sonarr
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - sonarr-config:/config
      - ${MEDIA_PATH:-/opt/media}/tv:/tv
      - ${DOWNLOAD_PATH:-/opt/downloads}:/downloads
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
    labels:
      - traefik.enable=true
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - traefik.http.routers.sonarr.entrypoints=websecure
      - traefik.http.routers.sonarr.tls=true
      - traefik.http.services.sonarr.loadbalancer.server.port=8989

  radarr:
    image: lscr.io/linuxserver/radarr:5.11.0
    container_name: radarr
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - radarr-config:/config
      - ${MEDIA_PATH:-/opt/media}/movies:/movies
      - ${DOWNLOAD_PATH:-/opt/downloads}:/downloads
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
    labels:
      - traefik.enable=true
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - traefik.http.routers.radarr.entrypoints=websecure
      - traefik.http.routers.radarr.tls=true
      - traefik.http.services.radarr.loadbalancer.server.port=7878

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent
    restart: unless-stopped
    networks:
      - proxy
      - internal
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbit-config:/config
      - ${DOWNLOAD_PATH:-/opt/downloads}:/downloads
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8080
    labels:
      - traefik.enable=true
      - "traefik.http.routers.qbit.rule=Host(`downloads.${DOMAIN}`)"
      - traefik.http.routers.qbit.entrypoints=websecure
      - traefik.http.routers.qbit.tls=true
      - traefik.http.services.qbit.loadbalancer.server.port=8080

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.24.3
    container_name: prowlarr
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - prowlarr-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PUID=1000
      - PGID=1000
    labels:
      - traefik.enable=true
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - traefik.http.routers.prowlarr.entrypoints=websecure
      - traefik.http.routers.prowlarr.tls=true
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

networks:
  internal:
    external: true
  proxy:
    external: true

volumes:
  jellyfin-config:
  jellyfin-cache:
  sonarr-config:
  radarr-config:
  qbit-config:
  prowlarr-config:
