version: "3.8"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.9.11
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin-config:/config
      - ${MEDIA_DATA_DIR:-./data}/media:/data/media

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.9
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${SONARR_PORT:-8989}:8989"
    volumes:
      - sonarr-config:/config
      - ${MEDIA_DATA_DIR:-./data}:/data

  radarr:
    image: lscr.io/linuxserver/radarr:5.10.4
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${RADARR_PORT:-7878}:7878"
    volumes:
      - radarr-config:/config
      - ${MEDIA_DATA_DIR:-./data}:/data

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - WEBUI_PORT=8085
    ports:
      - "${QBIT_WEBUI_PORT:-8085}:8085"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - ${MEDIA_DATA_DIR:-./data}/torrents:/data/torrents

volumes:
  jellyfin-config:
  sonarr-config:
  radarr-config:
  qbittorrent-config:
