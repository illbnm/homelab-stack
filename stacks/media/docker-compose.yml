# Media Stack - Jellyfin + Sonarr + Radarr + qBittorrent + Prowlarr + Jellyseerr
# 媒体服务栈：媒体服务器 + 自动下载 + 索引器管理

x-traefik-labels: &traefik-labels
  - "traefik.enable=true"
  - "traefik.http.routers.${ROUTER:-media}.rule=Host(`${DOMAIN}`)"
  - "traefik.http.routers.${ROUTER:-media}.entrypoints=websecure"
  - "traefik.http.routers.${ROUTER:-media}.tls.certresolver=letsencrypt"
  - "traefik.http.services.${ROUTER:-media}.loadbalancer.server.port=${PORT}"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ==================== Jellyfin ====================
  jellyfin:
    image: jellyfin/jellyfin:10.9.7
    container_name: jellyfin
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    group_add:
      - "root"
    devices:
      - /dev/dri:/dev/dri  # 硬件转码（可选）
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${DOMAIN}
      - JELLYFIN_EnableExternalLogLevel=true
    volumes:
      - jellyfin-config:/config
      - jellyfin-data:/cache
      - /data/media:/data/media:ro  # 媒体库（只读）
    networks:
      - traefik-public
      - media-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]

  # ==================== Sonarr ====================
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: sonarr
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
    volumes:
      - sonarr-config:/config
      - /data/torrents:/data/torrents:rw  # 下载目录
      - /data/media/tv:/data/media/tv:rw  # 媒体库（读写）
    networks:
      - traefik-public
      - media-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]

  # ==================== Radarr ====================
  radarr:
    image: lscr.io/linuxserver/radarr:5.14.0
    container_name: radarr
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
    volumes:
      - radarr-config:/config
      - /data/torrents:/data/torrents:rw  # 下载目录
      - /data/media/movies:/data/media/movies:rw  # 媒体库（读写）
    networks:
      - traefik-public
      - media-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]

  # ==================== Prowlarr ====================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.25.0
    container_name: prowlarr
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
    volumes:
      - prowlarr-config:/config
    networks:
      - traefik-public
      - media-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]

  # ==================== qBittorrent ====================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: qbittorrent
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - qbittorrent-config:/config
      - /data/torrents:/data/torrents:rw  # 下载目录
    networks:
      - traefik-public
      - media-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080"]

  # ==================== Jellyseerr ====================
  jellyseerr:
    image: fallenbagel/jellyseerr:2.1.1
    container_name: jellyseerr
    restart: unless-stopped
    user: ${PUID:-1000}:${PGID:-1000}
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Shanghai
      - LOG_LEVEL=debug
      - JELLYFIN_TYPE=jellyfin
    volumes:
      - jellyseerr-config:/app/config
    networks:
      - traefik-public
      - media-internal
    depends_on:
      jellyfin:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`jellyseerr.${DOMAIN}`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:5055/api/v1/status"]

networks:
  traefik-public:
    external: true
  media-internal:
    driver: bridge

volumes:
  jellyfin-config:
  jellyfin-data:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  qbittorrent-config:
  jellyseerr-config:
