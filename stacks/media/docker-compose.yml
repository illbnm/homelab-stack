name: homelab-media
services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks: [proxy]
    volumes: [jellyfin_config:/config, jellyfin_cache:/cache, ${MEDIA_DIR:-./media}:/media:ro]
    environment: [TZ=${TZ:-UTC}]
    devices: [/dev/dri:/dev/dri]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8096"], interval: 30s, timeout: 10s, retries: 3, start_period: 30s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`media.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=https"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    networks: [proxy]
    volumes: [sonarr_data:/config, ${MEDIA_DIR:-./media}:/media, /mnt/downloads:/downloads]
    environment: [PUID=1000, PGID=1000, TZ=${TZ:-UTC}]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8989"], interval: 30s, timeout: 10s, retries: 3, start_period: 20s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=https"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    networks: [proxy]
    volumes: [radarr_data:/config, ${MEDIA_DIR:-./media}:/media, /mnt/downloads:/downloads]
    environment: [PUID=1000, PGID=1000, TZ=${TZ:-UTC}]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:7878"], interval: 30s, timeout: 10s, retries: 3, start_period: 20s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=https"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    networks: [proxy]
    volumes: [qb_data:/config, /mnt/downloads:/downloads]
    environment: [PUID=1000, PGID=1000, TZ=${TZ:-UTC}]
    ports: ["6881:6881/tcp", "6881:6881/udp"]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8080"], interval: 30s, timeout: 10s, retries: 3, start_period: 20s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`torrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=https"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

networks: {proxy: {external: true, name: proxy}}
volumes: {jellyfin_config: {}, jellyfin_cache: {}, sonarr_data: {}, radarr_data: {}, qb_data: {}}
