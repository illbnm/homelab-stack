version: "3.9"

services:
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: media-jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - ${MEDIA_ROOT:-/data/media}:/data/media:ro
    ports:
      - "8096:8096"
    networks:
      - media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: media-sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - sonarr_config:/config
      - ${MEDIA_ROOT:-/data/media}/tv:/data/media/tv
      - ${DOWNLOADS_ROOT:-/data/torrents}:/data/torrents
    ports:
      - "8989:8989"
    networks:
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8989/ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  radarr:
    image: lscr.io/linuxserver/radarr:5.8.1
    container_name: media-radarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - radarr_config:/config
      - ${MEDIA_ROOT:-/data/media}/movies:/data/media/movies
      - ${DOWNLOADS_ROOT:-/data/torrents}:/data/torrents
    ports:
      - "7878:7878"
    networks:
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7878/ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:1.22.0
    container_name: media-prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - prowlarr_config:/config
    ports:
      - "9696:9696"
    networks:
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9696/ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: media-qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8085
    volumes:
      - qbit_config:/config
      - ${DOWNLOADS_ROOT:-/data/torrents}:/data/torrents
    ports:
      - "8085:8085"
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8085/"]
      interval: 20s
      timeout: 5s
      retries: 3

  jellyseerr:
    image: fallenbagel/jellyseerr:2.1.1
    container_name: media-jellyseerr
    restart: unless-stopped
    environment:
      LOG_LEVEL: debug
      TZ: ${TZ:-UTC}
    volumes:
      - jellyseerr_config:/app/config
    ports:
      - "5055:5055"
    networks:
      - media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5055/api/v1/status"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  media:
    driver: bridge

volumes:
  jellyfin_config:
  jellyfin_cache:
  sonarr_config:
  radarr_config:
  prowlarr_config:
  qbit_config:
  jellyseerr_config:
