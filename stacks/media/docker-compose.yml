name: homelab-media

services:
  qbittorrent:
    # 国内镜像替换: m.daocloud.io/lscr.io/linuxserver/qbittorrent:4.6.7
    image: lscr.io/linuxserver/qbittorrent:4.6.7
    container_name: homelab-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      WEBUI_PORT: "8080"
    volumes:
      - "${CONFIG_ROOT:-./config}/qbittorrent:/config"
      - "${DATA_ROOT:?DATA_ROOT is required}/torrents:/data/torrents"
    ports:
      - "6881:6881"
      - "6881:6881/udp"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qbittorrent.rule=Host(`qb.${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qbittorrent.middlewares=authentik@file"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  prowlarr:
    # 国内镜像替换: m.daocloud.io/lscr.io/linuxserver/prowlarr:1.22.0
    image: lscr.io/linuxserver/prowlarr:1.22.0
    container_name: homelab-prowlarr
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${CONFIG_ROOT:-./config}/prowlarr:/config"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.prowlarr.middlewares=authentik@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  sonarr:
    # 国内镜像替换: m.daocloud.io/lscr.io/linuxserver/sonarr:4.0.11
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: homelab-sonarr
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${CONFIG_ROOT:-./config}/sonarr:/config"
      - "${DATA_ROOT}/:/data"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sonarr.middlewares=authentik@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  radarr:
    # 国内镜像替换: m.daocloud.io/lscr.io/linuxserver/radarr:5.8.1
    image: lscr.io/linuxserver/radarr:5.8.1
    container_name: homelab-radarr
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
      prowlarr:
        condition: service_healthy
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${CONFIG_ROOT:-./config}/radarr:/config"
      - "${DATA_ROOT}/:/data"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.routers.radarr.middlewares=authentik@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  jellyfin:
    # 国内镜像替换: docker.m.daocloud.io/jellyfin/jellyfin:10.9.11
    image: jellyfin/jellyfin:10.9.11
    container_name: homelab-jellyfin
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Asia/Shanghai}"
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN}"
    volumes:
      - "${CONFIG_ROOT:-./config}/jellyfin:/config"
      - "${DATA_ROOT}/media:/data/media:ro"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M

  jellyseerr:
    # 国内镜像替换: docker.m.daocloud.io/fallenbagel/jellyseerr:2.1.1
    image: fallenbagel/jellyseerr:2.1.1
    container_name: homelab-jellyseerr
    restart: unless-stopped
    depends_on:
      jellyfin:
        condition: service_healthy
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    environment:
      LOG_LEVEL: "info"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${CONFIG_ROOT:-./config}/jellyseerr:/app/config"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyseerr.rule=Host(`requests.${DOMAIN}`)"
      - "traefik.http.routers.jellyseerr.entrypoints=websecure"
      - "traefik.http.routers.jellyseerr.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyseerr.loadbalancer.server.port=5055"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  proxy:
    external: true
