name: homelab-robustness
services:
  china-mirror:
    image: alpine:latest
    container_name: china-mirror-proxy
    restart: unless-stopped
    networks: [proxy, robustness]
    command: sh -c "apk add --no-cache squid && squid -N -d 1"
    environment: [TZ=${TZ:-UTC}]
    cap_add: [NET_ADMIN, NET_RAW]
    labels: ["traefik.enable=false"]

  nginx-reverse-proxy:
    image: nginx:1.27-alpine
    container_name: cn-nginx-proxy
    restart: unless-stopped
    networks: [proxy, robustness]
    volumes: [../../config/nginx/nginx.cnf:/etc/nginx/nginx.cnf:ro]
    environment: [TZ=${TZ:-UTC}]
    healthcheck: {test: ["CMD","nginx","-t"], interval: 30s, timeout: 10s, retries: 3}
    labels: ["traefik.enable=false"]

  update-checker:
    image: containrrr/watchtower:latest
    container_name: watchtower-cn
    restart: unless-stopped
    networks: [robustness]
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    environment: [TZ=${TZ:-UTC}, WATCHTOWER_CLEANUP=true, WATCHTOWER_SCHEDULE=0 0 3 * * *]
    labels: ["traefik.enable=false"]

networks:
  proxy: {external: true, name: proxy}
  robustness: {driver: bridge}
