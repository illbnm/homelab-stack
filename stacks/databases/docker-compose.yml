name: homelab-databases

services:
  postgres:
    # 国内镜像替换: docker.m.daocloud.io/library/postgres:16.4-alpine
    image: postgres:16.4-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_ROOT_PASSWORD:?POSTGRES_ROOT_PASSWORD is required}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${DATA_ROOT:-./data}/postgres:/var/lib/postgresql/data"
      - "./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

  redis:
    # 国内镜像替换: docker.m.daocloud.io/library/redis:7.4.0-alpine
    image: redis:7.4.0-alpine
    container_name: homelab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - "${DATA_ROOT:-./data}/redis:/data"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  mariadb:
    # 国内镜像替换: docker.m.daocloud.io/library/mariadb:11.5.2
    image: mariadb:11.5.2
    container_name: homelab-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "${DATA_ROOT:-./data}/mariadb:/var/lib/mysql"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 25s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  pgadmin:
    # 国内镜像替换: docker.m.daocloud.io/dpage/pgadmin4:8.11
    image: dpage/pgadmin4:8.11
    container_name: homelab-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL:?PGADMIN_EMAIL is required}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD:?PGADMIN_PASSWORD is required}"
    volumes:
      - "${DATA_ROOT:-./data}/pgadmin:/var/lib/pgadmin"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pgadmin.middlewares=authentik@file"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis-commander:
    # 国内镜像替换: docker.m.daocloud.io/rediscommander/redis-commander:0.8.1
    image: rediscommander/redis-commander:0.8.1
    container_name: homelab-redis-commander
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD}"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-ui.rule=Host(`redis.${DOMAIN}`)"
      - "traefik.http.routers.redis-ui.entrypoints=websecure"
      - "traefik.http.routers.redis-ui.tls.certresolver=letsencrypt"
      - "traefik.http.routers.redis-ui.middlewares=authentik@file"
      - "traefik.http.services.redis-ui.loadbalancer.server.port=8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  proxy:
    external: true
  internal:
    external: true
