# =============================================================================
# HomeLab Stack — Shared Databases Stack
# PostgreSQL (multi-tenant) + Redis + MariaDB + pgAdmin + Redis Commander
#
# All services connect via internal 'databases' network.
# Only pgAdmin is exposed through Traefik.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — Primary database (multi-tenant via separate databases)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    container_name: homelab-postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - databases

  # ---------------------------------------------------------------------------
  # Redis — Cache and queue (multi-tenant via DB number)
  # DB 0: Authentik | DB 1: Outline | DB 2: Gitea | DB 3: Nextcloud | DB 4: Grafana
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4.0-alpine
    container_name: homelab-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - databases

  # ---------------------------------------------------------------------------
  # MariaDB — MySQL-compatible (optional, for services that require MySQL)
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.5.2
    container_name: homelab-mariadb
    restart: unless-stopped
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - databases

  # ---------------------------------------------------------------------------
  # pgAdmin — PostgreSQL web admin interface
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: homelab-pgadmin
    restart: unless-stopped
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@homelab.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`${PGADMIN_DOMAIN}`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pgadmin.middlewares=authentik@file"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    networks:
      - databases
      - proxy

  # ---------------------------------------------------------------------------
  # Redis Commander — Redis web admin interface
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: homelab-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.redis-commander.rule=Host(`${REDIS_COMMANDER_DOMAIN}`)"
      - "traefik.http.routers.redis-commander.entrypoints=websecure"
      - "traefik.http.routers.redis-commander.tls.certresolver=letsencrypt"
      - "traefik.http.routers.redis-commander.middlewares=authentik@file"
      - "traefik.http.services.redis-commander.loadbalancer.server.port=8081"
    networks:
      - databases
      - proxy

volumes:
  postgres_data:
  redis_data:
  mariadb_data:
  pgadmin_data:

networks:
  databases:
    name: databases
  proxy:
    external: true
    name: proxy
