     1|services:
     2|  # ---------------------------------------------------------------------------
     3|  # Gitea — Self-hosted Git service
     4|  # URL: https://git.${DOMAIN}
     5|  # ---------------------------------------------------------------------------
     6|  gitea:
     7|    image: gitea/gitea:1.22.3
     8|    container_name: gitea
     9|    restart: unless-stopped
    10|    networks:
    11|      - proxy
    12|      - databases
    13|    volumes:
    14|      - gitea-data:/data
    15|    environment:
    16|      - USER_UID=${PUID:-1000}
    17|      - USER_GID=${PGID:-1000}
    18|      - GITEA__database__DB_TYPE=postgres
    19|      - GITEA__database__HOST=homelab-postgres:5432
    20|      - GITEA__database__NAME=gitea
    21|      - GITEA__database__USER=gitea
    22|      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    23|      - GITEA__server__DOMAIN=${DOMAIN}
    24|      - GITEA__server__ROOT_URL=https://git.${DOMAIN}
    25|      - GITEA__server__HTTP_PORT=3000
    26|      - GITEA__security__INSTALL_LOCK=true
    27|      - GITEA__mailer__ENABLED=false
    28|      - GITEA__oauth2__ENABLE=true
    29|      - GITEA__oauth2__JWT_SECRET=${GITEA_OAUTH2_JWT_SECRET}
    30|      - GITEA__service__DISABLE_REGISTRATION=true
    31|    labels:
    32|      - traefik.enable=true
    33|      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)"
    34|      - traefik.http.routers.gitea.entrypoints=websecure
    35|      - traefik.http.routers.gitea.tls=true
    36|      - traefik.http.services.gitea.loadbalancer.server.port=3000
    37|    healthcheck:
    38|      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
    39|      interval: 30s
    40|      timeout: 10s
    41|      retries: 3
    42|      start_period: 60s
    43|
    44|  # ---------------------------------------------------------------------------
    45|  # Vaultwarden — Bitwarden-compatible password manager
    46|  # URL: https://vault.${DOMAIN}
    47|  # ---------------------------------------------------------------------------
    48|  vaultwarden:
    49|    image: vaultwarden/server:1.32.0
    50|    container_name: vaultwarden
    51|    restart: unless-stopped
    52|    networks:
    53|      - proxy
    54|    volumes:
    55|      - vaultwarden-data:/data
    56|    environment:
    57|      - TZ=${TZ:-Asia/Shanghai}
    58|      - DOMAIN=https://vault.${DOMAIN}
    59|      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    60|      - SIGNUPS_ALLOWED=false
    61|      - WEBSOCKET_ENABLED=true
    62|      - SMTP_HOST=
    63|      - LOG_LEVEL=warn
    64|    labels:
    65|      - traefik.enable=true
    66|      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
    67|      - traefik.http.routers.vaultwarden.entrypoints=websecure
    68|      - traefik.http.routers.vaultwarden.tls=true
    69|      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    70|      - "traefik.http.routers.vaultwarden-ws.rule=Host(`vault.${DOMAIN}`) && Path(`/notifications/hub`)"
    71|      - traefik.http.routers.vaultwarden-ws.entrypoints=websecure
    72|      - traefik.http.routers.vaultwarden-ws.tls=true
    73|      - traefik.http.services.vaultwarden-ws.loadbalancer.server.port=3012
    74|    healthcheck:
    75|      test: ["CMD-SHELL", "curl -sf http://localhost:80/alive || exit 1"]
76|   interval: 30s
timeout: 10s
retries: 3
start_period: 10s
    77|
    78|  # ---------------------------------------------------------------------------
    79|  # Outline — Team knowledge base
    80|  # URL: https://outline.${DOMAIN}
    81|  # ---------------------------------------------------------------------------
    82|  outline:
    83|    image: outlinewiki/outline:0.79.0
    84|    container_name: outline
    85|    restart: unless-stopped
    86|    networks:
    87|      - proxy
    88|      - databases
    89|    volumes:
    90|      - outline-data:/var/lib/outline/data
    91|    environment:
    92|      - TZ=${TZ:-Asia/Shanghai}
    93|      - URL=https://outline.${DOMAIN}
    94|      - PORT=3000
    95|      - DATABASE_URL=postgres://outline:${OUTLINE_DB_PASSWORD}@homelab-postgres:5432/outline
    96|      - REDIS_URL=redis://:${REDIS_PASSWORD}@homelab-redis:6379/1
    97|      - SECRET_KEY=${OUTLINE_SECRET_KEY:-}
    98|      - UTILS_SECRET=${OUTLINE_UTILS_SECRET:-}
    99|      - OIDC_CLIENT_ID=${OUTLINE_OAUTH_CLIENT_ID}
   100|      - OIDC_CLIENT_SECRET=${OUTLINE_OAUTH_CLIENT_SECRET}
   101|      - OIDC_AUTH_URI=https://auth.${DOMAIN}/application/o/authorize/
   102|      - OIDC_TOKEN_URI=https://auth.${DOMAIN}/application/o/token/
   103|      - OIDC_USERINFO_URI=https://auth.${DOMAIN}/application/o/userinfo/
   104|      - OIDC_LOGOUT_URI=https://auth.${DOMAIN}/application/o/outline/end-session/
   105|      - OIDC_DISPLAY_NAME=Authentik
   106|      - OIDC_SCOPES=openid profile email
   107|      - FILE_STORAGE=local
   108|      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
   109|      - FORCE_HTTPS=true
   110|      - RATE_LIMITER_ENABLED=true
   111|      - LOG_LEVEL=info
   112|    labels:
   113|      - traefik.enable=true
   114|      - "traefik.http.routers.outline.rule=Host(`outline.${DOMAIN}`)"
   115|      - traefik.http.routers.outline.entrypoints=websecure
   116|      - traefik.http.routers.outline.tls=true
   117|      - traefik.http.services.outline.loadbalancer.server.port=3000
   118|    healthcheck:
   119|      test: ["CMD-SHELL", "curl -sf http://localhost:3000 || exit 1"]
120|   interval: 30s
timeout: 10s
retries: 3
start_period: 30s
   121|
   122|  # ---------------------------------------------------------------------------
