services:
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=homelab-postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=git.${DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${DOMAIN}/
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
      - databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN:-local.lan}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      - "traefik.http.routers.gitea.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - DATABASE_URL=postgresql://vaultwarden:${VAULTWARDEN_DB_PASSWORD}@homelab-postgres:5432/vaultwarden
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASS}
    volumes:
      - vaultwarden-data:/data
    networks:
      - proxy
      - databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN:-local.lan}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      - "traefik.http.routers.vaultwarden.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - URL=https://docs.${DOMAIN}
      - PORT=3000
      - DATABASE_URL=postgres://outline:${OUTLINE_DB_PASSWORD}@homelab-postgres:5432/outline
      - DATABASE_URL_TEST=postgres://outline:${OUTLINE_DB_PASSWORD}@homelab-postgres:5432/outline-test
      - REDIS_URL=redis://:${REDIS_PASSWORD}@homelab-redis:6379/1
      - SECRET_KEY=${OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET}
      # OIDC
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_AUTH_URI=${OIDC_AUTH_URI}
      - OIDC_TOKEN_URI=${OIDC_TOKEN_URI}
      - OIDC_USERINFO_URI=${OIDC_USERINFO_URI}
      - OIDC_USERNAME_CLAIM=preferred_username
      - OIDC_DISPLAY_NAME=Authentik
      - OIDC_SCOPES=openid profile email
      # MinIO (S3 Compatible)
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
      - AWS_S3_UPLOAD_BUCKET_URL=https://s3.${DOMAIN}
      - AWS_S3_UPLOAD_BUCKET_NAME=outline
      - AWS_S3_UPLOAD_MAX_SIZE=26214400
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_ACL=private
    volumes:
      - outline-data:/var/lib/outline/data
    networks:
      - proxy
      - databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`docs.${DOMAIN:-local.lan}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
      - "traefik.http.routers.outline.middlewares=secHeaders@file"
    depends_on:
      - outline-redis-check

  outline-redis-check:
    image: redis:7-alpine
    container_name: outline-redis-check
    networks:
      - databases
    command: sh -c 'until redis-cli -h homelab-redis -a "${REDIS_PASSWORD}" ping; do echo waiting for redis; sleep 2; done'
    restart: "no"

  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_US
    volumes:
      - spdf-trainingData:/usr/share/tessdata
      - spdf-extraConfigs:/configs
      - spdf-customFiles:/customFiles
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spdf.rule=Host(`pdf.${DOMAIN:-local.lan}`)"
      - "traefik.http.routers.spdf.entrypoints=websecure"
      - "traefik.http.routers.spdf.tls.certresolver=letsencrypt"
      - "traefik.http.services.spdf.loadbalancer.server.port=8080"
      - "traefik.http.routers.spdf.middlewares=secHeaders@file"

  excalidraw:
    image: excalidraw/excalidraw:latest-sha
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`draw.${DOMAIN:-local.lan}`)"
      - "traefik.http.routers.excalidraw.entrypoints=websecure"
      - "traefik.http.routers.excalidraw.tls.certresolver=letsencrypt"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
      - "traefik.http.routers.excalidraw.middlewares=secHeaders@file"

networks:
  proxy:
    external: true
  databases:
    external: true

volumes:
  gitea-data:
  vaultwarden-data:
  outline-data:
  spdf-trainingData:
  spdf-extraConfigs:
  spdf-customFiles:
