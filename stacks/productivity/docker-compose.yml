# =============================================================================
# HomeLab Stack — Productivity Stack
# Gitea (git) + Vaultwarden (passwords) + Outline (wiki) + Stirling PDF
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Gitea — Self-hosted Git service
  # ---------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: homelab-postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GIT_DOMAIN}
      GITEA__server__ROOT_URL: https://${GIT_DOMAIN}/
      GITEA__server__SSH_DOMAIN: ${GIT_DOMAIN}
      GITEA__server__DISABLE_REGISTRATION: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`${GIT_DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
      # SSH
      - "traefik.tcp.routers.gitea-ssh.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.gitea-ssh.entrypoints=ssh"
      - "traefik.tcp.routers.gitea-ssh.service=gitea-ssh"
      - "traefik.tcp.services.gitea-ssh.loadbalancer.server.port=22"
    networks:
      - databases
      - proxy

  # ---------------------------------------------------------------------------
  # Vaultwarden — Bitwarden-compatible password manager
  # ---------------------------------------------------------------------------
  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
    environment:
      DOMAIN: https://${VAULT_DOMAIN}
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASS:-}
      WEBSOCKET_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULT_DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
      # WebSocket for live sync
      - "traefik.http.routers.vaultwarden-ws.rule=Host(`${VAULT_DOMAIN}`) && Path(`/notifications/hub`)"
      - "traefik.http.routers.vaultwarden-ws.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-ws.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden-ws.loadbalancer.server.port=3012"
    networks:
      - proxy

  # ---------------------------------------------------------------------------
  # Outline — Team knowledge base / wiki
  # ---------------------------------------------------------------------------
  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    volumes:
      - outline_data:/var/lib/outline/data
    environment:
      URL: https://${OUTLINE_DOMAIN}
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      PORT: 3000
      DATABASE_URL: postgres://outline:${OUTLINE_DB_PASSWORD}@homelab-postgres:5432/outline
      DATABASE_CONNECTION_POOL_MIN: 2
      DATABASE_CONNECTION_POOL_MAX: 10
      REDIS_URL: redis://:${REDIS_PASSWORD}@homelab-redis:6379/1
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_AUTH_URI: https://${AUTHENTIK_DOMAIN}/application/o/authorize/
      OIDC_TOKEN_URI: https://${AUTHENTIK_DOMAIN}/application/o/token/
      OIDC_USERINFO_URI: https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
      OIDC_LOGOUT_URI: https://${AUTHENTIK_DOMAIN}/application/o/end-session/
      OIDC_DISPLAY_NAME: Authentik
      OIDC_SCOPES: openid profile email
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FORCE_HTTPS: "true"
      RATE_LIMITER_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`${OUTLINE_DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
    networks:
      - databases
      - proxy

  # ---------------------------------------------------------------------------
  # Stirling PDF — Swiss Army knife for PDFs
  # ---------------------------------------------------------------------------
  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    volumes:
      - stirling_data:/usr/share/tessdata
      - stirling_config:/configs
      - stirling_logs:/logs
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling-pdf.rule=Host(`${PDF_DOMAIN}`)"
      - "traefik.http.routers.stirling-pdf.entrypoints=websecure"
      - "traefik.http.routers.stirling-pdf.tls.certresolver=letsencrypt"
      - "traefik.http.services.stirling-pdf.loadbalancer.server.port=8080"
    networks:
      - proxy

volumes:
  gitea_data:
  vaultwarden_data:
  outline_data:
  stirling_data:
  stirling_config:
  stirling_logs:

networks:
  databases:
    external: true
    name: databases
  proxy:
    external: true
    name: proxy
