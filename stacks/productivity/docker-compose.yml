services:
  # ============================================================
  # Productivity Stack — 生产力工具
  # Issue #5 · Bounty $160
  # ============================================================

  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=${SHARED_POSTGRES_HOST:-postgres}:${SHARED_POSTGRES_PORT:-5432}
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${SHARED_POSTGRES_USER:-homelab}
      - GITEA__database__PASSWD=${SHARED_POSTGRES_PASSWORD:-changeme}
      - GITEA__server__ROOT_URL=https://${GITEA_HOST:-git.${DOMAIN:-local}}
      - GITEA__server__SSH_DOMAIN=${GITEA_HOST:-git.${DOMAIN:-local}}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=true
      - GITEA__openid__ENABLE_OPENID_SIGNIN=true
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__security__INSTALL_LOCK=true
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_SSH_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`${GITEA_HOST:-git.${DOMAIN:-local}}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    profiles:
      - productivity
      - full

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://${VAULTWARDEN_HOST:-vault.${DOMAIN:-local}}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:-changeme}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ROCKET_PORT=8080
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/alive"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_HOST:-vault.${DOMAIN:-local}}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=8080"
    profiles:
      - productivity
      - full

  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    environment:
      - PGSSLMODE=disable
      - DATABASE_URL=postgres://${SHARED_POSTGRES_USER:-homelab}:${SHARED_POSTGRES_PASSWORD:-changeme}@${SHARED_POSTGRES_HOST:-postgres}:${SHARED_POSTGRES_PORT:-5432}/${OUTLINE_DB_NAME:-outline}
      - REDIS_URL=redis://${SHARED_REDIS_HOST:-redis}:${SHARED_REDIS_PORT:-6379}
      - URL=https://${OUTLINE_HOST:-wiki.${DOMAIN:-local}}
      - PORT=3000
      - SECRET_KEY=${OUTLINE_SECRET_KEY:-changeme}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET:-changeme}
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - FILE_STORAGE_UPLOAD_MAX_SIZE=26214400
    volumes:
      - outline_data:/var/lib/outline/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`${OUTLINE_HOST:-wiki.${DOMAIN:-local}}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls=true"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
    profiles:
      - productivity
      - full

  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - SECURITY_ENABLE_LOGIN=false
      - SYSTEM_MAXFILESIZE=100
      - UI_APP_NAME=Stirling PDF
    volumes:
      - stirling_data:/configs
      - stirling_tessdata:/usr/share/tessdata
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling.rule=Host(`${STIRLING_HOST:-pdf.${DOMAIN:-local}}`)"
      - "traefik.http.routers.stirling.entrypoints=websecure"
      - "traefik.http.routers.stirling.tls=true"
      - "traefik.http.services.stirling.loadbalancer.server.port=8080"
    profiles:
      - productivity
      - full

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw.rule=Host(`${EXCALIDRAW_HOST:-draw.${DOMAIN:-local}}`)"
      - "traefik.http.routers.excalidraw.entrypoints=websecure"
      - "traefik.http.routers.excalidraw.tls=true"
      - "traefik.http.services.excalidraw.loadbalancer.server.port=80"
    profiles:
      - productivity
      - full

volumes:
  gitea_data:
    driver: local
  vaultwarden_data:
    driver: local
  outline_data:
    driver: local
  stirling_data:
    driver: local
  stirling_tessdata:
    driver: local
