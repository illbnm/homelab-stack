version: '3.8'

services:
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - DB_TYPE=postgres
      - DB_HOST=homelab-postgres:5432
      - DB_NAME=gitea
      - DB_USER=gitea
      - DB_PASS=${GITEA_DB_PASSWORD}
      - DISABLE_REGISTRATION=true
    volumes:
      - ./data/gitea:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.tls.certresolver=letsencrypt

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - DATABASE_URL=postgresql://vaultwarden:${GITEA_DB_PASSWORD}@homelab-postgres:5432/vaultwarden
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      - SIGNUPS_ALLOWED=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM=vaultwarden@${DOMAIN}
      - SMTP_USERNAME=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASS}
    volumes:
      - ./data/vaultwarden:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.vault.rule=Host(`vault.${DOMAIN}`)
      - traefik.http.routers.vault.entrypoints=websecure
      - traefik.http.routers.vault.tls.certresolver=letsencrypt

  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - DATABASE_URL=postgres://outline:${GITEA_DB_PASSWORD}@homelab-postgres:5432/outline
      - REDIS_URL=redis://homelab-redis:6379
      - SECRET_KEY=${OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET}
      - FILE_STORAGE=s3
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}
      - AWS_REGION=us-east-1
      - AWS_S3_UPLOAD_BUCKET_URL=https://minio.${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.outline.rule=Host(`docs.${DOMAIN}`)
      - traefik.http.routers.outline.entrypoints=websecure
      - traefik.http.routers.outline.tls.certresolver=letsencrypt

  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.pdf.rule=Host(`pdf.${DOMAIN}`)
      - traefik.http.routers.pdf.entrypoints=websecure
      - traefik.http.routers.pdf.tls.certresolver=letsencrypt

networks:
  proxy:
    external: true
  databases:
    external: true