version: "3.8"

services:
  gitea:
    image: gitea/gitea:1.22.3
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    volumes:
      - gitea-data:/data

  vaultwarden:
    image: vaultwarden/server:1.32.2
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=${VW_SIGNUPS_ALLOWED:-false}
    ports:
      - "${VAULTWARDEN_PORT:-8222}:80"
    volumes:
      - vaultwarden-data:/data

  bookstack-db:
    image: lscr.io/linuxserver/mariadb:11.4.3
    container_name: bookstack-db
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=${BOOKSTACK_DB_ROOT_PASS:?required}
      - MYSQL_DATABASE=bookstackapp
      - MYSQL_USER=bookstack
      - MYSQL_PASSWORD=${BOOKSTACK_DB_PASS:?required}
    volumes:
      - bookstack-db:/config

  bookstack:
    image: lscr.io/linuxserver/bookstack:24.10.1
    container_name: bookstack
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - APP_URL=${BOOKSTACK_APP_URL:-http://localhost:6875}
      - DB_HOST=bookstack-db
      - DB_PORT=3306
      - DB_USER=bookstack
      - DB_PASS=${BOOKSTACK_DB_PASS}
      - DB_DATABASE=bookstackapp
    ports:
      - "${BOOKSTACK_PORT:-6875}:80"
    volumes:
      - bookstack-data:/config
    depends_on:
      - bookstack-db

volumes:
  gitea-data:
  vaultwarden-data:
  bookstack-db:
  bookstack-data:
