   139|      - traefik.http.routers.stirling-pdf.tls=true
   140|      - traefik.http.routers.stirling-pdf.middlewares=security-headers@file
   141|      - traefik.http.services.stirling-pdf.loadbalancer.server.port=8080
   142|    healthcheck:
   143|      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
144|   interval: 30s
timeout: 10s
retries: 3
start_period: 60s
