version: "3.9"

# Productivity Stack — Gitea + Vaultwarden + Outline + Stirling PDF + Excalidraw
# Bounty: $170 USDT — Issue #5

services:
  # ── PostgreSQL (shared database) ──
  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: change_me_secure_password
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    networks:
      - net_productivity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gitea: Git code hosting ──
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=admin
      - GITEA__database__PASSWD=change_me_secure_password
      - GITEA__server__DOMAIN=git.example.com
      - GITEA__server__ROOT_URL=https://git.example.com
      - GITEA__server__SSH_DOMAIN=git.example.com
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - ./gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - net_productivity
    depends_on:
      postgres:
        condition: service_healthy

  # ── Vaultwarden: Password manager (Bitwarden compatible) ──
  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DOMAIN=https://vault.example.com
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=change_me_admin_token_64chars_min
      - SMTP_HOST=smtp.example.com
      - SMTP_FROM=vault@example.com
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_USERNAME=your_smtp_user
      - SMTP_PASSWORD=your_smtp_pass
      - WEBSOCKET_ENABLED=true
    volumes:
      - ./vaultwarden/data:/data
    networks:
      - net_productivity

  # ── Outline: Team knowledge base ──
  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgres://admin:change_me_secure_password@postgres:5432/outline
      - DATABASE_URL_TEST=postgres://admin:change_me_secure_password@postgres:5432/outline_test
      - SECRET_KEY=generate_a_random_64_char_secret_key
      - UTILS_SECRET=generate_another_random_64_char_secret
      - URL=https://wiki.example.com
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      - OIDC_CLIENT_ID=outline
      - OIDC_CLIENT_SECRET=your_oidc_client_secret
      - OIDC_AUTH_URI=https://auth.example.com/application/o/authorize/
      - OIDC_TOKEN_URI=https://auth.example.com/application/o/token/
      - OIDC_USERINFO_URI=https://auth.example.com/application/o/userinfo/
      - OIDC_LOGOUT_URI=https://auth.example.com/application/o/outline/end-session/
      - OIDC_DISPLAY_NAME=Authentik
      - OIDC_SCOPES=openid profile email
    volumes:
      - ./outline/data:/var/lib/outline/data
    networks:
      - net_productivity
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # ── Redis (for Outline) ──
  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
    networks:
      - net_productivity
    command: redis-server --appendonly yes

  # ── Stirling PDF: PDF processing tools ──
  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SYSTEM_DEFAULTLOCALE=en-US
      - UI_INVOCATION_HOST=pdf.example.com
    volumes:
      - ./stirling/trainingData:/usr/share/tessdata
      - ./stirling/extraConfigs:/configs
      - ./stirling/logs:/logs
    networks:
      - net_productivity

  # ── Excalidraw: Collaborative whiteboard ──
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "8082:80"
    networks:
      - net_productivity

networks:
  net_productivity:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
