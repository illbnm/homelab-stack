# Productivity Stack - Gitea + Vaultwarden + Outline + Stirling PDF
# 生产力工具栈：代码托管 + 密码管理 + 知识库 + PDF 工具

x-traefik-labels: &traefik-labels
  - "traefik.enable=true"
  - "traefik.http.routers.${ROUTER:-productivity}.rule=Host(`${DOMAIN}`)"
  - "traefik.http.routers.${ROUTER:-productivity}.entrypoints=websecure"
  - "traefik.http.routers.${ROUTER:-productivity}.tls.certresolver=letsencrypt"
  - "traefik.http.services.${ROUTER:-productivity}.loadbalancer.server.port=${PORT}"

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ==================== Gitea ====================
  gitea:
    image: gitea/gitea:1.22.2
    container_name: gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is required}
      - GITEA__server__ROOT_URL=https://gitea.${DOMAIN}
      - GITEA__server__DOMAIN=${DOMAIN}
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY:?GITEA_SECRET_KEY is required}
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__openid__ENABLE_OPENID_SIGNIN=true
      - GITEA__openid__ENABLE_OPENID_SIGNUP=false
      - GITEA__actions__ENABLED=true
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    networks:
      - traefik-public
      - productivity-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=websecure"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]

  # ==================== Vaultwarden ====================
  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?VAULTWARDEN_ADMIN_TOKEN is required}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@${DOMAIN}}
      - SMTP_SSL=true
      - ROCKET_LIMITS={json=10485760}
    volumes:
      - vaultwarden-data:/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:80/api/alive"]

  # ==================== Outline ====================
  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${OUTLINE_DB_USER:-outline}:${OUTLINE_DB_PASSWORD:?OUTLINE_DB_PASSWORD is required}@postgres:5432/${OUTLINE_DB_NAME:-outline}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${OUTLINE_SECRET_KEY:?OUTLINE_SECRET_KEY is required}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET:?OUTLINE_UTILS_SECRET is required}
      - URL=https://wiki.${DOMAIN}
      - PORT=3000
      - OIDC_CLIENT_ID=${OUTLINE_OIDC_CLIENT_ID:?OUTLINE_OIDC_CLIENT_ID is required}
      - OIDC_CLIENT_SECRET=${OUTLINE_OIDC_CLIENT_SECRET:?OUTLINE_OIDC_CLIENT_SECRET is required}
      - OIDC_AUTH_URI=https://auth.${DOMAIN}/application/o/authorize/
      - OIDC_TOKEN_URI=https://auth.${DOMAIN}/application/o/token/
      - OIDC_USERINFO_URI=https://auth.${DOMAIN}/application/o/userinfo/
      - OIDC_DISPLAY_NAME=Authentik
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - AWS_REGION=us-east-1
      - AWS_S3_UPLOAD_BUCKET_URL=https://minio.${DOMAIN}
      - AWS_S3_UPLOAD_BUCKET_NAME=outline
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_ACL=private
      - FILE_STORAGE_UPLOAD_MAX_SIZE=26214400
    volumes:
      - outline-data:/var/lib/outline/data
    networks:
      - traefik-public
      - productivity-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`wiki.${DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=websecure"
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/_health"]

  # ==================== Stirling PDF ====================
  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SYSTEM_MAXFILESIZE=100
      - SECURITY_ENABLE_LOGIN=false
      - UI_APP_NAME=Stirling PDF
      - UI_HOME_DESCRIPTION=PDF Processing Tools
      - UI_APP_NAVBAR_NAME=Stirling PDF
    volumes:
      - stirling-data:/usr/share/tessdata
      - stirling-config:/configs
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stirling.rule=Host(`pdf.${DOMAIN}`)"
      - "traefik.http.routers.stirling.entrypoints=websecure"
      - "traefik.http.routers.stirling.tls.certresolver=letsencrypt"
      - "traefik.http.services.stirling.loadbalancer.server.port=8080"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]

  # ==================== MinIO (Object Storage) ====================
  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - MINIO_BROWSER_REDIRECT_URL=https://minio-console.${DOMAIN}
    volumes:
      - minio-data:/data
    networks:
      - traefik-public
      - productivity-internal
    labels:
      # MinIO API
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      # MinIO Console
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== Shared PostgreSQL ====================
  postgres:
    image: postgres:16.2-alpine
    container_name: productivity-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_MULTIPLE_DATABASES=gitea,outline
      - POSTGRES_USER=${POSTGRES_SUPER_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_SUPER_PASSWORD:?POSTGRES_SUPER_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - productivity-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Shared Redis ====================
  redis:
    image: redis:7.2.4-alpine
    container_name: productivity-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    networks:
      - productivity-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  traefik-public:
    external: true
  productivity-internal:
    driver: bridge

volumes:
  gitea-data:
  gitea-config:
  vaultwarden-data:
  outline-data:
  stirling-data:
  stirling-config:
  minio-data:
  postgres-data:
  redis-data:
