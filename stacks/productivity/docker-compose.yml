version: "3.9"

services:
  gitea:
    image: gitea/gitea:1.22.2
    container_name: prod-gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgresql:5432
      GITEA__database__NAME: ${GITEA_DB:-gitea}
      GITEA__database__USER: ${GITEA_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea_data:/data
    ports:
      - "3002:3000"
      - "2222:22"
    networks:
      - productivity
      - databases
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 20s
      timeout: 5s
      retries: 3

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: prod-vaultwarden
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      WEBSOCKET_ENABLED: "true"
    volumes:
      - vaultwarden_data:/data
    ports:
      - "8086:80"
    networks:
      - productivity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 15s
      timeout: 5s
      retries: 3

  outline:
    image: outlinewiki/outline:0.80.2
    container_name: prod-outline
    restart: unless-stopped
    environment:
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-homelab}:${POSTGRES_PASSWORD}@postgresql:5432/outline
      REDIS_URL: redis://redis:6379
      URL: ${OUTLINE_URL:-http://localhost:3003}
    ports:
      - "3003:3000"
    networks:
      - productivity
      - databases
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/_health"]
      interval: 25s
      timeout: 5s
      retries: 3

  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: prod-stirling-pdf
    restart: unless-stopped
    ports:
      - "8087:8080"
    networks:
      - productivity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: prod-excalidraw
    restart: unless-stopped
    ports:
      - "8088:80"
    networks:
      - productivity
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3

networks:
  productivity:
    driver: bridge
  databases:
    external: true
    name: databases

volumes:
  gitea_data:
  vaultwarden_data:
