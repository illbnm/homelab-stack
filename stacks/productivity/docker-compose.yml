name: homelab-productivity

services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    networks: [proxy, productivity]
    volumes: [gitea_data:/data, /etc/timezone:/etc/timezone:ro, /etc/localtime:/etc/localtime:ro]
    environment: [TZ=${TZ:-UTC}, USER_UID=1000, USER_GID=1000, GITEA__server__DOMAIN=${DOMAIN}, GITEA__server__ROOT_URL=https://git.${DOMAIN}]
    depends_on: [gitea-db]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:3000"], interval: 30s, timeout: 10s, retries: 3, start_period: 30s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.${DOMAIN}`)"
      - "traefik.http.routers.gitea.entrypoints=https"
      - "traefik.http.routers.gitea.tls=true"
      - "traefik.http.routers.gitea.tls.certresolver=letsencrypt"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"

  gitea-db:
    image: postgres:16-alpine
    container_name: gitea-db
    restart: unless-stopped
    networks: [productivity]
    volumes: [gitea_db:/var/lib/postgresql/data]
    environment: [POSTGRES_DB=gitea, POSTGRES_USER=gitea, POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}]
    healthcheck: {test: ["CMD","pg_isready","-U","gitea"], interval: 30s, timeout: 10s, retries: 5, start_period: 20s}
    labels: ["traefik.enable=false"]

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    networks: [proxy]
    volumes: [vaultwarden_data:/data]
    environment: [TZ=${TZ:-UTC}, SIGNUPS_ALLOWED=${VAULTWARDEN_SIGNUPS:-true}, DOMAIN=https://vault.${DOMAIN}]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:80/alive"], interval: 30s, timeout: 10s, retries: 3, start_period: 15s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=https"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

  outline:
    image: outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped
    networks: [proxy, productivity]
    volumes: [outline_data:/var/lib/outline/data]
    environment: [TZ=${TZ:-UTC}, URL=https://wiki.${DOMAIN}, SECRET_KEY=${OUTLINE_SECRET_KEY}, OIDC_CLIENT_ID=${OIDC_CLIENT_ID}, OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}, PGSSLMODE=disable]
    depends_on: [outline-db, outline-redis]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:3000/_health"], interval: 30s, timeout: 10s, retries: 3, start_period: 30s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.outline.rule=Host(`wiki.${DOMAIN}`)"
      - "traefik.http.routers.outline.entrypoints=https"
      - "traefik.http.routers.outline.tls=true"
      - "traefik.http.routers.outline.tls.certresolver=letsencrypt"
      - "traefik.http.services.outline.loadbalancer.server.port=3000"

  outline-db:
    image: postgres:16-alpine
    container_name: outline-db
    restart: unless-stopped
    networks: [productivity]
    volumes: [outline_db:/var/lib/postgresql/data]
    environment: [POSTGRES_DB=outline, POSTGRES_USER=outline, POSTGRES_PASSWORD=${OUTLINE_DB_PASSWORD}]
    healthcheck: {test: ["CMD","pg_isready","-U","outline"], interval: 30s, timeout: 10s, retries: 5, start_period: 20s}
    labels: ["traefik.enable=false"]

  outline-redis:
    image: redis:7-alpine
    container_name: outline-redis
    restart: unless-stopped
    networks: [productivity]
    volumes: [outline_redis:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 30s, timeout: 10s, retries: 3}
    labels: ["traefik.enable=false"]

networks:
  proxy: {external: true, name: proxy}
  productivity: {driver: bridge}

volumes:
  gitea_data: {} gitea_db: {} vaultwarden_data: {} outline_data: {} outline_db: {} outline_redis: {}
