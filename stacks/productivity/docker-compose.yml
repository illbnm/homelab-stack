services:
  gitea:
    image: gitea/gitea:1.22.3
    container_name: gitea
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=homelab-postgres:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:?Set GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=git.${DOMAIN}
      - GITEA__server__ROOT_URL=https://git.${DOMAIN}
      - GITEA__server__HTTP_PORT=3000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__mailer__ENABLED=false
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION=false
      - GITEA__actions__ENABLED=true
      - GITEA_OAUTH_CLIENT_ID=${GITEA_OAUTH_CLIENT_ID}
      - GITEA_OAUTH_CLIENT_SECRET=${GITEA_OAUTH_CLIENT_SECRET}
      - AUTHENTIK_DOMAIN=${AUTHENTIK_DOMAIN}
    volumes:
      - gitea-data:/data
      - ./configure-gitea-oidc.sh:/configure-gitea-oidc.sh:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.gitea.rule=Host(`git.${DOMAIN}`)"
      - traefik.http.routers.gitea.entrypoints=websecure
      - traefik.http.routers.gitea.tls=true
      - traefik.http.routers.gitea.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.gitea.loadbalancer.server.port=3000
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  vaultwarden:
    image: vaultwarden/server:1.32.0
    container_name: vaultwarden
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=false
      - EMERGENCY_ACCESS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN:?Set VAULTWARDEN_ADMIN_TOKEN}
      - SMTP_HOST=${SMTP_HOST:?Set SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USER:?Set SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASS:?Set SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:?Set SMTP_FROM}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - DATABASE_URL=postgresql://vaultwarden:${VAULTWARDEN_DB_PASSWORD:?Set VAULTWARDEN_DB_PASSWORD}@homelab-postgres:5432/vaultwarden
      - LOG_LEVEL=warn
      - TZ=${TZ}
    volumes:
      - vaultwarden-data:/data
    labels:
      - traefik.enable=true
      - "traefik.http.routers.vaultwarden.rule=Host(`vault.${DOMAIN}`)"
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls=true
      - traefik.http.routers.vaultwarden.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80
    healthcheck:
      test: [CMD, curl, -sf, http://localhost:80/alive]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  outline:
    image: outlinewiki/outline:0.80.2
    container_name: outline
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - NODE_ENV=production
      - SECRET_KEY=${OUTLINE_SECRET_KEY:?Set OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET:?Set OUTLINE_UTILS_SECRET}
      - DATABASE_URL=postgres://outline:${OUTLINE_DB_PASSWORD:?Set OUTLINE_DB_PASSWORD}@homelab-postgres:5432/outline?sslmode=disable
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@homelab-redis:6379
      - URL=https://docs.${DOMAIN}
      - PORT=3000
      - OIDC_CLIENT_ID=${OUTLINE_OAUTH_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OUTLINE_OAUTH_CLIENT_SECRET}
      - OIDC_AUTH_URI=https://${AUTHENTIK_DOMAIN}/application/o/authorize/
      - OIDC_TOKEN_URI=https://${AUTHENTIK_DOMAIN}/application/o/token/
      - OIDC_USERINFO_URI=https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
      - OIDC_LOGOUT_URI=https://${AUTHENTIK_DOMAIN}/application/o/outline/end-session/
      - OIDC_DISPLAY_NAME=Authentik
      - OIDC_SCOPES=openid profile email
      - FILE_STORAGE=s3
      - AWS_ACCESS_KEY_ID=${OUTLINE_S3_ACCESS_KEY:?Set OUTLINE_S3_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${OUTLINE_S3_SECRET_KEY:?Set OUTLINE_S3_SECRET_KEY}
      - AWS_REGION=${OUTLINE_S3_REGION:-us-east-1}
      - AWS_S3_UPLOAD_BUCKET_URL=https://s3.${DOMAIN}
      - AWS_S3_UPLOAD_BUCKET_NAME=${OUTLINE_S3_BUCKET:-outline}
      - AWS_S3_FORCE_PATH_STYLE=true
      - AWS_S3_ACL=private
      - FILE_STORAGE_UPLOAD_MAX_SIZE=26214400
    labels:
      - traefik.enable=true
      - "traefik.http.routers.outline.rule=Host(`docs.${DOMAIN}`)"
      - traefik.http.routers.outline.entrypoints=websecure
      - traefik.http.routers.outline.tls=true
      - traefik.http.routers.outline.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.outline.loadbalancer.server.port=3000
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:3000/_health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bookstack:
    image: lscr.io/linuxserver/bookstack:24.10.20241031
    container_name: bookstack
    restart: unless-stopped
    networks:
      - proxy
      - databases
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - APP_URL=https://wiki.${DOMAIN}
      - APP_KEY=${BOOKSTACK_APP_KEY}
      - DB_HOST=homelab-mariadb
      - DB_PORT=3306
      - DB_DATABASE=bookstack
      - DB_USERNAME=bookstack
      - DB_PASSWORD=${BOOKSTACK_DB_PASSWORD}
      - AUTH_METHOD=${BOOKSTACK_AUTH_METHOD:-standard}
      - OIDC_CLIENT_ID=${BOOKSTACK_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${BOOKSTACK_OIDC_CLIENT_SECRET}
      - OIDC_ISSUER=https://${AUTHENTIK_DOMAIN}/application/o/bookstack/
      - OIDC_NAME=Authentik
      - OIDC_DUMP_USER_DETAILS=false
    volumes:
      - bookstack-data:/config
    labels:
      - traefik.enable=true
      - "traefik.http.routers.bookstack.rule=Host(`wiki.${DOMAIN}`)"
      - traefik.http.routers.bookstack.entrypoints=websecure
      - traefik.http.routers.bookstack.tls=true
      - traefik.http.routers.bookstack.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.bookstack.loadbalancer.server.port=80
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:80/login]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gitea-runner:
    image: gitea/act_runner:0.2.11
    container_name: gitea-runner
    profiles: [actions]
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    networks:
      - proxy
    environment:
      GITEA_INSTANCE_URL: https://git.${DOMAIN}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: homelab
    volumes:
      - gitea-runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - traefik.enable=false

  stirling-pdf:
    image: frooodle/s-pdf:0.30.2
    container_name: stirling-pdf
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - stirling-data:/configs
      - stirling-training:/usr/share/tessdata
      - stirling-custom:/customFiles
    labels:
      - traefik.enable=true
      - "traefik.http.routers.stirling-pdf.rule=Host(`pdf.${DOMAIN}`)"
      - traefik.http.routers.stirling-pdf.entrypoints=websecure
      - traefik.http.routers.stirling-pdf.tls=true
      - traefik.http.routers.stirling-pdf.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.stirling-pdf.loadbalancer.server.port=8080

  excalidraw:
    image: excalidraw/excalidraw:latest-sha
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.excalidraw.rule=Host(`draw.${DOMAIN}`)"
      - traefik.http.routers.excalidraw.entrypoints=websecure
      - traefik.http.routers.excalidraw.tls=true
      - traefik.http.routers.excalidraw.tls.certresolver=letsencrypt
      - traefik.docker.network=proxy
      - traefik.http.services.excalidraw.loadbalancer.server.port=80

networks:
  proxy:
    external: true
  databases:
    external: true

volumes:
  gitea-data:
  vaultwarden-data:
  bookstack-data:
  outline-data: # Retained for migration of existing local uploads
  gitea-runner-data:
  stirling-data:
  stirling-training:
  stirling-custom:
