name: home-automation

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    logging: *default-logging
    environment:
      MQTT_USER: ${MQTT_USER:-mqtt}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-changeme}
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../../config/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - home-automation
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: homeassistant
    restart: unless-stopped
    logging: *default-logging
    # 必须使用 host 网络：mDNS(224.0.0.251:5353) / SSDP 组播在 bridge 下无法到达局域网，
    # 自动发现会整体失效。详见 README「为什么 Home Assistant 使用 host 网络」。
    network_mode: host
    # --- bridge 模式替代配置：注释掉上面的 network_mode: host，再取消下面几行注释 ---
    # 限制：mDNS/UPnP 自动发现失效，HomeKit/Chromecast/DLNA 等依赖组播的集成不可用，
    #       且需把 MQTT 地址从 127.0.0.1 改为 mosquitto。
    # networks:
    #   - home-automation
    # ports:
    #   - "8123:8123"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  nodered:
    image: nodered/node-red:4.0.3
    container_name: nodered
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "1880:1880"
    volumes:
      - nodered-data:/data
    networks:
      - home-automation
    depends_on:
      mosquitto:
        condition: service_healthy

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-UTC}
      ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
      ZIGBEE2MQTT_CONFIG_MQTT_USER: ${MQTT_USER:-mqtt}
      ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD: ${MQTT_PASSWORD:-changeme}
      ZIGBEE2MQTT_CONFIG_SERIAL_PORT: ${ZIGBEE_SERIAL_PORT:-/dev/ttyUSB0}
    ports:
      - "8080:8080"
    volumes:
      - zigbee2mqtt-data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - "${ZIGBEE_SERIAL_PORT:-/dev/ttyUSB0}:${ZIGBEE_SERIAL_PORT:-/dev/ttyUSB0}"
    networks:
      - home-automation
    depends_on:
      mosquitto:
        condition: service_healthy

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "6052:6052"
    volumes:
      - ./config/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - home-automation

volumes:
  mosquitto-data:
  mosquitto-log:
  nodered-data:
  zigbee2mqtt-data:

networks:
  home-automation:
    driver: bridge
