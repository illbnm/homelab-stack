services:
  homeassistant:
    image: homeassistant/home-assistant:2024.11.3
    container_name: homeassistant
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    privileged: true
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ha.rule=Host(`ha.${DOMAIN}`)"
      - traefik.http.routers.ha.entrypoints=websecure
      - traefik.http.routers.ha.tls=true
      - traefik.http.services.ha.loadbalancer.server.port=8123
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-red:
    image: nodered/node-red:3.1.14
    container_name: node-red
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - node-red-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.41.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - zigbee2mqtt-data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      mosquitto:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee.${DOMAIN}`)"
      - traefik.http.routers.zigbee2mqtt.entrypoints=websecure
      - traefik.http.routers.zigbee2mqtt.tls=true
      - traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true

volumes:
  ha-config:
  node-red-data:
  mosquitto-data:
  mosquitto-logs:
---
# =============================================================================
# Home Automation Stack
# =============================================================================
# Services: Home Assistant, Node-RED, Mosquitto, Zigbee2MQTT, ESPHome
#
# Home Assistant uses host network mode for mDNS/UPnP device discovery.
# See README.md for details and bridge mode alternative.
# Home Automation Stack Environment Variables

# Data directory for persistent storage
DATA_DIR=./data

# Config directory
CONFIG_DIR=./config

# Timezone
TZ=UTC

# Zigbee coordinator USB device path (e.g., /dev/ttyUSB0, /dev/ttyACM0)
ZIGBEE_DEVICE=/dev/ttyUSB0
# 🏠 Home Automation Stack

Complete smart home automation stack with Zigbee device support and visual flow orchestration.

## Services

| Service | Port | Description |
|---------|------|-------------|
| Home Assistant | `8123` | Smart home hub & automation engine |
| Node-RED | `1880` | Visual flow programming |
| Mosquitto | `1883` / `9001` | MQTT broker |
| Zigbee2MQTT | `8080` | Zigbee device gateway |
| ESPHome | `6052` | ESP device firmware management |

## Quick Start


# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Home Assistant
  # ---------------------------------------------------------------------------
  # REQUIRES: network_mode: host for mDNS/UPnP device discovery
  # Alternative bridge mode config is commented below (with limitations)
  # ---------------------------------------------------------------------------
  home-assistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    network_mode: host
    # networks:
    #   - home-automation
    # ports:
    #   - "8123:8123"
    volumes:
      - ${DATA_DIR}/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    # Required for hardware access (USB, GPIO, etc.)
    privileged: true

  # ---------------------------------------------------------------------------
  # Node-RED
  # ---------------------------------------------------------------------------
  node-red:
    container_name: node-red
    image: nodered/node-red:4.0.3
    networks:
      - home-automation
    ports:
      - "1880:1880"
    volumes:
      - ${DATA_DIR}/node-red:/data
    environment:
      - TZ=${TZ:-UTC}
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mosquitto MQTT Broker
  # ---------------------------------------------------------------------------
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.19
    networks:
      - home-automation
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ${DATA_DIR}/mosquitto:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
      - ${CONFIG_DIR}/mosquitto:/mosquitto/config:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zigbee2MQTT
  # ---------------------------------------------------------------------------
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:1.40.2
    networks:
      - home-automation
    ports:
      - "8080:8080"
    volumes:
      - ${DATA_DIR}/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=${TZ:-UTC}
    devices:
      # Zigbee coordinator USB device (e.g., Sonoff ZBDongle-P, ConBee II)
      # Update this to match your device path
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ESPHome
  # ---------------------------------------------------------------------------
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2024.9.3
    networks:
      - home-automation
    ports:
      - "6052:6052"
    volumes:
      - ${DATA_DIR}/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
      - ESPHOME_DASHBOARD_USE_PING=true
    restart: unless-stopped

networks:
  home-automation:
    name: home-automation

--- /dev/null
  zigbee2mqtt-data:
