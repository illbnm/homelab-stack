services:
  homeassistant:
    image: homeassistant/home-assistant:2024.11.3
    container_name: homeassistant
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    privileged: true
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ha.rule=Host(`ha.${DOMAIN}`)"
      - traefik.http.routers.ha.entrypoints=websecure
      - traefik.http.routers.ha.tls=true
      - traefik.http.services.ha.loadbalancer.server.port=8123
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-red:
    image: nodered/node-red:3.1.14
    container_name: node-red
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - node-red-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.41.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - zigbee2mqtt-data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      mosquitto:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee.${DOMAIN}`)"
      - traefik.http.routers.zigbee2mqtt.entrypoints=websecure
      - traefik.http.routers.zigbee2mqtt.tls=true
      - traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true

volumes:
  ha-config:
  node-red-data:
  mosquitto-data:
  mosquitto-logs:
---
# ==============================================================================
# Stack: Home Automation
# Description: Home Assistant, Node-RED, Mosquitto, Zigbee2MQTT, ESPHome
# ==============================================================================

services:
  # --- Home Assistant ---------------------------------------------------------
  home-assistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    restart: unless-stopped
    # Home Assistant requires host network mode for mDNS and UPnP device discovery.
    # Without host mode, auto-discovery of devices (e.g., Philips Hue, Sonos, Chromecast)
    # will not work. See README.md for bridge mode alternative.
    network_mode: host
    # Alternative: bridge mode (comment out network_mode: host and uncomment below)
    # networks:
    #   - home-automation
    # ports:
    #   - "8123:8123"
    # Limitations in bridge mode:
    #   - mDNS/Zeroconf discovery will NOT work
    #   - UPnP/SSDP discovery will NOT work
    #   - Some integrations require manual IP configuration
    #   - Chromecast, Sonos, and similar devices may not be auto-detected
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_DIR}/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    # devices:
    #   # Uncomment if using USB Z-Wave stick or other local USB devices
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- Node-RED ---------------------------------------------------------------
  node-red:
    container_name: node-red
    image: nodered/node-red:4.0.3
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "1880:1880"
    environment:
      - TZ=${TZ:-UTC}
    volumes:
      - ${DATA_DIR}/node-red:/data
    depends_on:
      - mosquitto

  # --- Mosquitto (MQTT Broker) ------------------------------------------------
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2.0.19
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ${DATA_DIR}/mosquitto/config:/mosquitto/config
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
    environment:
      - TZ=${TZ:-UTC}

  # --- Zigbee2MQTT -----------------------------------------------------------
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:1.40.2
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-UTC}
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://mosquitto:1883
      - ZIGBEE2MQTT_CONFIG_FRONTEND=true
      - ZIGBEE2MQTT_CONFIG_FRONTEND_PORT=8080
    volumes:
      - ${DATA_DIR}/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      # Zigbee coordinator USB stick (e.g., Sonoff ZBDongle-P, ConBee II, etc.)
      # Update this to match your device path. Use `ls /dev/serial/by-id/` to find the correct path.
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    depends_on:
      - mosquitto
    # group_add is needed for USB device access on some systems
    group_add:
      - dialout

  # --- ESPHome ----------------------------------------------------------------
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:2024.9.3
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "6052:6052"
    environment:
      - TZ=${TZ:-UTC}
      - ESPHOME_DASHBOARD_USE_PING=true
    volumes:
      - ${DATA_DIR}/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    # ESPHome uses host networking for mDNS discovery of ESP devices
    # Uncomment if you need mDNS discovery; otherwise, static IP configuration works in bridge mode
    # network_mode: host

networks:
  home-automation:
    name: home-automation
    driver: bridge
  zigbee2mqtt-data:
