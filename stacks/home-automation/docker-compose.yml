services:
  homeassistant:
    image: homeassistant/home-assistant:2024.11.3
    container_name: homeassistant
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    privileged: true
    labels:
      - traefik.enable=true
      - "traefik.http.routers.ha.rule=Host(`ha.${DOMAIN}`)"
      - traefik.http.routers.ha.entrypoints=websecure
      - traefik.http.routers.ha.tls=true
      - traefik.http.services.ha.loadbalancer.server.port=8123
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-red:
    image: nodered/node-red:3.1.14
    container_name: node-red
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - node-red-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.41.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - zigbee2mqtt-data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      mosquitto:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - "traefik.http.routers.zigbee2mqtt.rule=Host(`zigbee.${DOMAIN}`)"
      - traefik.http.routers.zigbee2mqtt.entrypoints=websecure
      - traefik.http.routers.zigbee2mqtt.tls=true
      - traefik.http.services.zigbee2mqtt.loadbalancer.server.port=8080
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true

volumes:
  ha-config:
  node-red-data:
  mosquitto-data:
  mosquitto-logs:
---
# ==============================================================================
# 🏠 Home Automation Stack
# ==============================================================================
# Services: Home Assistant, Node-RED, Mosquitto, Zigbee2MQTT, ESPHome
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # Home Assistant - 智能家居中枢
  # ---------------------------------------------------------------------------
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: home-assistant
    # 使用 host 网络模式以支持 mDNS/UPnP 设备发现
    # 如需使用 bridge 模式，请注释掉下面一行并取消注释 networks 部分
    network_mode: host
    # networks:
    #   - home-automation
    volumes:
      - ${DATA_DIR}/home-assistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
    # 如需使用 bridge 模式，请取消注释以下 ports 部分
    # ports:
    #   - "8123:8123"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.home-assistant.rule=Host(`ha.${DOMAIN}`)"
      - "traefik.http.routers.home-assistant.entrypoints=websecure"
      - "traefik.http.routers.home-assistant.tls.certresolver=letsencrypt"
      - "traefik.http.services.home-assistant.loadbalancer.server.port=8123"

  # ---------------------------------------------------------------------------
  # Node-RED - 可视化流程编排
  # ---------------------------------------------------------------------------
  node-red:
    image: nodered/node-red:4.0.3
    container_name: node-red
    networks:
      - home-automation
    volumes:
      - ${DATA_DIR}/node-red:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-UTC}
    ports:
      - "1880:1880"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.node-red.rule=Host(`nodered.${DOMAIN}`)"
      - "traefik.http.routers.node-red.entrypoints=websecure"
      - "traefik.http.routers.node-red.tls.certresolver=letsencrypt"
      - "traefik.http.services.node-red.loadbalancer.server.port=1880"

  # ---------------------------------------------------------------------------
  # Mosquitto - MQTT Broker
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    networks:
      - home-automation
    volumes:
      - ${DATA_DIR}/mosquitto/config:/mosquitto/config
      - ${DATA_DIR}/mosquitto/data:/mosquitto/data
      - ${DATA_DIR}/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Zigbee2MQTT - Zigbee 设备网关
  # ---------------------------------------------------------------------------
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    networks:
      - home-automation
    volumes:
      - ${DATA_DIR}/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-UTC}
    devices:
      - ${ZIGBEE_ADAPTER_PATH:-/dev/ttyUSB0}:/dev/ttyACM0
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ESPHome - ESP 设备固件管理
  # ---------------------------------------------------------------------------
  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    networks:
      - home-automation
    volumes:
      - ${DATA_DIR}/esphome:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6052:6052"
    restart: unless-stopped

networks:
  home-automation:
    name: home-automation
  zigbee2mqtt-data:
