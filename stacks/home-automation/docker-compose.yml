services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: homeassistant
    restart: unless-stopped
    # Host networking is required for mDNS, SSDP, and HomeKit local device discovery
    network_mode: host
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8123 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Alternative Bridge Mode (uncomment if host mode cannot be used):
  # homeassistant-bridge:
  #   image: ghcr.io/home-assistant/home-assistant:2024.9.3
  #   container_name: homeassistant-bridge
  #   restart: unless-stopped
  #   networks:
  #     - internal
  #     - proxy
  #   ports:
  #     - "8123:8123"
  #   volumes:
  #     - ha-config:/config
  #   labels:
  #     - traefik.enable=true
  #     - "traefik.http.routers.ha.rule=Host(`ha.${DOMAIN}`)"
  #     - traefik.http.routers.ha.entrypoints=websecure
  #     - traefik.http.routers.ha.tls=true
  #     - traefik.http.services.ha.loadbalancer.server.port=8123

  nodered:
    image: nodered/node-red:4.0.3
    container_name: nodered
    restart: unless-stopped
    networks:
      - internal
      - proxy
    volumes:
      - nodered-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1880 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../../config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i 'healthcheck' -u '${MQTT_USER:-homelab}' -P '${MQTT_PASSWORD:-secret}' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - internal
      - proxy
    volumes:
      - z2m-data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.z2m.rule=Host(`zigbee.${DOMAIN}`)"
      - traefik.http.routers.z2m.entrypoints=websecure
      - traefik.http.routers.z2m.tls=true
      - traefik.http.services.z2m.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    networks:
      - internal
      - proxy
    volumes:
      - esphome-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.esphome.rule=Host(`esphome.${DOMAIN}`)"
      - traefik.http.routers.esphome.entrypoints=websecure
      - traefik.http.routers.esphome.tls=true
      - traefik.http.services.esphome.loadbalancer.server.port=6052
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6052 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    external: true
    name: homelab-internal
  proxy:
    external: true

volumes:
  ha-config:
  nodered-data:
  mosquitto-data:
  mosquitto-log:
  z2m-data:
  esphome-config:
