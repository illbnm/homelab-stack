services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ha-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nodered:
    image: nodered/node-red:4.0.3
    container_name: nodered
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - nodered-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:1880/\", (r) => process.exit(r.statusCode == 200 ? 0 : 1))' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - proxy
    volumes:
      - mosquitto-data:/mosquitto/data
      - ../../config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -u $${MQTT_USER:-admin} -P $${MQTT_PASSWORD:-admin} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - z2m-data:/app/data
      - /run/udev:/run/udev:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.z2m.rule=Host(`z2m.${DOMAIN}`)"
      - traefik.http.routers.z2m.entrypoints=websecure
      - traefik.http.routers.z2m.tls=true
      - traefik.http.services.z2m.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - esphome-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6052/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    external: true

volumes:
  ha-config:
  nodered-data:
  mosquitto-data:
  z2m-data:
  esphome-config:
