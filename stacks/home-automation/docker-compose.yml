name: homelab-home
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    networks: [proxy]
    volumes: [ha_config:/config, /etc/localtime:/etc/localtime:ro]
    environment: [TZ=${TZ:-UTC}]
    privileged: true
    healthcheck: {test: ["CMD","curl","-f","http://localhost:8123"], interval: 30s, timeout: 10s, retries: 3, start_period: 60s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.homeassistant.entrypoints=https"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.routers.homeassistant.tls.certresolver=letsencrypt"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    networks: [proxy]
    volumes: [nodered_data:/data]
    environment: [TZ=${TZ:-UTC}]
    healthcheck: {test: ["CMD","curl","-f","http://localhost:1880"], interval: 30s, timeout: 10s, retries: 3, start_period: 20s}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nodered.rule=Host(`flows.${DOMAIN}`)"
      - "traefik.http.routers.nodered.entrypoints=https"
      - "traefik.http.routers.nodered.tls=true"
      - "traefik.http.routers.nodered.tls.certresolver=letsencrypt"
      - "traefik.http.services.nodered.loadbalancer.server.port=1880"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    network_mode: host
    volumes: [zigbee_data:/app/data, /run/udev:/run/udev:ro]
    environment: [TZ=${TZ:-UTC}]
    devices: [/dev/ttyACM0]
    labels: ["traefik.enable=false"]

  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    restart: unless-stopped
    networks: [proxy]
    volumes: [mqtt_data:/mosquitto/data, mqtt_log:/mosquitto/log]
    ports: ["1883:1883", "9001:9001"]
    labels: ["traefik.enable=false"]

networks: {proxy: {external: true, name: proxy}}
volumes: {ha_config: {}, nodered_data: {}, zigbee_data: {}, mqtt_data: {}, mqtt_log: {}}
