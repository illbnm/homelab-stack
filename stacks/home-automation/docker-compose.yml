services:
  homeassistant:
    image: homeassistant/home-assistant:2024.11.3
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    privileged: true
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:8123/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  node-red:
    image: nodered/node-red:3.1.14
    container_name: node-red
    restart: unless-stopped
    network_mode: host
    volumes:
      - node-red-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: [CMD-SHELL, "curl -sf http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-logs:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto-passwords:/mosquitto/config/passwords:ro
      - ./mosquitto-acl:/mosquitto/config/acl:ro
    healthcheck:
      test: [CMD-SHELL, "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.41.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    network_mode: host
    volumes:
      - zigbee2mqtt-data:/app/data
      - ./zigbee2mqtt.yaml:/app/data/configuration.yaml:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_USERNAME=${MQTT_USERNAME:-homeassistant}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_BASE=${MQTT_BASE:-zigbee2mqtt}
    devices:
      - /dev/serial/by-id/usb-*:${ZIGBEE_SERIAL:-}

  esphome:
    image: esphome/esphome:2024.11.4
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - esphome-config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      - mosquitto

networks:
  default:
    driver: bridge

volumes:
  ha-config:
  node-red-data:
  mosquitto-data:
  mosquitto-logs:
  zigbee2mqtt-data:
  esphome-config: