services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.10.4
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - homeassistant-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    volumes:
      - zigbee2mqtt-data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - esphome-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.esphome.rule=Host(`esphome.${DOMAIN}`)"
      - "traefik.http.services.esphome.loadbalancer.server.port=6052"
      - "com.centurylinklabs.watchtower.enable=true"

networks:
  proxy:
    external: true
    name: proxy

volumes:
  homeassistant-config:
  mosquitto-data:
  zigbee2mqtt-data:
  esphome-config:
