version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.10.4
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${HA_PORT:-8123}:8123"
    volumes:
      - ha-config:/config
    depends_on:
      - mosquitto

  nodered:
    image: nodered/node-red:4.0.5
    container_name: nodered
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${NODERED_PORT:-1880}:1880"
    volumes:
      - nodered-data:/data
    depends_on:
      - homeassistant

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.41.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${Z2M_PORT:-8084}:8080"
    volumes:
      - z2m-data:/app/data
    depends_on:
      - mosquitto

volumes:
  mosquitto-data:
  mosquitto-log:
  ha-config:
  nodered-data:
  z2m-data:
