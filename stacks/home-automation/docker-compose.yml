services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ha-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # Note: network_mode: host required for mDNS/UPnP device discovery
    # Bridge mode alternative (limited device discovery):
    # networks:
    #   - proxy
    #   - internal
    # ports:
    #   - "8123:8123"

  nodered:
    image: nodered/node-red:4.0.3
    container_name: nodered
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - nodered-data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.nodered.rule=Host(`nodered.${DOMAIN}`)"
      - traefik.http.routers.nodered.entrypoints=websecure
      - traefik.http.routers.nodered.tls=true
      - traefik.http.services.nodered.loadbalancer.server.port=1880
    depends_on:
      mosquitto:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ../../config/mosquitto:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - proxy
      - internal
    volumes:
      - z2m-data:/app/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    # Uncomment and set your Zigbee adapter device:
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    labels:
      - traefik.enable=true
      - "traefik.http.routers.z2m.rule=Host(`zigbee.${DOMAIN}`)"
      - traefik.http.routers.z2m.entrypoints=websecure
      - traefik.http.routers.z2m.tls=true
      - traefik.http.services.z2m.loadbalancer.server.port=8080
    depends_on:
      mosquitto:
        condition: service_healthy

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - esphome-config:/config
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - "traefik.http.routers.esphome.rule=Host(`esphome.${DOMAIN}`)"
      - traefik.http.routers.esphome.entrypoints=websecure
      - traefik.http.routers.esphome.tls=true
      - traefik.http.services.esphome.loadbalancer.server.port=6052

networks:
  internal:
    external: true
  proxy:
    external: true

volumes:
  ha-config:
  nodered-data:
  mosquitto-data:
  mosquitto-log:
  z2m-data:
  esphome-config:
