name: home-automation

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.9.3
    container_name: homeassistant
    restart: unless-stopped
    # 必须使用 host 网络：mDNS / UPnP / SSDP 设备发现依赖组播与广播，
    # bridge 模式下无法自动发现局域网内的智能设备（详见 README.md）。
    network_mode: host
    # --- bridge 模式替代配置：注释掉上面的 network_mode 后启用下面几行 ---
    # networks:
    #   - home-automation
    # ports:
    #   - "${HA_PORT:-8123}:8123"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    privileged: true
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2.0.19
    container_name: mosquitto
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./data/mosquitto/passwd:/mosquitto/config/passwd:ro
      - ./data/mosquitto/data:/mosquitto/data
      - ./data/mosquitto/log:/mosquitto/log

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:1.40.2
    container_name: zigbee2mqtt
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "${ZIGBEE2MQTT_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./zigbee2mqtt/configuration.yaml:/app/data/configuration.yaml
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - ${ZIGBEE_DEVICE:-/dev/ttyUSB0}:/dev/ttyACM0
    depends_on:
      - mosquitto

  nodered:
    image: nodered/node-red:4.0.3
    container_name: nodered
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "${NODERED_PORT:-1880}:1880"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/nodered:/data
    depends_on:
      - mosquitto

  esphome:
    image: ghcr.io/esphome/esphome:2024.9.3
    container_name: esphome
    restart: unless-stopped
    networks:
      - home-automation
    ports:
      - "${ESPHOME_PORT:-6052}:6052"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ESPHOME_DASHBOARD_USE_PING: "true"
    volumes:
      - ./data/esphome:/config

networks:
  home-automation:
    driver: bridge
