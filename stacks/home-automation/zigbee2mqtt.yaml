# Zigbee2MQTT Configuration
# https://www.zigbee2mqtt.io/guide/configuration/

mqtt:
  base_topic: zigbee2mqtt
  user: homeassistant
  password: ${MQTT_PASSWORD}
  server: mqtt://mosquitto:1883
  include_device_info: true

serial:
  # USB Zigbee adapter - adjust for your hardware
  # Common options: /dev/ttyUSB0, /dev/ttyACM0, /dev/serial/by-id/usb-...
  port: ${ZIGBEE_SERIAL:-/dev/ttyUSB0}

frontend:
  port: 8080
  host: 0.0.0.0

assistant:
  legacy_entity_attributes: false
  mqtt:
    state_topic: homeassistant/binary_sensor/zigbee2mqtt/state
    config_topic: homeassistant/binary_sensor/zigbee2mqtt/config

device_options:
  legacy: false

ota:
  # Enable OTA updates
  update_check_interval: 604800  # weekly

advanced:
  log_level: info
  log_output:
    - console
  pan_id: 0x1A2B
  ext_pan_id:
    - 0xDD
    - 0xDD
    - 0xDD
    - 0xDD
    - 0xDD
    - 0xDD
    - 0xDD
    - 0xDD
  channel: 15
  network_key:
    - 1
    - 3
    - 5
    - 7
    - 9
    - 11
    - 13
    - 15
    - 2
    - 4
    - 6
    - 8
    - 10
    - 12
    - 14
    - 16
  availability:
    active:
      timeout: 10
    passive:
      timeout: 1500
  homeassistant:
    legacy_availability: false

experimental:
  # Enable new features
  transmit_power: 20