# =============================================================================
# Mosquitto MQTT Broker — Production Configuration
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html
# =============================================================================

# ---- Listeners ----
# Standard MQTT (for LAN devices + internal services)
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT clients)
listener 9001
protocol websockets

# ---- Authentication ----
# Disable anonymous access — all clients must authenticate
allow_anonymous false
password_file /mosquitto/config/passwd

# ---- Access Control ----
acl_file /mosquitto/config/acl.conf

# ---- Persistence ----
persistence true
persistence_location /mosquitto/data/

# ---- Logging ----
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- Security ----
# Max inflight messages per client
max_inflight_messages 20
# Max queued messages per client
max_queued_messages 1000
# Message size limit (256KB)
message_size_limit 262144
