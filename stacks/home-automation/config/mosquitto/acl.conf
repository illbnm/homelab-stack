# =============================================================================
# Mosquitto MQTT — Access Control List (ACL)
# Docs: https://mosquitto.org/man/mosquitto-conf-5.html
#
# Format:
#   user <username>
#   topic [read|write|readwrite|deny] <topic>
#
# Patterns:
#   %c = client id,  %u = username
# =============================================================================

# ---- Home Assistant ----
# Full access to all topics (hub role)
user homeassistant
topic readwrite #

# ---- Zigbee2MQTT ----
# Publishes device states, subscribes to commands
user zigbee2mqtt
topic readwrite zigbee2mqtt/#
topic read homeassistant/#

# ---- Node-RED ----
# Flow automation needs broad access
user nodered
topic readwrite #

# ---- ESPHome ----
# ESPHome devices publish state and subscribe to commands
user esphome
topic readwrite esphome/#
topic read homeassistant/#

# ---- Generic IoT Devices ----
# Restrict generic devices to their own namespace
# Add per-device ACLs as needed:
# user mydevice
# topic readwrite devices/mydevice/#

# ---- Default ----
# Deny all topics not explicitly granted (implicit)
