# =============================================================================
# HomeLab Stack — Base Infrastructure
# Services: Traefik (reverse proxy) + Portainer (container management)
#           + Watchtower (auto-updates) + Docker Socket Proxy
#
# Prerequisites:
#   1. cp stacks/base/.env.example stacks/base/.env && fill in required values
#   2. ../../scripts/check-deps.sh
#   3. docker network create proxy
#   4. touch ../../config/traefik/acme.json && chmod 600 ../../config/traefik/acme.json
#   5. docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — Read-only Docker API for Traefik discovery
  # Keeps Traefik off the host Docker socket and exposes only the endpoints
  # required by the Traefik Docker provider.
  # ---------------------------------------------------------------------------
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks:
      - socket-proxy
    environment:
      - LOG_LEVEL=info
      - PING=1
      - VERSION=1
      - INFO=1
      - EVENTS=1
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - IMAGES=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy & TLS Termination
  # Dashboard: https://traefik.${DOMAIN}
  # Docs: https://doc.traefik.io/traefik/
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.6.1
    container_name: traefik
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    networks:
      - proxy
      - socket-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPTDNS_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPTDNS_ACME_DNSCHALLENGE_PROVIDER=${ACME_DNS_PROVIDER:-cloudflare}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN:-}
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.43}
    volumes:
      - ../../config/traefik/traefik.yml:/traefik.yml:ro
      - ../../config/traefik/dynamic:/dynamic:ro
      - ../../config/traefik/acme.json:/acme.json
      - traefik-logs:/var/log/traefik
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Router: HTTPS dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Protect dashboard with BasicAuth
      - "traefik.http.middlewares.traefik-dashboard-auth.basicauth.users=${TRAEFIK_AUTH}"
      - "traefik.http.middlewares.traefik-dashboard-auth.basicauth.removeheader=true"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth,security-headers@file,rate-limit@file"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Portainer — Docker Management UI
  # URL: https://portainer.${DOMAIN}
  # First login: set admin password within 5 minutes
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.21.3
    container_name: portainer
    restart: unless-stopped
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Watchtower — Automatic Container Updates
  # Checks for image updates daily at 3:00 AM.
  # Notifications can use Shoutrrr URLs for ntfy or Gotify (see .env.example).
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_TIMEOUT=60s
      - WATCHTOWER_NOTIFICATIONS=${WATCHTOWER_NOTIFICATIONS:-}
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
      - WATCHTOWER_NOTIFICATIONS_LEVEL=warn
      # Scope: only update containers with this label
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.43}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Networks
# NOTE: 'proxy' network is EXTERNAL — create it before first run:
#   docker network create proxy
# All other stacks join this network to be accessible via Traefik.
# =============================================================================
networks:
  proxy:
    external: true
    name: proxy
  socket-proxy:
    name: homelab-socket-proxy
    internal: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  portainer-data:
    driver: local
  traefik-logs:
    driver: local
