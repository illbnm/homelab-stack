version: '3.8'

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: socket-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - VERSION=1
      - PING=1
    networks:
      - proxy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:2375/version']
      interval: 30s
      timeout: 10s
      retries: 3

  traefik:
    image: traefik:v3.1.6
    container_name: traefik
    restart: unless-stopped
    depends_on:
      socket-proxy:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-certs:/certs
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_AUTH=${TRAEFIK_AUTH}
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=auth@file
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.tls=true
    networks:
      - proxy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck']
      interval: 30s
      timeout: 10s
      retries: 3

  portainer:
    image: portainer/portainer-ce:2.21.3
    container_name: portainer
    restart: unless-stopped
    volumes:
      - portainer-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
      - proxy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9000']
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${NOTIFICATION_URL:-}
      - TZ=${TZ:-Asia/Shanghai}
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
    # Watchtower uses socket-proxy via DOCKER_HOST if configured,
    # but default behavior with label-enable and network access suffices
    # when socket is proxied and containers share the proxy network.

volumes:
  traefik-certs:
  portainer-data:

networks:
  proxy:
    external: true
