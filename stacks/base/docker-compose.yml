# =============================================================================
# HomeLab Stack — Base Infrastructure
# Services: Traefik (reverse proxy) + Portainer (container management)
#           + Watchtower (auto-updates)
#
# Prerequisites:
#   1. cp .env.example .env && fill in required values
#   2. ./scripts/check-deps.sh
#   3. docker network create proxy
#   4. touch config/traefik/acme.json && chmod 600 config/traefik/acme.json
#   5. docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Docker Socket Proxy — Security Isolation Layer
  # Provides restricted access to Docker socket for Traefik/Portainer/Watchtower
  # Docs: https://github.com/Tecnativa/docker-socket-proxy
  # ---------------------------------------------------------------------------
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: socket-proxy
    restart: unless-stopped
    networks:
      - proxy
    environment:
      # Allow only specific Docker API endpoints
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NETWORKS=1
      - IMAGES=1
      - INFO=1
      - VOLUMES=1
      - POST=0  # Disable write operations for security
      - DELETE=0
      - PUT=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Traefik — Reverse Proxy & TLS Termination
  # Dashboard: https://traefik.${DOMAIN}
  # Docs: https://doc.traefik.io/traefik/
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1.6
    container_name: traefik
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ}
      - DOCKER_HOST=tcp://socket-proxy:2375
    volumes:
      - ../../config/traefik/traefik.yml:/traefik.yml:ro
      - ../../config/traefik/dynamic:/dynamic:ro
      - ../../config/traefik/acme.json:/acme.json
      - traefik-logs:/var/log/traefik
    labels:
      # Enable Traefik for this container
      - "traefik.enable=true"
      # Router: HTTPS dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Protect dashboard with BasicAuth
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file,security-headers@file"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Portainer — Docker Management UI
  # URL: https://portainer.${DOMAIN}
  # First login: set admin password within 5 minutes
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:2.21.4
    container_name: portainer
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://socket-proxy:2375
      # Authentik OAuth2 Integration
      - PORTAINER__AUTHENTICATION__LOGIN_DISPLAY_NAME=Authentik
      - PORTAINER__AUTHENTICATION__METHODS=oauth,local
      - PORTAINER__AUTHENTICATION__OAUTH2__ENABLED=true
      - PORTAINER__AUTHENTICATION__OAUTH2__AUTH_URL=https://${AUTHENTIK_DOMAIN}/application/o/authorize/
      - PORTAINER__AUTHENTICATION__OAUTH2__TOKEN_URL=https://${AUTHENTIK_DOMAIN}/application/o/token/
      - PORTAINER__AUTHENTICATION__OAUTH2__USER_INFO_URL=https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
      - PORTAINER__AUTHENTICATION__OAUTH2__CLIENT_ID=${PORTAINER_OAUTH_CLIENT_ID}
      - PORTAINER__AUTHENTICATION__OAUTH2__CLIENT_SECRET=${PORTAINER_OAUTH_CLIENT_SECRET}
      - PORTAINER__AUTHENTICATION__OAUTH2__SCOPE=openid profile email
      - PORTAINER__AUTHENTICATION__OAUTH2__USER_CLAIM_EMAIL=email
      - PORTAINER__AUTHENTICATION__OAUTH2__USER_CLAIM_USERNAME=preferred_username
      - PORTAINER__AUTHENTICATION__OAUTH2__USER_CLAIM_GROUPS=groups
      - PORTAINER__AUTHENTICATION__OAUTH2__ADMIN_GROUP=homelab-admins
      - PORTAINER__AUTHENTICATION__OAUTH2__USER_GROUP=homelab-users
      - PORTAINER__AUTHENTICATION__OAUTH2__REDIRECT_URL=https://portainer.${DOMAIN}/oauth2/callback
      - PORTAINER__AUTHENTICATION__OAUTH2__INSECURE_SKIP_VERIFY=false
    volumes:
      - portainer-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portainer.service=portainer"
      - "traefik.http.routers.portainer.middlewares=authentik@file,security-headers@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Watchtower — Automatic Container Updates
  # Checks for image updates daily at 4:00 AM
  # Notifications sent via configured notifier (see .env)
  # ---------------------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: watchtower
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      socket-proxy:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_TIMEOUT=60s
      - WATCHTOWER_NOTIFICATIONS_LEVEL=warn
      # Scope: only update containers with this label
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.44
      - DOCKER_HOST=tcp://socket-proxy:2375
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "/watchtower", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Networks
# NOTE: 'proxy' network is EXTERNAL — create it before first run:
#   docker network create proxy
# All other stacks join this network to be accessible via Traefik.
# =============================================================================
networks:
  proxy:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  portainer-data:
    driver: local
  traefik-logs:
    driver: local
