# Local test override — uses traefik.local.yml (no HTTPS/ACME)
services:
  traefik:
    volumes:
      - ../../config/traefik/traefik.local.yml:/traefik.yml:ro
      - ../../config/traefik/dynamic:/dynamic:ro
      - traefik-logs:/var/log/traefik
    ports:
      - "80:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
