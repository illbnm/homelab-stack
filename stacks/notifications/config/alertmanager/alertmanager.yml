global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: ntfy

  routes:
    - match:
        severity: critical
      receiver: ntfy-critical
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: ntfy-warning

receivers:
  - name: ntfy
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts'
        send_resolved: true

  - name: ntfy-critical
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts?priority=high&tags=rotating_light'
        send_resolved: true

  - name: ntfy-warning
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts?priority=default&tags=warning'
        send_resolved: true