name: homelab-notifications

services:
  ntfy:
    # 国内镜像替换: docker.m.daocloud.io/binwiederhier/ntfy:v2.11.0
    image: binwiederhier/ntfy:v2.11.0
    container_name: homelab-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - "./config/ntfy/server.yml:/etc/ntfy/server.yml:ro"
      - "${DATA_ROOT:-./data}/ntfy/cache:/var/cache/ntfy"
      - "${DATA_ROOT:-./data}/ntfy/lib:/var/lib/ntfy"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`ntfy.${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.tls.certresolver=letsencrypt"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  gotify:
    # 国内镜像替换: docker.m.daocloud.io/gotify/server:2.5.0
    image: gotify/server:2.5.0
    container_name: homelab-gotify
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      GOTIFY_DEFAULTUSER_NAME: "${GOTIFY_ADMIN_USER:-admin}"
      GOTIFY_DEFAULTUSER_PASS: "${GOTIFY_ADMIN_PASSWORD:?GOTIFY_ADMIN_PASSWORD is required}"
    volumes:
      - "${DATA_ROOT:-./data}/gotify:/app/data"
    networks:
      - proxy
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`gotify.${DOMAIN}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls.certresolver=letsencrypt"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  proxy:
    external: true
  internal:
    external: true
