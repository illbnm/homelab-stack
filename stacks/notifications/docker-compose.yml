version: '3.8'

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../../config/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    environment:
      - TZ=${TZ:-UTC}
      - NTFY_BASE_URL=https://ntfy.${DOMAIN:-example.com}
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/v1/health" || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gotify:
    image: gotify/server:2.5.0
    container_name: gotify
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gotify_data:/app/data
    environment:
      - TZ=${TZ:-UTC}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_PASSWORD:-ChangeMe123!}
    networks:
      - homelab
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health" || exit 1]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - ntfy

networks:
  homelab:
    external: true
    name: homelab

volumes:
  ntfy_cache:
    driver: local
  ntfy_data:
    driver: local
  gotify_data:
    driver: local