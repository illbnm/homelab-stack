version: "3.8"

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    restart: unless-stopped
    command:
      - serve
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "${NTFY_PORT:-8090}:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-etc:/etc/ntfy

  apprise:
    image: caronc/apprise:v1.9.0
    container_name: apprise
    restart: unless-stopped
    ports:
      - "${APPRISE_PORT:-8000}:8000"
    volumes:
      - apprise-config:/config

volumes:
  ntfy-cache:
  ntfy-etc:
  apprise-config:
