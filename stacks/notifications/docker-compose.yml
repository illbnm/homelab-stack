# =============================================================================
# HomeLab Stack — Notifications Stack
# Services: ntfy (push notifications) + Gotify (backup push service)
#
# Usage:
#   cd stacks/notifications && cp .env.example .env && nano .env
#   docker compose up -d
#   ../../scripts/notify.sh test "Hello" "Notifications are working!"
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # ntfy — Simple HTTP-based pub-sub notification service
  # Docs: https://docs.ntfy.sh/
  # ---------------------------------------------------------------------------
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    restart: unless-stopped
    command: serve
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
      - ../../config/ntfy/server.yml:/etc/ntfy/server.yml:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`${NTFY_DOMAIN}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.tls.certresolver=letsencrypt"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    networks:
      - proxy
      - notifications

  # ---------------------------------------------------------------------------
  # Gotify — Simple server for sending and receiving messages
  # Docs: https://gotify.net/
  # ---------------------------------------------------------------------------
  gotify:
    image: gotify/server:2.5.0
    container_name: gotify
    restart: unless-stopped
    volumes:
      - gotify_data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${GOTIFY_DOMAIN}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls.certresolver=letsencrypt"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"
    networks:
      - proxy
      - notifications

volumes:
  ntfy_cache:
  ntfy_data:
  gotify_data:

networks:
  proxy:
    external: true
    name: proxy
  notifications:
    name: notifications
