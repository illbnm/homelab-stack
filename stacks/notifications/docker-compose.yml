services:
  # ============================================================
  # Notifications Stack — 统一通知中心
  # Issue #13 · Bounty $80
  # ============================================================

  ntfy:
    image: binwiederhier/ntfy:2.11.0
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      - NTFY_BASE_URL=https://${NTFY_HOST:-ntfy.${DOMAIN:-local}}
      - NTFY_BEHIND_PROXY=true
      - NTFY_AUTH_DEFAULT_ACCESS=deny-all
      - NTFY_AUTH_FILE=/var/lib/ntfy/user.db
    volumes:
      - ntfy_data:/var/lib/ntfy
    ports:
      - "${NTFY_PORT:-8090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`${NTFY_HOST:-ntfy.${DOMAIN:-local}}`)"
      - "traefik.http.routers.ntfy.entrypoints=websecure"
      - "traefik.http.routers.ntfy.tls=true"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
    profiles:
      - notifications
      - full

  gotify:
    image: gotify/server:2.6.1
    container_name: gotify
    restart: unless-stopped
    environment:
      - GOTIFY_SERVER_PORT=80
      - GOTIFY_SERVER_SSL_ENABLED=false
      - GOTIFY_DATABASE_DIALECT=sqlite3
      - GOTIFY_DATABASE_CONNECTION=/app/data/gotify.db
      - GOTIFY_DEFAULT_USER_NAME=admin
      - GOTIFY_DEFAULT_USER_PASS=${GOTIFY_ADMIN_PASS:-changeme}
      - GOTIFY_PASSSTHROUGH_MODE=enabled
    volumes:
      - gotify_data:/app/data
    ports:
      - "${GOTIFY_PORT:-8085}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${GOTIFY_HOST:-gotify.${DOMAIN:-local}}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls=true"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"
    profiles:
      - notifications
      - full

  # Apprise API — 多平台通知网关
  apprise:
    image: caronc/apprise:1.0.0
    container_name: apprise
    restart: unless-stopped
    environment:
      - APPRISE_STATEFUL_MODE=simple
      - APPRISE_CONFIG_DIR=/config
    volumes:
      - apprise_config:/config
    ports:
      - "${APPRISE_PORT:-8088}:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apprise.rule=Host(`${APPRISE_HOST:-notify.${DOMAIN:-local}}`)"
      - "traefik.http.routers.apprise.entrypoints=websecure"
      - "traefik.http.routers.apprise.tls=true"
      - "traefik.http.services.apprise.loadbalancer.server.port=8000"
    profiles:
      - notifications
      - full

volumes:
  ntfy_data:
    driver: local
  gotify_data:
    driver: local
  apprise_config:
    driver: local
