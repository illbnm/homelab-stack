version: "3.9"

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: notif-ntfy
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8089}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    ports:
      - "8089:80"
    networks:
      - notifications
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  gotify:
    image: gotify/server:2.5.0
    container_name: notif-gotify
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASSWORD:-admin}
    volumes:
      - gotify_data:/app/data
    ports:
      - "8091:80"
    networks:
      - notifications
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  notifications:
    driver: bridge

volumes:
  ntfy_cache:
  ntfy_data:
  gotify_data:
