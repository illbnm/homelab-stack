# ============================================================
# Promtail Configuration — HomeLab Observability
# ============================================================
# Collects: Docker container logs, system logs, Traefik access logs
# ============================================================

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ── Docker Container Logs (auto-discovery) ────────────────
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Container name (strip leading /)
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      # Log stream (stdout/stderr)
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      # Compose service name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Compose project name
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      # Stack name (for multi-stack setups)
      - source_labels: [__meta_docker_container_label_com_docker_compose_project_working_dir]
        regex: ".*/stacks/([^/]+)/.*"
        target_label: stack
    pipeline_stages:
      # Detect and parse JSON log lines
      - match:
          selector: '{container=~".+"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
            - labels:
                level:
      # Drop debug-level logs to save space
      - match:
          selector: '{level="debug"}'
          action: drop

  # ── System Logs ───────────────────────────────────────────
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: syslog
          __path__: /var/log/syslog
          host: ${HOSTNAME}

  - job_name: auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          __path__: /var/log/auth.log

  # ── Traefik Access Logs ──────────────────────────────────
  - job_name: traefik
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          __path__: /var/log/traefik/access.log
    pipeline_stages:
      # Parse Traefik CLF/JSON access log
      - regex:
          expression: '^(?P<remote_addr>[\w\.]+) - (?P<user>[^ ]*) \[(?P<time_local>.*)\] "(?P<method>[^ ]*) (?P<path>[^ ]*) (?P<protocol>[^"]*)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)"'
      - labels:
          method:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"
