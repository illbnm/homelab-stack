# Service alert rules
groups:
  - name: service_alerts
    rules:
      - alert: TraefikHighErrorRate
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) /
          sum(rate(traefik_service_requests_total[5m])) * 100 > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Traefik 5xx error rate high"
          description: "Traefik 5xx error rate is above 1% (current: {{ $value }}%)"

      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.99,
            sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time P99"
          description: "P99 response time is above 2 seconds (current: {{ $value }}s)"