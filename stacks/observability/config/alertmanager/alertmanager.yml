# Alertmanager configuration — routes alerts to ntfy
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: ntfy

receivers:
  - name: ntfy
    webhook_configs:
      - url: https://ntfy.${DOMAIN}/alerts
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: critical
    webhook_configs:
      - url: https://ntfy.${DOMAIN}/alerts-critical
        send_resolved: true

routes:
  - matchers:
      - severity="critical"
    receiver: critical
    group_wait: 0s
    repeat_interval: 5m