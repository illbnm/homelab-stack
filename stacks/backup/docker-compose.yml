# =============================================================================
# HomeLab Stack — Backup & Disaster Recovery
# Services: Duplicati (encrypted cloud backup) + Restic REST Server (local repo)
#
# 3-2-1 Strategy: 3 copies, 2 media types, 1 offsite
#
# Copyright (c) 2026 思捷娅科技 (SJYKJ)
# License: MIT
# Author: 小米粒 (Xiaomili) - AI Agent
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Duplicati — Encrypted Cloud Backup
  # Web UI: https://backup.${DOMAIN}
  # Supports: S3, B2, SFTP, R2, local, and many more
  # Docs: https://duplicati.readthedocs.io/
  # ---------------------------------------------------------------------------
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.0.8
    container_name: duplicati
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - CLI_ARGS=--webservice-password=${DUPLICATI_PASSWORD:-}
    volumes:
      - duplicati-config:/config
      - duplicati-restore:/restore
      # Mount all stack data for backup access
      - /opt/homelab/backups:/source/backups:ro
      - /opt/homelab/stacks:/source/stacks:ro
      - /opt/homelab/config:/source/config:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`backup.${DOMAIN}`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure"
      - "traefik.http.routers.duplicati.tls.certresolver=letsencrypt"
      - "traefik.http.routers.duplicati.service=duplicati"
      - "traefik.http.routers.duplicati.middlewares=security-headers@file"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8200/api/v1/serverstate"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Restic REST Server — Local Backup Repository
  # Provides a deduplicated, encrypted local backup target.
  # Docs: https://restic.readthedocs.io/en/stable/ REST backend
  # ---------------------------------------------------------------------------
  restic-server:
    image: restic/rest-server:0.13.0
    container_name: restic-server
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - TZ=${TZ}
      - OPTIONS=--prometheus --listen ":8000"
    volumes:
      - restic-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restic.rule=Host(`restic.${DOMAIN}`)"
      - "traefik.http.routers.restic.entrypoints=websecure"
      - "traefik.http.routers.restic.tls.certresolver=letsencrypt"
      - "traefik.http.routers.restic.service=restic"
      - "traefik.http.routers.restic.middlewares=security-headers@file"
      - "traefik.http.services.restic.loadbalancer.server.port=8000"
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# =============================================================================
# Networks
# =============================================================================
networks:
  proxy:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  duplicati-config:
    driver: local
  duplicati-restore:
    driver: local
  restic-data:
    driver: local
