# =============================================================================
# HomeLab Stack — Backup & Disaster Recovery Stack
# Services: Duplicati + Restic REST Server
#
# Prerequisites:
# 1. Base stack running (Traefik on proxy network)
# 2. cp .env.example .env && fill in required values
# 3. docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Duplicati — Encrypted Cloud Backup with Web UI
  # URL: https://backup.<DOMAIN>
  # Docs: https://duplicati.readthedocs.io/
  # ---------------------------------------------------------------------------
  duplicati:
    image: lscr.io/linuxserver/duplicati:2.0.8
    container_name: duplicati
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ}
      - CLI_ARGS=--webservice-password=${DUPLICATI_PASSWORD}
    volumes:
      - duplicati-config:/config
      - ${BACKUP_SOURCE:-/opt/homelab}:/source:ro
      - ${BACKUP_LOCAL_DIR:-/opt/homelab-backups}:/backups
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.duplicati.rule=Host(`backup.${DOMAIN}`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure"
      - "traefik.http.routers.duplicati.tls.certresolver=letsencrypt"
      - "traefik.http.routers.duplicati.middlewares=security-headers@file"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8200/api/v1/serverstate || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Restic REST Server — Local Backup Repository
  # URL: https://restic.<DOMAIN>
  # Docs: https://restic.readthedocs.io/en/stable/REST.html
  # ---------------------------------------------------------------------------
  restic-rest:
    image: restic/rest-server:0.13.0
    container_name: restic-rest
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - OPTIONS=--append-only --prometheus
      - PASSWORD_FILE=/data/.htpasswd
    volumes:
      - restic-data:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restic.rule=Host(`restic.${DOMAIN}`)"
      - "traefik.http.routers.restic.entrypoints=websecure"
      - "traefik.http.routers.restic.tls.certresolver=letsencrypt"
      - "traefik.http.routers.restic.middlewares=security-headers@file"
      - "traefik.http.services.restic.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# =============================================================================
# Networks
# =============================================================================
networks:
  proxy:
    external: true

# =============================================================================
# Volumes
# =============================================================================
volumes:
  duplicati-config:
    driver: local
  restic-data:
    driver: local
