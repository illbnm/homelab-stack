# Mosquitto 2.x 安全基线配置
# 认证：关闭匿名访问，强制用户名/密码；密码文件由 scripts/setup-mosquitto.sh 生成。
per_listener_settings true

# MQTT over TCP
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# MQTT over WebSocket（浏览器端 / Node-RED 仪表盘）
listener 9001
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
connection_messages true
