listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/data/mosquitto.log
log_type all
connection_messages true
log_timestamp true

# Home Assistant bridge mode alternative (comment out network_mode: host above)
# listener 1883
#   Remove the network_mode: host from Home Assistant
#   Add: ports: ["8123:8123"]
#   Limitation: mDNS/UPnP discovery may not work
