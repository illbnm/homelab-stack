# =============================================================================
# Grafana Dashboard Provider — Auto-loads JSON from /var/lib/grafana/dashboards
# =============================================================================
apiVersion: 1

providers:
  - name: HomeLab
    orgId: 1
    folder: HomeLab
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 60
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
