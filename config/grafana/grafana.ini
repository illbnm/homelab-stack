[auth.generic_oauth]
enabled = true
name = Authentik
client_id = 
client_secret = 
auth_url = https://auth.${DOMAIN}/application/o/authorize/
token_url = http://authentik-server:9000/application/o/token/
api_url = http://authentik-server:9000/application/o/userinfo/
signout_redirect_url = https://auth.${DOMAIN}/application/o/<authentik-slug>/end-session/
role_attribute_path = contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-users') && 'Viewer'