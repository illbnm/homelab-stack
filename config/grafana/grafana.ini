[server]
domain = grafana.${DOMAIN}
root_url = https://grafana.${DOMAIN}/

[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
client_id = grafana-oidc
client_secret = ${GRAFANA_OIDC_CLIENT_SECRET}
scopes = openid profile email groups
email_attribute_path = email
login_attribute_path = preferred_username
name_attribute_path = name
auth_url = https://auth.${DOMAIN}/application/o/authorize/
token_url = https://auth.${DOMAIN}/application/o/token/
api_url = https://auth.${DOMAIN}/application/o/userinfo/
role_attribute_path = contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-users') && 'Editor' || 'Viewer'
allow_assign_grafana_admin = true
use_pkce = true
