#!/usr/bin/env python3
"""
Generate a Grafana INI configuration with OIDC authentication against Authentik.

The script creates (or overwrites) ``config/grafana/grafana.ini`` using the
provided environment variables or command‑line arguments. It validates the
required parameters, writes a well‑structured INI file and logs the operation.

Typical usage:
    python generate_grafana_config.py \
        --domain example.com \
        --client-id grafana-client \
        --client-secret super-secret \
        --redirect-uri https://grafana.example.com/login/generic_oauth

The script exits with a non‑zero status on validation or I/O errors.
"""

import argparse
import configparser
import logging
import os
import sys
from pathlib import Path
from typing import Mapping

_LOGGER = logging.getLogger(__name__)


def _setup_logging(verbose: bool = False) -> None:
    """Configure console logging.

    Args:
        verbose: Enable DEBUG level logging when True, otherwise INFO.
    """
    level = logging.DEBUG if verbose else logging.INFO
    handler = logging.StreamHandler(sys.stdout)
    formatter = logging.Formatter(
        fmt="%(asctime)s %(levelname)s %(name)s %(message)s",
        datefmt="%Y-%m-%d %H:%M:%S",
    )
    handler.setFormatter(formatter)
    _LOGGER.setLevel(level)
    # Prevent duplicate handlers if setup_logging is called multiple times
    if not _LOGGER.handlers:
        _LOGGER.addHandler(handler)


def _parse_args() -> argparse.Namespace:
    """Parse command‑line arguments.

    Returns:
        Parsed arguments namespace.
    """
    parser = argparse.ArgumentParser(
        description="Generate Grafana INI with OIDC settings for Authentik."
    )
    parser.add_argument(
        "--domain",
        required=False,
        help="Base domain (e.g. example.com). Used to build Authentik URLs.",
    )
    parser.add_argument(
        "--client-id",
        required=False,
        help="OIDC client identifier registered in Authentik.",
    )
    parser.add_argument(
        "--client-secret",
        required=False,
        help="OIDC client secret registered in Authentik.",
    )
    parser.add_argument(
        "--redirect-uri",
        required=False,
        help="Redirect URI configured in Authentik for Grafana.",
    )
    parser.add_argument(
        "--output",
        default="config/grafana/grafana.ini",
        help="Path to the generated INI file.",
    )
    parser.add_argument(
        "--verbose",
        action="store_true",
        help="Enable debug‑level logging.",
    )
    return parser.parse_args()


def _load_config_from_env() -> Mapping[str, str]:
    """Collect configuration values from environment variables.

    Returns:
        Mapping with keys domain, client_id, client_secret, redirect_uri.
    """
    return {
        "domain": os.getenv("GRAFANA_DOMAIN", ""),
        "client_id": os.getenv("GRAFANA_OIDC_CLIENT_ID", ""),
        "client_secret": os.getenv("GRAFANA_OIDC_CLIENT_SECRET", ""),
        "redirect_uri": os.getenv("GRAFANA_OIDC_REDIRECT_URI", ""),
    }


def _validate_params(params: Mapping[str, str]) -> None:
    """Raise ValueError if any required parameter is missing.

    Args:
        params: Mapping of configuration parameters.
    """
    missing = [k for k, v in params.items() if not v]
    if missing:
        raise ValueError(f"Missing required parameters: {', '.join(missing)}")


def _build_ini_content(params: Mapping[str, str]) -> configparser.ConfigParser:
    """Create a ConfigParser instance populated with Grafana OIDC settings.

    Args:
        params: Mapping containing domain, client_id, client_secret, redirect_uri.

    Returns:
        ConfigParser ready to be written to a file.
    """
    cfg = configparser.ConfigParser()
    cfg["paths"] = {
        "data": "/var/lib/grafana",
        "logs": "/var/log/grafana",
        "plugins": "/var/lib/grafana/plugins",
        "provisioning": "/etc/grafana/provisioning",
    }

    cfg["server"] = {
        "http_addr": "0.0.0.0",
        "http_port": "3000",
        "domain": params["domain"],
        "root_url": f"https://grafana.{params['domain']}",
        "serve_from_sub_path": "false",
    }

    cfg["auth.generic_oauth"] = {
        "enabled": "true",
        "name": "Authentik",
        "allow_sign_up": "true",
        "client_id": params["client_id"],
        "client_secret": params["client_secret"],
        "scopes": "openid profile email",
        "auth_url": f"https://auth.{params['domain']}/application/o/authorize/",
        "token_url": f"https://auth.{params['domain']}/application/o/token/",
        "api_url": f"https://auth.{params['domain']}/application/o/userinfo/",
        "team_ids": "",
        "allowed_domains": "",
        "email_attribute_path": "email",
        "login_attribute_path": "preferred_username",
        "name_attribute_path": "name",
        "role_attribute_path": "role",
        "tls_skip_verify_insecure": "false",
        "tls_client_cert": "",
        "tls_client_key": "",
        "tls_client_ca": "",
        "skip_org_role_sync": "false",
        "org_role_attribute_path": "",
        "group_attribute_path": "",
        "groups_attribute_path": "",
        "group_mapping": "",
        "group_sync": "false",
        "group_sync_interval_seconds": "600",
        "group_sync_retry_seconds": "30",
        "group_sync_max_attempts": "5",
        "group_sync_retry_backoff_factor": "2",
        "group_sync_retry_max_interval_seconds": "300",
        "group_sync_retry_jitter_seconds": "5",
    }

    return cfg


def _write_ini_file(cfg: configparser.ConfigParser, output_path: Path) -> None:
    """Write the INI configuration to disk with restrictive permissions.

    Args:
        cfg: ConfigParser instance.
        output_path: Destination file path.
    """
    # Ensure parent directory exists
    output_path.parent.mkdir(parents=True, exist_ok=True)

    # Write to a temporary file first to avoid partially written files on failure
    temp_path = output_path.with_suffix('.tmp')
    with temp_path.open('w', encoding='utf-8') as f:
        cfg.write(f)

    # Set file permissions to 0600 (owner read/write only)
    try:
        os.chmod(temp_path, 0o600)
    except PermissionError as e:
        _LOGGER.warning(f"Unable to set restrictive permissions on {temp_path}: {e}")

    # Atomically replace the target file
    temp_path.replace(output_path)
    _LOGGER.info(f"Grafana configuration written to {output_path}")


def main() -> None:
    args = _parse_args()
    _setup_logging(args.verbose)

    # Load configuration from environment and override with CLI args when provided
    env_cfg = _load_config_from_env()
    cli_cfg = {
        "domain": args.domain or env_cfg["domain"],
        "client_id": args.client_id or env_cfg["client_id"],
        "client_secret": args.client_secret or env_cfg["client_secret"],
        "redirect_uri": args.redirect_uri or env_cfg["redirect_uri"],
    }

    try:
        _validate_params(cli_cfg)
    except ValueError as exc:
        _LOGGER.error(str(exc))
        sys.exit(1)

    cfg = _build_ini_content(cli_cfg)
    output_path = Path(args.output)
    try:
        _write_ini_file(cfg, output_path)
    except Exception as exc:
        _LOGGER.error(f"Failed to write INI file: {exc}")
        sys.exit(1)

if __name__ == "__main__":
    main()
