# =============================================================================
# Grafana — OIDC Authentication via Authentik
# Reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/generic-oauth/
# =============================================================================

[auth.generic_oauth]
name = Authentik
enabled = true
allow_sign_up = true
client_id = ${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
client_secret = ${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
scopes = openid profile email
email_attribute_path = email
login_attribute_path = preferred_username
name_attribute_path = name
groups_attribute_path = groups
auth_url = https://${AUTHENTIK_DOMAIN}/application/o/authorize/
token_url = https://${AUTHENTIK_DOMAIN}/application/o/token/
api_url = https://${AUTHENTIK_DOMAIN}/application/o/userinfo/
role_attribute_path = contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-users') && 'Editor' || 'Viewer'
allow_assign_grafana_admin = true
skip_org_role_sync = false
use_pkce = true
use_refresh_token = true
