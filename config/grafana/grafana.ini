[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
client_id = ${AUTHENTIK_GRAFANA_CLIENT_ID}
client_secret = ${AUTHENTIK_GRAFANA_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://${AUTHENTIK_DOMAIN}/application/o/grafana/authorize/
token_url = https://${AUTHENTIK_DOMAIN}/application/o/grafana/token/
api_url = https://${AUTHENTIK_DOMAIN}/application/o/grafana/userinfo/
role_attribute_path = contains(groups, 'homelab-admins') && 'Admin' || 'Viewer'
