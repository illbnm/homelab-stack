# =============================================================================
# Grafana — SSO Configuration (Authentik OIDC)
# This file is mounted into the Grafana container.
#
# Prerequisites:
#   1. Run scripts/setup-authentik.sh first
#   2. Ensure GRAFANA_OAUTH_CLIENT_ID and GRAFANA_OAUTH_CLIENT_SECRET are in .env
# =============================================================================

[server]
domain = grafana.${DOMAIN}
root_url = https://grafana.${DOMAIN}/
serve_from_sub_path = false

[auth]
disable_login_form = false
oauth_auto_login = false
signout_redirect_url = https://auth.${DOMAIN}/application/o/grafana/end-session/

[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
auto_login = false
client_id = ${GRAFANA_OAUTH_CLIENT_ID}
client_secret = ${GRAFANA_OAUTH_CLIENT_SECRET}
scopes = openid profile email
empty_scopes = false
email_attribute_path = email
login_attribute_path = preferred_username
name_attribute_path = name
groups_attribute_path = groups
auth_url = https://auth.${DOMAIN}/application/o/authorize/
token_url = https://auth.${DOMAIN}/application/o/token/
api_url = https://auth.${DOMAIN}/application/o/userinfo/
role_attribute_path = contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-users') && 'Editor' || 'Viewer'
allow_assign_grafana_admin = true
skip_org_role_sync = false

[security]
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}

[users]
allow_sign_up = false
auto_assign_org = true
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false