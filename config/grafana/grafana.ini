# =============================================================================
# HomeLab Stack — Grafana Configuration
# =============================================================================

[paths]
provisioning = /etc/grafana/provisioning

[server]
domain = grafana.$__env{DOMAIN}
root_url = https://grafana.$__env{DOMAIN}

[security]
admin_user = $__env{GRAFANA_ADMIN_USER}
admin_password = $__env{GRAFANA_ADMIN_PASSWORD}

[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
client_id = $__env{GRAFANA_OAUTH_CLIENT_ID}
client_secret = $__env{GRAFANA_OAUTH_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://$__env{AUTHENTIK_DOMAIN}/application/o/authorize/
token_url = https://$__env{AUTHENTIK_DOMAIN}/application/o/token/
api_url = https://$__env{AUTHENTIK_DOMAIN}/application/o/userinfo/
signout_redirect_url = https://$__env{AUTHENTIK_DOMAIN}/application/o/grafana/end-session/
role_attribute_path = contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'

[users]
auto_assign_org = true
auto_assign_org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = false
