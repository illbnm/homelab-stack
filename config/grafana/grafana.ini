; =============================================================================
; Grafana — Authentik OIDC (patch section)
; Client credentials come from .secrets/grafana.env generated by
; scripts/authentik-setup.sh (see docs/SSO.md).
; =============================================================================

[auth.generic_oauth]
enabled = true
name = Authentik
allow_sign_up = true
client_id = ${GRAFANA_CLIENT_ID}
client_secret = ${GRAFANA_CLIENT_SECRET}
scopes = openid profile email
auth_url = https://auth.example.com/application/o/authorize/
token_url = https://auth.example.com/application/o/token/
api_url = https://auth.example.com/application/o/userinfo/
signout_redirect_url = https://auth.example.com/application/o/grafana/end-session/
role_attribute_path = contains(groups[*], 'homelab-admins') && 'Admin' || contains(groups[*], 'homelab-users') && 'Editor' || 'Viewer'
groups_attribute_path = groups
allow_assign_grafana_admin = false
