groups:
  - name: services
    rules:
      - alert: TraefikHigh5xxErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.*"}[5m])) / sum(rate(traefik_service_requests_total[5m])) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Traefik high 5xx error rate (instance {{ $labels.instance }})"
          description: "Traefik is returning > 1% 5xx errors\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: ServiceHighResponseTime
        expr: histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service high response time (service {{ $labels.service }})"
          description: "Service response time P99 is > 2s\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
