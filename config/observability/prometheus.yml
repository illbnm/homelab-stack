global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'homelab'

rule_files:
  - '/etc/prometheus/alert.rules'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # cAdvisor 容器监控
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Uptime Kuma 监控
  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']

  # Node Exporter (如果已部署)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker 容器监控
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics

  # 自定义服务监控（示例）
  - job_name: 'homelab-services'
    file_sd_configs:
      - files:
        - '/etc/prometheus/targets/*.yml'
        refresh_interval: 5m
