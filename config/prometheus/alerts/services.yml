groups:
  - name: services
    rules:
      - alert: TraefikHigh5xxErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on Traefik"
          description: "5xx error rate is above 1% for more than 5 minutes"

      - alert: ServiceHighResponseTime
        expr: histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time for {{ $labels.service }}"
          description: "P99 response time is above 2 seconds for more than 5 minutes"