groups:
  - name: services
    rules:
      - alert: TraefikHigh5xxErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Traefik high 5xx error rate"
          description: "Traefik 5xx error rate is > 1%\n  VALUE = {{ $value }}"

      - alert: ServiceHighResponseTime
        expr: histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service high response time ({{ $labels.service }})"
          description: "Service {{ $labels.service }} P99 response time is > 2s\n  VALUE = {{ $value }}"
