groups:
  - name: service_alerts
    rules:
      - alert: TraefikHigh5xxErrorRate
        expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
      - alert: ServiceLatencyP99High
        expr: histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2.0
        for: 5m
        labels:
          severity: warning
