groups:
  - name: containers
    rules:
      - alert: ContainerHighRestartRate
        expr: rate(container_last_seen[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting frequently"
          description: "Container has restarted more than 3 times in the last hour"

      - alert: ContainerOOMKilled
        expr: container_oom_events_total > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} OOM killed"
          description: "Container was killed due to out of memory"

      - alert: ContainerHealthCheckFailed
        expr: container_health_status{status!="healthy"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} health check failed"
          description: "Container health check has been failing for more than 5 minutes"