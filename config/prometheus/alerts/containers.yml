groups:
  - name: containers
    rules:
      - alert: ContainerRestarted
        expr: rate(container_start_time_seconds[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted multiple times"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last hour"

      - alert: ContainerOOMKilled
        expr: container_memory_failures_total{failure_type="oom"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container OOM killed"
          description: "Container {{ $labels.name }} was killed due to OOM"

      - alert: ContainerHealthCheckFailed
        expr: container_health_status{status="unhealthy"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container health check failed"
          description: "Container {{ $labels.name }} health check has failed"