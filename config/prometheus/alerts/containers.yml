groups:
  - name: containers
    rules:
      - alert: ContainerRestartedFrequently
        expr: rate(engine_daemon_container_states_containers{state="restarted"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restarted more than 3 times in an hour"
          description: "Container {{ $labels.name }} has restarted more than 3 times in the last hour."

      - alert: ContainerOOMKilled
        expr: container_oom_events_total > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Container was OOM killed"
          description: "Container {{ $labels.name }} was killed due to out of memory."

      - alert: ContainerHealthCheckFailed
        expr: container_health_status{status="unhealthy"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container health check failed"
          description: "Container {{ $labels.name }} health check has failed."