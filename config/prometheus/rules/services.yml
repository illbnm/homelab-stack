groups:
  - name: services
    interval: 30s
    rules:
      - alert: TraefikHigh5xxRate
        expr: |
          sum(rate(traefik_service_requests_total{code=~"5.."}[5m]))
          /
          sum(rate(traefik_service_requests_total[5m])) * 100 > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Traefik high 5xx error rate"
          description: "Traefik 5xx error rate is above 1% for more than 5 minutes (current: {{ $value }}%)"

      - alert: ServiceHighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(traefik_service_request_duration_seconds_bucket[5m])) by (le, service)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Service {{ $labels.service }} high latency"
          description: "P99 response time for {{ $labels.service }} is above 2 seconds"
