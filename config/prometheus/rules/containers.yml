groups:
  - name: containers
    interval: 1m
    rules:
      - alert: ContainerRestartRate
        expr: increase(container_restart_count[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarting too frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour."

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} was OOM killed"
          description: "Container {{ $labels.name }} was killed due to out of memory condition."

      - alert: ContainerHealthCheckFailed
        expr: container_health_status{status="unhealthy"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} health check failed"
          description: "Container {{ $labels.name }} health check has been failing for more than 5 minutes."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high CPU usage"
          description: "Container {{ $labels.name }} is using {{ $value | printf \"%.1f\" }}% CPU for more than 10 minutes."

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container {{ $labels.name }} is using {{ $value | printf \"%.1f\" }}% of its memory limit."

      - alert: ContainerNoMemoryLimit
        expr: container_spec_memory_limit_bytes{name!=""} == 0
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Container {{ $labels.name }} has no memory limit"
          description: "Container {{ $labels.name }} has no memory limit set, which may lead to resource exhaustion."
