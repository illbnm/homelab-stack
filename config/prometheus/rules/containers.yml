groups:
  - name: containers
    interval: 1m
    rules:
      - alert: ContainerRestartTooFrequent
        expr: increase(container_restart_count[1h]) > 3
        for: 1m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container restarting too frequently"
          description: "Container {{ $labels.name }} has restarted {{ $value }} times in the last hour (threshold: 3)"

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: container
        annotations:
          summary: "Container was OOM killed"
          description: "Container {{ $labels.name }} was killed due to out of memory"

      - alert: ContainerHealthCheckFailing
        expr: container_health_status{status="unhealthy"} == 1
        for: 2m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container health check failing"
          description: "Container {{ $labels.name }} health check has been failing for 2 minutes"

      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""})
        for: 2m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container is down"
          description: "Container {{ $labels.name }} has been down for 2 minutes"

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name!=""}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container CPU usage is high"
          description: "Container {{ $labels.name }} CPU usage is {{ $value }}% (threshold: 80%)"

      - alert: ContainerHighMemory
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          category: container
        annotations:
          summary: "Container memory usage is high"
          description: "Container {{ $labels.name }} memory usage is {{ $value }}% (threshold: 85%)"
