global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/host.yml
  - /etc/prometheus/alerts/containers.yml
  - /etc/prometheus/alerts/services.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
  - job_name: authentik
    static_configs:
      - targets: ["authentik-server:9300"]
  - job_name: nextcloud
    static_configs:
      - targets: ["nextcloud-exporter:9205"]
  - job_name: gitea
    static_configs:
      - targets: ["gitea:3000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
