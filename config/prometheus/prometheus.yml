global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab
    monitor: 'homelab-monitor'

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # Traefik - Reverse proxy metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          service: 'traefik'

  # Authentik - SSO metrics
  - job_name: 'authentik'
    static_configs:
      - targets: ['authentik-server:9300']
        labels:
          service: 'authentik'

  # Nextcloud - Storage metrics
  - job_name: 'nextcloud'
    static_configs:
      - targets: ['nextcloud:9205']
        labels:
          service: 'nextcloud'

  # Gitea - Code hosting metrics
  - job_name: 'gitea'
    static_configs:
      - targets: ['gitea:3000']
        labels:
          service: 'gitea'

  # Loki - Log aggregation metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Tempo - Tracing metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
        labels:
          service: 'tempo'

  # Alertmanager metrics
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # Uptime Kuma - Availability monitoring
  - job_name: 'uptime-kuma'
    static_configs:
      - targets: ['uptime-kuma:3001']
        labels:
          service: 'uptime-kuma'

  # Docker Daemon metrics (if enabled)
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'docker'
