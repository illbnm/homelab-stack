# =============================================================================
# Prometheus Configuration for HomeLab Stack
# Comprehensive monitoring for all services
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab
    environment: production

# Alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
      scheme: http
      timeout: 10s
      api_version: v2

# =============================================================================
# Scrape Configurations
# =============================================================================

scrape_configs:
  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          service: prometheus
    metrics_path: /metrics
    scheme: http

  # ---------------------------------------------------------------------------
  # Infrastructure - Core Services
  # ---------------------------------------------------------------------------
  
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
        labels:
          service: node-exporter
          component: infrastructure
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'homelab-server'

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
        labels:
          service: cadvisor
          component: infrastructure
    metrics_path: /metrics
    scheme: http

  - job_name: traefik
    static_configs:
      - targets: [traefik:8080]
        labels:
          service: traefik
          component: reverse-proxy
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # Monitoring Stack Services
  # ---------------------------------------------------------------------------
  
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels:
          service: loki
          component: monitoring
    metrics_path: /metrics

  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
        labels:
          service: alertmanager
          component: monitoring

  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
        labels:
          service: grafana
          component: monitoring

  # ---------------------------------------------------------------------------
  # SSO / Authentication
  # ---------------------------------------------------------------------------
  
  - job_name: authentik
    static_configs:
      - targets: [authentik-server:9300]
        labels:
          service: authentik
          component: authentication
    metrics_path: /metrics

  - job_name: authentik-worker
    static_configs:
      - targets: [authentik-worker:9300]
        labels:
          service: authentik-worker
          component: authentication

  # ---------------------------------------------------------------------------
  # Database Layer
  # ---------------------------------------------------------------------------
  
  - job_name: postgres
    static_configs:
      - targets: [postgres:9187]
        labels:
          service: postgres
          component: database
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        replacement: '${1}'
        target_label: database_host

  - job_name: redis
    static_configs:
      - targets: [redis:9121]
        labels:
          service: redis
          component: cache

  - job_name: mariadb
    static_configs:
      - targets: [mariadb:9104]
        labels:
          service: mariadb
          component: database

  # ---------------------------------------------------------------------------
  # Media Stack
  # ---------------------------------------------------------------------------
  
  - job_name: jellyfin
    static_configs:
      - targets: [jellyfin:8096]
        labels:
          service: jellyfin
          component: media
    metrics_path: /metrics

  - job_name: sonarr
    static_configs:
      - targets: [sonarr:8989]
        labels:
          service: sonarr
          component: media
    metrics_path: /metrics

  - job_name: radarr
    static_configs:
      - targets: [radarr:7878]
        labels:
          service: radarr
          component: media
    metrics_path: /metrics

  - job_name: prowlarr
    static_configs:
      - targets: [prowlarr:9696]
        labels:
          service: prowlarr
          component: media
    metrics_path: /metrics

  - job_name: qbittorrent
    static_configs:
      - targets: [qbittorrent:8181]
        labels:
          service: qbittorrent
          component: media
    metrics_path: /metrics

  - job_name: jellyseerr
    static_configs:
      - targets: [jellyseerr:5055]
        labels:
          service: jellyseerr
          component: media
    metrics_path: /metrics

  # ---------------------------------------------------------------------------
  # Storage Stack
  # ---------------------------------------------------------------------------
  
  - job_name: nextcloud
    static_configs:
      - targets: [nextcloud:9205]
        labels:
          service: nextcloud
          component: storage
    metrics_path: /metrics

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
        labels:
          service: minio
          component: storage

  - job_name: filebrowser
    static_configs:
      - targets: [filebrowser:8080]
        labels:
          service: filebrowser
          component: storage

  - job_name: syncthing
    static_configs:
      - targets: [syncthing:8384]
        labels:
          service: syncthing
          component: storage

  # ---------------------------------------------------------------------------
  # Productivity Stack
  # ---------------------------------------------------------------------------
  
  - job_name: gitea
    static_configs:
      - targets: [gitea:3000]
        labels:
          service: gitea
          component: productivity
    metrics_path: /metrics

  - job_name: vaultwarden
    static_configs:
      - targets: [vaultwarden:3012]
        labels:
          service: vaultwarden
          component: productivity
    metrics_path: /metrics

  - job_name: outline
    static_configs:
      - targets: [outline:3000]
        labels:
          service: outline
          component: productivity

  - job_name: stirling-pdf
    static_configs:
      - targets: [stirling-pdf:8080]
        labels:
          service: stirling-pdf
          component: productivity

  - job_name: it-tools
    static_configs:
      - targets: [it-tools:8080]
        labels:
          service: it-tools
          component: productivity

  # ---------------------------------------------------------------------------
  # AI Stack
  # ---------------------------------------------------------------------------
  
  - job_name: ollama
    static_configs:
      - targets: [ollama:11434]
        labels:
          service: ollama
          component: ai
    metrics_path: /metrics

  - job_name: open-webui
    static_configs:
      - targets: [open-webui:8080]
        labels:
          service: open-webui
          component: ai

  - job_name: localai
    static_configs:
      - targets: [localai:8080]
        labels:
          service: localai
          component: ai
    metrics_path: /metrics

  - job_name: n8n
    static_configs:
      - targets: [n8n:5678]
        labels:
          service: n8n
          component: automation

  # ---------------------------------------------------------------------------
  # Network Stack
  # ---------------------------------------------------------------------------
  
  - job_name: adguard-home
    static_configs:
      - targets: [adguard-home:3000]
        labels:
          service: adguard-home
          component: network

  - job_name: wireguard-easy
    static_configs:
      - targets: [wireguard-easy:51821]
        labels:
          service: wireguard-easy
          component: vpn

  - job_name: cloudflare-ddns
    static_configs:
      - targets: [cloudflare-ddns:8080]
        labels:
          service: cloudflare-ddns
          component: network

  - job_name: nginx-proxy-manager
    static_configs:
      - targets: [nginx-proxy-manager:81]
        labels:
          service: nginx-proxy-manager
          component: reverse-proxy

  # ---------------------------------------------------------------------------
  # Home Automation Stack
  # ---------------------------------------------------------------------------
  
  - job_name: home-assistant
    static_configs:
      - targets: [home-assistant:8123]
        labels:
          service: home-assistant
          component: home-automation
    metrics_path: /api/prometheus

  - job_name: node-red
    static_configs:
      - targets: [node-red:1880]
        labels:
          service: node-red
          component: home-automation

  - job_name: mosquitto
    static_configs:
      - targets: [mosquitto:9001]
        labels:
          service: mosquitto
          component: mqtt

  - job_name: zigbee2mqtt
    static_configs:
      - targets: [zigbee2mqtt:8080]
        labels:
          service: zigbee2mqtt
          component: home-automation

  - job_name: esphome
    static_configs:
      - targets: [esphome:6053]
        labels:
          service: esphome
          component: home-automation

  # ---------------------------------------------------------------------------
  # Notification Stack
  # ---------------------------------------------------------------------------
  
  - job_name: ntfy
    static_configs:
      - targets: [ntfy:8080]
        labels:
          service: ntfy
          component: notifications
    metrics_path: /metrics

  - job_name: gotify
    static_configs:
      - targets: [gotify:8080]
        labels:
          service: gotify
          component: notifications
    metrics_path: /metrics

  - job_name: apprise
    static_configs:
      - targets: [apprise:8000]
        labels:
          service: apprise
          component: notifications

  # ---------------------------------------------------------------------------
  # Dashboard Stack
  # ---------------------------------------------------------------------------
  
  - job_name: homepage
    static_configs:
      - targets: [homepage:3000]
        labels:
          service: homepage
          component: dashboard

  - job_name: heimdall
    static_configs:
      - targets: [heimdall:8080]
        labels:
          service: heimdall
          component: dashboard

  # ---------------------------------------------------------------------------
  # Container Management
  # ---------------------------------------------------------------------------
  
  - job_name: portainer
    static_configs:
      - targets: [portainer:9443]
        labels:
          service: portainer
          component: management
    scheme: https
    tls_config:
      insecure_skip_verify: true

  - job_name: watchtower
    static_configs:
      - targets: [watchtower:8080]
        labels:
          service: watchtower
          component: management

