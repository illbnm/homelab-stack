; =============================================================================
; Gitea Configuration — Authentik OIDC Integration
; Location: config/gitea/app.ini
; Usage: Mount to /data/gitea/conf/app.ini in docker-compose
; =============================================================================

[server]
APP_DATA_PATH = /data/gitea
DOMAIN = ${DOMAIN}
HTTP_PORT = 3000
ROOT_URL = https://git.${DOMAIN}/
DISABLE_SSH = false
SSH_PORT = 22
START_SSH_SERVER = false
LFS_START_SERVER = true

[database]
DB_TYPE = postgres
HOST = homelab-postgres:5432
NAME = gitea
USER = gitea
PASSWD = ${GITEA_DB_PASSWORD}
SCHEMA =
PATH =
LOG_SQL = false

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main

[security]
INSTALL_LOCK = true
SECRET_KEY =
INTERNAL_TOKEN =
LOGIN_REMEMBER_DAYS = 7
COOKIE_USERNAME =
COOKIE_REMEMBER_NAME =
REVERSE_PROXY_AUTHENTICATION_USER =
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128
MIN_PASSWORD_LENGTH = 8
IMPORT_LOCAL_PATHS = false
DISABLE_GIT_HOOKS = true
ONLY_ALLOW_PUSH_IF_GIT_USER_IS_SET = false
PASSWORD_COMPLEXITY = lower,upper,digit

[service]
DISABLE_REGISTRATION = false
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = true
ENABLE_BASIC_AUTHENTICATION = true
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true
NO_REPLY_ADDRESS = noreply.${DOMAIN}

[service.explore]
REQUIRE_SIGNIN_VIEW = false
DISABLE_USERS_PAGE = false

[oauth2]
ENABLE = true
JWT_SECRET = ${GITEA_OAUTH2_JWT_SECRET}
JWT_SIGNING_ALGORITHM = HS256
JWT_SIGNING_PRIVATE_KEY_FILE = jwt/private.pem
JWT_SIGNING_PUBLIC_KEY_FILE = jwt/public.pem
MAX_TOKEN_LENGTH = 32767

[oauth2_client]
REGISTER_EMAIL_CONFIRM = false
OPENID_CONNECT_SCOPES = openid profile email groups
ENABLE_AUTO_REGISTRATION = true
USERNAME = nickname
UPDATE_AVATAR = true
ACCOUNT_LINKING = login

; =============================================================================
; Authentik OIDC Provider Configuration
; =============================================================================
[openid]
ENABLE_OPENID_SIGNIN = true
ENABLE_OPENID_SIGNUP = true
WHITELISTED_URIS =
BLACKLISTED_URIS =

[auth.oauth2]
; Auto-configure from environment variables set by authentik-setup.sh
; No additional configuration needed here

[log]
MODE = console
LEVEL = Info
FLAGS = stdprefix
REDIRECT_MACARON_LOG = false
MACARON = file
ROUTER = file
XORM = file
ENABLE_ACCESS_LOG = false
ACCESS_LOG_TEMPLATE = {{.Ctx.RemoteAddr}} - {{.Identity}} {{.Start.Format "[02/Jan/2006:15:04:05 -0700]" }} "{{.Ctx.Req.Method}} {{.Ctx.Req.URL.RequestURI}} {{.Ctx.Resp.Status}}" {{.Ctx.Resp.Size}} "{{.Ctx.Req.UserAgent}}"
ACCESS = file

[log.console]
LEVEL =
COLORIZE = true
STDERR = false

[log.file]
LEVEL =
FILE_NAME =
LOG_ROTATE = true
MAX_SIZE_SHIFT = 28
DAILY_ROTATE = true
MAX_DAYS = 7
COMPRESS = true
COMPRESS_LEVEL = -1

[i18n]
LANGS = en-US,zh-CN,zh-HK,zh-TW,de-DE,fr-FR,nl-NL,lv-LV,ru-RU,ja-JP,es-ES,pt-BR,pl-PL,bg-BG,it-IT,fi-FI,tr-TR,cs-CZ,sr-SP,sv-SE,ko-KR,el-GR,uk-UA,en-GB
NAMES = English,简体中文,繁體中文（香港）,繁體中文（台灣）,Deutsch,français,Nederlands,latviešu,русский,日本語,español,português do Brasil,polski,български,italiano,suomi,Türkçe,čeština,српски,svenska,한국어,ελληνικά,українська,English (United Kingdom)

[api]
ENABLE_SWAGGER = true
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 30
DEFAULT_GIT_TREES_PER_PAGE = 1000

[ui]
EXPLORE_PAGING_NUM = 20
ISSUE_PAGING_NUM = 10
FEED_MAX_COMMIT_NUM = 5
GRAPH_MAX_COMMIT_NUM = 100
CODE_COMMENT_LINES = 4
DEFAULT_THEME = gitea-auto
THEMES = gitea-auto,gitea-arc-green,gitea-dark,gitea-light,gitea-dark-arc
SHOW_USER_EMAIL = false

[ui.admin]
USER_PAGING_NUM = 50
REPO_PAGING_NUM = 50
NOTICE_PAGING_NUM = 25
ORG_PAGING_NUM = 50

[ui.user]
REPO_PAGING_NUM = 15

[picture]
AVATAR_UPLOAD_PATH = data/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = data/repo-avatars
DISABLE_GRAVATAR = false
ENABLE_FEDERATED_AVATAR = true

[attachment]
ENABLED = true
PATH = data/attachments
ALLOWED_TYPES = .csv,.docx,.fodp,.fods,.fodt,.gif,.gz,.jpeg,.jpg,.log,.md,.mov,.mp4,.odf,.odg,.odp,.ods,.odt,.patch,.pdf,.png,.pptx,.svg,.tgz,.txt,.webm,.xls,.xlsx,.zip
MAX_SIZE = 4
MAX_FILES = 5

[time]
FORMAT =
DEFAULT_UI_LOCATION =

[session]
PROVIDER = file
PROVIDER_CONFIG = data/sessions
COOKIE_SECURE = true
COOKIE_NAME = i_like_gitea
GC_INTERVAL_TIME = 86400
SESSION_LIFE_TIME = 86400
SAME_SITE = lax

[cache]
ADAPTER = redis
HOST = network=unix,addr=/var/run/redis/redis.sock,db=0,pool_size=100,idle_timeout=180
ITEM_TTL = 16h

[cache.last_commit]
ENABLED = true
ADAPTER = redis
HOST = network=unix,addr=/var/run/redis/redis.sock,db=1,pool_size=100,idle_timeout=180
ITEM_TTL = 168h

[migrations]
ALLOWED_DOMAINS =
BLOCKED_DOMAINS =
ALLOW_LOCALNETWORKS = false

[cors]
ENABLED = false
SCHEME =
ALLOW_DOMAIN =
ALLOW_SUBDOMAIN = false
METHODS =
MAX_AGE = 10m
ALLOW_CREDENTIALS = false
HEADERS =
X_FRAME_OPTIONS = SAMEORIGIN

[other]
SHOW_FOOTER_VERSION = true
SHOW_FOOTER_TEMPLATE_LOAD_TIME = true
SHOW_FOOTER_POWERED_BY = true

[metrics]
ENABLED = false
TOKEN =

[webhook]
QUEUE_LENGTH = 1000
DELIVER_TIMEOUT = 5
SKIP_TLS_VERIFY = false
PAGING_NUM = 10
PROXY_URL =
PROXY_HOSTS =

[mailer]
ENABLED = false
PROTOCOL =
SMTP_ADDR =
SMTP_PORT =
FROM =
USER =
PASSWD =
USE_SENDMAIL = false
SENDMAIL_PATH = sendmail
SENDMAIL_ARGS =
MAILER_TYPE = smtp
SEND_BUFFER_LEN = 100
SUBJECT_PREFIX =

[openid]
ENABLE_OPENID_SIGNIN = true
ENABLE_OPENID_SIGNUP = true
WHITELISTED_URIS =
BLACKLISTED_URIS =

[repository.pull-request]
DEFAULT_MERGE_STYLE = merge
DEFAULT_CLOSE_ISSUES_VIA_COMMIT_IN_ANY_BRANCH = false
ENABLE_AUTODETECT_MANUAL_MERGE = false

[repository.upload]
ENABLED = true
TEMP_PATH = data/tmp/uploads
ALLOWED_TYPES =
FILE_MAX_SIZE = 3
MAX_FILES = 5

[repository.issue]
MAX_PINNED = 3

[release]
ALLOWED_TYPES =
DEFAULT_PAGING_NUM = 10

[project]
DEFAULT_PAGING_NUM = 30

[packages]
ENABLED = true
CHUNKED_UPLOAD_PATH = tmp/package-upload

[storage]
STORAGE_TYPE = local

[storage.packages]
STORAGE_TYPE = local
PATH = data/packages

[storage.actions_log]
STORAGE_TYPE = local
PATH = data/actions_log

[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = https://gitea.com
