# Gitea OIDC SSO Configuration for Authentik
[openid]
ENABLE_OPENID_SIGNIN = true
ENABLE_OPENID_SIGNUP = true

[oauth2_client]
ENABLE_AUTO_REGISTRATION = true
USERNAME = nickname

[oauth2]
ENABLED = true
; Authentik OIDC Provider
[oauth2.authentik]
PROVIDER = openidConnect
KEY = ${GITEA_OAUTH_CLIENT_ID}
SECRET = ${GITEA_OAUTH_CLIENT_SECRET}
OPENID_CONNECT_SCOPES = openid profile email
OPENID_CONNECT_AUTO_DISCOVERY_URL = https://auth.${DOMAIN}/application/o/gitea/.well-known/openid-configuration
ICON_URL = https://auth.${DOMAIN}/static/dist/assets/icons/icon.png
