global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
  - job_name: "restic"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["restic:9752"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alerts.yml"
