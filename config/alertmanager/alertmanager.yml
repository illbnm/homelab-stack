global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      continue: true

receivers:
  - name: default
    # Uncomment and configure one of the following:
    # webhook_configs:
    #   - url: http://gotify:80/message?token=YOUR_TOKEN
    # slack_configs:
    #   - api_url: YOUR_SLACK_WEBHOOK
    #     channel: #alerts

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@homelab.local'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'ntfy'
  group_by: ['alertname', 'severity', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'ntfy'
    webhook_configs:
      - url: '${NTFY_URL}'
        send_resolved: true
        http_config:
          headers:
            Priority: '${NTFY_PRIORITY}'
            Tags: 'warning,rotating_light'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
    equal: [alertname, instance]
