global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      continue: true

receivers:
  - name: default
    # Uncomment and configure one of the following:
    # webhook_configs:
    #   - url: http://gotify:80/message?token=YOUR_TOKEN
    # slack_configs:
    #   - api_url: YOUR_SLACK_WEBHOOK
    #     channel: #alerts

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true

templates: []
    equal: [alertname, instance]
