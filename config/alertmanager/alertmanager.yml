global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'ntfy-notifications'

receivers:
  - name: 'ntfy-notifications'
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
