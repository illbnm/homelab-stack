global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: ntfy
      continue: true
    - match:
        severity: warning
      receiver: ntfy
      continue: true

receivers:
  - name: ntfy
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true

  - name: default
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
    # Alternative: uncomment below and configure for Gotify
    # webhook_configs:
    #   - url: http://gotify:8080/message?token=YOUR_GOTIFY_TOKEN
    #     send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
