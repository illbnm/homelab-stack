# =============================================================================
# Alertmanager Configuration - Alert routing, grouping, and notifications
# =============================================================================

global:
  resolve_timeout: 5m

route:
  group_by: [alertname, cluster, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      group_wait: 15s
      repeat_interval: 1h
      continue: true
    - match:
        severity: warning
      receiver: default
      repeat_interval: 4h
    - match:
        severity: info
      receiver: info
      repeat_interval: 24h
    - match_re:
        job: prometheus|grafana|loki|alertmanager
      receiver: critical
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: default
    webhook_configs:
      - url: http://ntfy:80/publish/homelab-alerts
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://ntfy:80/publish/homelab-critical
        send_resolved: true

  - name: info
    webhook_configs:
      - url: http://ntfy:80/publish/homelab-info
        send_resolved: false

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
  - source_match:
      alertname: NodeDown
    target_match_re:
      alertname: .+
    equal: [instance]
