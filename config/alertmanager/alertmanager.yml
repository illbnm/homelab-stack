global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'ntfy-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'ntfy-critical'
      continue: false
    - match:
        severity: warning
      receiver: 'ntfy-warning'
      continue: false

receivers:
  - name: 'ntfy-notifications'
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
        http_config:
          headers:
            Title: 'Homelab Alert: {{ .Status | toUpper }}'
            Priority: '3'
            Tags: 'warning,monitor'
        max_alerts: 10

  - name: 'ntfy-critical'
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
        http_config:
          headers:
            Title: '🚨 CRITICAL: {{ .CommonAnnotations.summary }}'
            Priority: '5'
            Tags: 'critical,rotating_light,pager'
            Authorization: 'Bearer ${NTFY_TOKEN}'
        max_alerts: 5

  - name: 'ntfy-warning'
    webhook_configs:
      - url: 'http://ntfy:80/homelab-alerts'
        send_resolved: true
        http_config:
          headers:
            Title: '⚠️ WARNING: {{ .CommonAnnotations.summary }}'
            Priority: '4'
            Tags: 'warning,warning_sign'
            Authorization: 'Bearer ${NTFY_TOKEN}'
        max_alerts: 10

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
