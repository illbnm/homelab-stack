# =============================================================================
# Alertmanager — Configuration
# Routes alerts to ntfy push notifications.
# =============================================================================

global:
  resolve_timeout: 5m

# ── Routing ──────────────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 3h
  receiver: ntfy

  routes:
    - match:
        severity: critical
      receiver: ntfy
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: ntfy
      repeat_interval: 1h

# ── Receivers ────────────────────────────────────────────────────────────────
receivers:
  - name: ntfy
    webhook_configs:
      - url: "https://ntfy.${NTFY_DOMAIN}/homelab-alerts"
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: "${NTFY_TOKEN}"

# ── Inhibition ───────────────────────────────────────────────────────────────
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'instance']
