global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/templates/*.yml

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      continue: true
    - match:
        severity: warning
      receiver: warning

receivers:
  - name: default
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts'
        send_resolved: true
        http_config:
          proxy_url: ${HTTP_PROXY:}

  - name: critical
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts'
        send_resolved: true
        http_config:
          proxy_url: ${HTTP_PROXY:}
    email_configs:
      - to: ${ALERT_EMAIL:-}
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts'
        send_resolved: true
        http_config:
          proxy_url: ${HTTP_PROXY:}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]