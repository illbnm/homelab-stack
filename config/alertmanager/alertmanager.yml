global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: default
      continue: true

receivers:
  - name: default
    webhook_configs:
      # ntfy webhook - replace ${DOMAIN} with your actual domain
      # Topic: homelab-alerts
      # Subscribe: ntfy sub homelab-alerts
      # Or install ntfy app and subscribe to homelab-alerts
      - url: 'https://ntfy.${DOMAIN}/homelab-alerts'
        send_resolved: true

  # Alternative: Gotify receiver (uncomment and configure)
  # - name: gotify
  #   webhook_configs:
  #     - url: 'http://gotify:80/message?token=YOUR_GOTIFY_TOKEN'
  #       send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]