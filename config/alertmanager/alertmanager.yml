# Alertmanager configuration for Alert Routing

global:
  resolve_timeout: 5m
  http_config:
    global_smtp_smarthost: 'smtp.gmail.com:587'
    global_smtp_require_tls: true

templates:
  - ntfy_template

route:
  receiver: 'ntfy-receiver'
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Critical alerts
    - match:
        severity: critical
      receiver: ntfy-receiver
      continue: true

    # Warning alerts
    - match:
        severity: warning
      receiver: ntfy-receiver

receivers:
  - name: 'ntfy-receiver'
    webhook_configs:
      - url: '${NTFY_URL:-https://ntfy.sh}/homelab-alerts'
        send_resolved: true
        http_config:
          headers:
            Title: 'HomeLab Alert: {{ .GroupLabels.alertname }}'
            Priority: '{{ .Labels.severity }}'
            Tags: 'homelab'
