route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'  # 需要配置具体的接收器（如 email、webhook）

receivers:
  - name: 'default'
    # 配置实际通知方式（如 email、slack、webhook），当前为空以允许 Alertmanager 启动
    # email_configs:
    #   - to: 'admin@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: smtp.example.com:587
    #     auth_username: ''
    #     auth_password: ''

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']
