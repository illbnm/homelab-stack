global:
  resolve_timeout: 5m
  smtp_smarthost: '${SMTP_HOST}:${SMTP_PORT}'
  smtp_from: '${ALERTMANAGER_EMAIL_FROM}'
  smtp_auth_username: '${ALERTMANAGER_EMAIL_USER}'
  smtp_auth_password: '${ALERTMANAGER_EMAIL_PASS}'
  smtp_require_tls: true

route:
  receiver: 'default'
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  group_by: ['alertname', 'cluster', 'service']
  routes:
    - receiver: 'critical'
      match:
        severity: critical
      repeat_interval: 1h
    - receiver: 'default'
      match:
        severity: warning

receivers:
  - name: 'default'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_TO}'
    webhook_configs:
      - url: 'http://webhook:5000'
        send_resolved: true
  - name: 'critical'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL_TO}'
        headers:
          subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
    webhook_configs:
      - url: 'http://webhook:5000'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
