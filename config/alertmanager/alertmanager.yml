global:
  resolve_timeout: 5m
  smtp_require_tls: false

route:
  group_by: [alertname, cluster]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: ntfy-critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    - match:
        severity: warning
      receiver: ntfy-warning
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

receivers:
  - name: default
    webhook_configs:
      - url: http://ntfy:80/alertmanager
        send_resolved: true

  - name: ntfy-critical
    webhook_configs:
      - url: http://ntfy:80/alertmanager-critical
        send_resolved: true

  - name: ntfy-warning
    webhook_configs:
      - url: http://ntfy:80/alertmanager
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, instance]
