server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 容器日志 - 自动发现
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project

  # Traefik Access Log
  - job_name: traefik-access-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          service: traefik
          __path__: /var/log/traefik/access.log*

  # 系统日志
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          __path__: /var/log/syslog

  # Authentik 日志
  - job_name: authentik
    static_configs:
      - targets: [localhost]
        labels:
          job: authentik
          service: authentik
          __path__: /var/log/authentik/*.log

  # Docker 日志
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          service: docker
          __path__: /var/log/docker/*.log
