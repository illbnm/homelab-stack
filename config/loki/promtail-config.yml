# Promtail configuration for Log Collection agent

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs - automatic discovery
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_compose_project]
        target_label: compose_project
      - replacement: /var/lib/docker/containers/$1/*.log
        source_labels: [__meta_docker_container_id]
        target_label: __path__

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # Traefik access logs (if available)
  - job_name: traefik-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik-access
          __path__: /var/log/traefik/access.log
    pipeline_stages:
      - match:
          selector: '{job="traefik-access"}'
          stages:
            - regex:
                expression: '^(?P<remote_ip>[^ ]+) - (?P<user>[^ ]+) \[(?P<timestamp>[^\]]+)\] "(?P<method>[^ ]+) (?P<path>[^ ]+) (?P<protocol>[^"]+)" (?P<status>\d+) (?P<size>\d+)'
            - labels:
                remote_ip:
                user:
                method:
                path:
                protocol:
                status:
                size:
