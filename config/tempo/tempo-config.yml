# =============================================================================
# Tempo Configuration - Distributed tracing with OTLP
# =============================================================================

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  trace_idle_period: 10s
  max_block_duration: 30m
  complete_block_timeout: 5m

storage:
  trace:
    backend: local
    local:
      path: /tempo/traces
    wal:
      path: /tempo/wal
      bfs_completed: true
    pool:
      max_workers: 100
      queue_depth: 10000

compactor:
  compaction:
    block_retention: 72h
    compacted_block_timeout: 10m
    compaction_window: 1h
    max_compaction_objects: 1000000
    max_block_bytes: 10737418240

metrics_generator:
  registry:
    external_labels:
      cluster: homelab
      source: tempo
  storage:
    path: /tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
    max_traces_per_user: 10000
    max_bytes_per_trace: 5000000
