api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ':443'
    http:
      tls:
        certResolver: letsencrypt

providers:
  docker:
    endpoint: 'tcp://socket-proxy:2375'
    exposedByDefault: false
    network: proxy
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: '${ACME_EMAIL}'
      storage: /certs/acme.json
      httpChallenge:
        entryPoint: web
      # Uncomment below for DNS challenge (e.g., Cloudflare):
      # dnsChallenge:
      #   provider: cloudflare
      #   resolvers:
      #     - '1.1.1.1:53'
      #     - '8.8.8.8:53'

log:
  level: WARN

accessLog: {}
