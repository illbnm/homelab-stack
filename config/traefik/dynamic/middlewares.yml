http:
  middlewares:
    # Middleware for HTTP to HTTPS redirection (already handled by static config, but good to have explicit)
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

    # Basic authentication for Traefik Dashboard
    traefik-basic-auth:
      basicAuth:
        users:
          - "${TRAEFIK_AUTH}" # Use the hashed password from .env
