# =============================================================================
# Traefik Dynamic Configuration
# Authentik ForwardAuth Middleware for SSO
#
# This middleware protects services without native OIDC support.
# Services with native OIDC (Grafana, Gitea, etc.) should use their own OAuth2 config.
#
# Usage: Add to any router's middleware list
#   traefik.http.routers.<name>.middlewares: authentik@file
# =============================================================================

http:
  middlewares:
    # =========================================================================
    # Full SSO Protection
    # Redirects unauthenticated requests to Authentik login
    # =========================================================================
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # =========================================================================
    # Basic Auth (for APIs and services that need simple auth)
    # Uses Authentik's Basic Auth outpost
    # =========================================================================
    authentik-basic:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik/basic"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups

    # =========================================================================
    # Rate Limiting (optional security layer)
    # 100 requests per minute per IP
    # =========================================================================
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m

# =============================================================================
# Example Usage
# =============================================================================
# 
# To protect a service without native OIDC:
# 
# services:
#   my-service:
#     labels:
#       - "traefik.http.routers.my-service.middlewares=authentik@file"
# 
# To protect with rate limiting + SSO:
# 
#       - "traefik.http.routers.my-service.middlewares=rate-limit@file,authentik@file"
