http:
  middlewares:
    authentik:
      forwardAuth:
        # SECURITY: Restricted to internal network alias
        address: http://authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: false
        # SECURITY: Only allow sanitized identity claims to reach backend
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-email"
          - "X-authentik-name"
