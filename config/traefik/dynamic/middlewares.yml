http:
  middlewares:
    security-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true

    traefik-auth:
      basicAuth:
        users:
          - "${TRAEFIK_AUTH:-admin:$2y$05$123456789012345678901.}"
