# =============================================================================
# Traefik — Security Headers & Auth Middlewares
# Applied to all external services
# =============================================================================
#
# NOTE: For traefik-auth middleware, you need to generate the password hash:
#   htpasswd -nbB admin 'yourpassword' | sed -e 's/\$/\$\$/g'
# Then update the users list below with the output
# =============================================================================

http:
  middlewares:
    security-headers:
      headers:
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          X-XSS-Protection: "1; mode=block"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Content-Security-Policy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
          Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
          Cache-Control: "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
          Pragma: "no-cache"

    traefik-auth:
      basicAuth:
        users:
          # Replace with generated hash from command above
          # Format: "username:$2y$05$..."
          - "admin:$2y$05$EXAMPLE_REPLACE_WITH_YOUR_HASH"
