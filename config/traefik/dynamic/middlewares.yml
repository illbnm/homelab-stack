# Traefik Dynamic Configuration — Authentik ForwardAuth Middleware
#
# Place in: config/traefik/dynamic/middlewares.yml
# This enables SSO protection for services that don't natively
# support OIDC. Services that DO support OIDC should be configured
# with their own OIDC provider settings instead.

http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # Middleware that redirects to Authentik login if not authenticated
    authentik-redirect:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt

  # Routers that use ForwardAuth need a special error handler
  # to redirect 401 responses to the Authentik login page
  serversTransports:
    authentik-transport:
      forwardingTimeouts:
        dialTimeout: 30s