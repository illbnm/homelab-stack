# =============================================================================
# HomeLab Stack — Traefik Dynamic Middlewares
# Includes Authentik ForwardAuth for services without native OIDC
# =============================================================================

middlewares:
  # ---------------------------------------------------------------------------
  # Authentik ForwardAuth Middleware
  # For services that don't have native OIDC support
  # ---------------------------------------------------------------------------
  authentik:
    forwardAuth:
      address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      trustForwardHeader: true
      authResponseHeaders:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
        - X-authentik-uid
        - X-authentik-name

  # ---------------------------------------------------------------------------
  # Authentik Middleware with Basic Auth (for additional security)
  # ---------------------------------------------------------------------------
  authentik-basic:
    forwardAuth:
      address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
      trustForwardHeader: true
      authResponseHeaders:
        - X-authentik-username
        - X-authentik-groups
        - X-authentik-email
      authRequestHeaders:
        - Authorization: Basic <YOUR_BASIC_AUTH_HERE>

  # ---------------------------------------------------------------------------
  # Rate Limiting Middleware
  # ---------------------------------------------------------------------------
  rate-limit:
    rateLimit:
      average: 100
      burst: 50

  # ---------------------------------------------------------------------------
  # Security Headers Middleware
  # ---------------------------------------------------------------------------
  security:
    headers:
      customRequestHeaders:
        X-Forwarded-Proto: "https"
        X-Forwarded-Host: "{{downstreamHost}}"
        X-Forwarded-Port: "443"
      customResponseHeaders:
        X-Content-Type-Options: "nosniff"
        X-Frame-Options: "DENY"
        X-XSS-Protection: "1; mode=block"
        Referrer-Policy: "strict-origin-when-cross-origin"
      permissionsPolicy:
        camera: "()"
        microphone: "()"
        geolocation: "()"
      forceSTSHeader: true
      stsIncludeSubdomains: true
      stsPreload: true
      stsSeconds: 31536000

  # ---------------------------------------------------------------------------
  # Compression Middleware
  # ---------------------------------------------------------------------------
  compress:
    compress:
      excludedContentTypes:
        - application/grpc
        - application/protobuf
        - application/grpc-web-text
        - application/opensearchparamsets
        - application/vnd.google.protobuf
        - image/svg+xml