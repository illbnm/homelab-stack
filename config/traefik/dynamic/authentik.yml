# Authentik ForwardAuth Middleware
# This file is used by Traefik to define the forward auth middleware for Authentik.
# The docker-compose.yml of the sso stack also defines a similar middleware via labels,
# but this file provides a reusable global middleware that can be referenced by name.

http:
  middlewares:
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider-id
