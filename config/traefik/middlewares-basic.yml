# =============================================================================
# Traefik — Basic Auth Middleware for API Endpoints
#
# Fallback authentication for services that require auth but do not support
# OIDC or ForwardAuth. Uses HTTP Basic Auth via .htpasswd file.
#
# Generate a password hash:
#   echo $(htpasswd -nb admin PASSWORD) | sed -e s/\$/\$\$/g
#
# Usage — add to any service's Traefik router labels:
#   traefik.http.routers.<name>.middlewares=api-basic-auth@file
#
# For API-only services (no browser redirect):
#   traefik.http.routers.<name>.middlewares=authentik-basic@file
#   traefik.http.routers.<name>.middlewares=api-basic-auth@file
# =============================================================================

http:
  middlewares:

    # -------------------------------------------------------------------------
    # Basic Auth — generic API protection
    # File path: /dynamic/.htpasswd (mounted from config/traefik/dynamic/)
    # -------------------------------------------------------------------------
    api-basic-auth:
      basicAuth:
        usersFile: /dynamic/.htpasswd
        removeHeader: true
        realm: "Restricted API — authenticate at https://auth.${DOMAIN}"

    # -------------------------------------------------------------------------
    # Authentik Basic — ForwardAuth that returns 401 instead of redirect
    # Use for API clients (curl, scripts, CLIs) that cannot follow redirects.
    # -------------------------------------------------------------------------
    authentik-basic:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # -------------------------------------------------------------------------
    # Combined: Authentik ForwardAuth first, fall back to Basic Auth for API keys
    # -------------------------------------------------------------------------
    authentik-with-basic-fallback:
      chain:
        middlewares:
          - authentik-basic
          - api-basic-auth
