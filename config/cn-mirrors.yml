  # ----- Quay.io -----
  "quay.io/cilium/cilium": "m.daocloud.io/quay.io/cilium/cilium"
  "quay.io/coreos/etcd": "m.daocloud.io/quay.io/coreos/etcd"
  "quay.io/prometheus-operator/prometheus-operator": "m.daocloud.io/quay.io/prometheus-operator/prometheus-operator"
  "quay.io/brancz/kube-rbac-proxy": "m.daocloud.io/quay.io/brancz/kube-rbac-proxy"
  "quay.io/ceph/ceph": "m.daocloud.io/quay.io/ceph/ceph"

  # ----- Docker Hub (no change needed, but explicit fallback) -----
  "docker.io/library/": "docker.m.daocloud.io/library/"
  "docker.io/library/ubuntu": "docker.m.daocloud.io/library/ubuntu"
  "docker.io/library/alpine": "docker.m.daocloud.io/library/alpine"
  "docker.io/library/nginx": "docker.m.daocloud.io/library/nginx"
  "docker.io/library/postgres": "docker.m.daocloud.io/library/postgres"
  "docker.io/library/redis": "docker.m.daocloud.io/library/redis"

# Environment variable overrides
# These can be set in .env to customize mirror behavior
env_overrides:
  CN_MIRROR: "m.daocloud.io"           # Primary CN mirror
  FALLBACK_CN_MIRROR: "docker.m.daocloud.io"
  CHINA_MODE: "false"                  # Set to "true" to auto-enable CN mode
  DOCKER_REGISTRY_MIRROR: ""           # Additional daemon.json registry-mirrors entries (JSON array)
