  "ghcr.io/linuxserver/plex-meta-manager": "m.daocloud.io/ghcr.io/linuxserver/plex-meta-manager"
  "ghcr.io/postalserver/postal": "m.daocloud.io/ghcr.io/postalserver/postal"
  "ghcr.io/kiwigrid/k8s-sidecar": "m.daocloud.io/ghcr.io/kiwigrid/k8s-sidecar"
  "ghcr.io/onedr0p/exporters": "m.daocloud.io/ghcr.io/onedr0p/exporters"
