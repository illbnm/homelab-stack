# =============================================================================
# CN Mirror Mapping Table
# Maps original gcr.io/ghcr.io/k8s.gcr.io/quay.io images to Chinese mirrors
# Used by scripts/localize-images.sh and scripts/cn-pull.sh
# =============================================================================
# Primary mirrors (ordered by preference):
#   - m.daocloud.io (DaoCloud) — supports gcr.io, ghcr.io, k8s.gcr.io, quay.io
#   - docker.m.daocloud.io (DaoCloud) — supports docker.io
#   - gcr.m.daocloud.io / ghcr.m.daocloud.io — registry-specific
# Fallback: original registry (automatically tried on mirror failure)
# =============================================================================

mirrors:
  # ----- Google/GCR -----
  "gcr.io/cadvisor/cadvisor": "m.daocloud.io/gcr.io/cadvisor/cadvisor"
  "gcr.io/google-containers/pause": "m.daocloud.io/gcr.io/google-containers/pause"
  "gcr.io/google-samples/container-external-load-manager": "m.daocloud.io/gcr.io/google-samples/container-external-load-manager"
  "gcr.io/google/cadvisor": "m.daocloud.io/gcr.io/google/cadvisor"
  "gcr.io/google-containers/kube-apiserver": "m.daocloud.io/gcr.io/google-containers/kube-apiserver"
  "gcr.io/google-containers/kube-controller-manager": "m.daocloud.io/gcr.io/google-containers/kube-controller-manager"
  "gcr.io/google-containers/kube-scheduler": "m.daocloud.io/gcr.io/google-containers/kube-scheduler"
  "gcr.io/google-containers/kube-proxy": "m.daocloud.io/gcr.io/google-containers/kube-proxy"
  "gcr.io/google-containers/etcd": "m.daocloud.io/gcr.io/google-containers/etcd"
  "gcr.io/google-containers/pause:3.9": "m.daocloud.io/gcr.io/google-containers/pause:3.9"
  "gcr.io/distroless/static": "m.daocloud.io/gcr.io/distroless/static"

  # ----- Kubernetes / k8s.gcr.io -----
  "k8s.gcr.io/pause": "m.daocloud.io/k8s.gcr.io/pause"
  "k8s.gcr.io/kube-apiserver": "m.daocloud.io/k8s.gcr.io/kube-apiserver"
  "k8s.gcr.io/kube-controller-manager": "m.daocloud.io/k8s.gcr.io/kube-controller-manager"
  "k8s.gcr.io/kube-scheduler": "m.daocloud.io/k8s.gcr.io/kube-scheduler"
  "k8s.gcr.io/kube-proxy": "m.daocloud.io/k8s.gcr.io/kube-proxy"
  "k8s.gcr.io/etcd": "m.daocloud.io/k8s.gcr.io/etcd"
  "k8s.gcr.io/coredns/coredns": "m.daocloud.io/k8s.gcr.io/coredns/coredns"
  "registry.k8s.io/pause": "k8s.m.daocloud.io/registry.k8s.io/pause"
  "registry.k8s.io/coredns/coredns": "k8s.m.daocloud.io/registry.k8s.io/coredns/coredns"

  # ----- GitHub Container Registry / ghcr.io -----
  "ghcr.io/goauthentik/server": "m.daocloud.io/ghcr.io/goauthentik/server"
  "ghcr.io/home-assistant/home-assistant": "m.daocloud.io/ghcr.io/home-assistant/home-assistant"
  "ghcr.io/linuxserver/authentik": "m.daocloud.io/ghcr.io/linuxserver/authentik"
  "ghcr.io/linuxserver/heimdall": "m.daocloud.io/ghcr.io/linuxserver/heimdall"
