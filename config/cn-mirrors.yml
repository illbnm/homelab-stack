  "registry.k8s.io/kube-controller-manager": "m.daocloud.io/registry.k8s.io/kube-controller-manager"
  "registry.k8s.io/kube-scheduler": "m.daocloud.io/registry.k8s.io/kube-scheduler"
  "registry.k8s.io/pause": "m.daocloud.io/registry.k8s.io/pause"
  "registry.k8s.io/etcd": "m.daocloud.io/registry.k8s.io/etcd"
  "registry.k8s.io/metrics-server/metrics-server": "m.daocloud.io/registry.k8s.io/metrics-server/metrics-server"

