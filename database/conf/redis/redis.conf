# Homelab Stack — Redis 自定义配置
# 挂载到 /usr/local/etc/redis/redis.conf

# 持久化
save 900 1
save 300 10
save 60 10000

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 安全
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""

# 连接
timeout 300
tcp-keepalive 60

# 日志
loglevel notice
