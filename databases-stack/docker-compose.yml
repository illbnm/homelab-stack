version: '3.8'
services:
  postgres:
    image: postgres:16.4-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: masterpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - databases
  redis:
    image: redis:7.4.0-alpine
    restart: always
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - databases
  mariadb:
    image: mariadb:11.5.2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - databases
volumes:
  postgres-data:
  redis-data:
  mariadb-data:
networks:
  databases:
    external: false
