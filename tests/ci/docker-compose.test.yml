# CI test environment — lightweight, no real domains needed
version: "3.9"
services:
  test-runner:
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace
    working_dir: /workspace
    command: ["sh", "-c", "apk add bash curl jq && tests/run-tests.sh --ci"]
