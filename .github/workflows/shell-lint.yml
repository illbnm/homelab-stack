name: Shell Script Lint

on:
  push:
    paths: ['scripts/**', 'install.sh']
  pull_request:
    paths: ['scripts/**', 'install.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: |
          set -e
          fail=0
          for f in scripts/*.sh install.sh; do
            if [[ -f "$f" ]]; then
              if bash -n "$f" 2>/tmp/bash_err; then
                echo "✓ $f syntax OK"
              else
                echo "✗ $f syntax error:"
                cat /tmp/bash_err
                fail=1
              fi
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
      - name: Verify CN connectivity script runs
        run: |
          bash scripts/check-connectivity.sh || true
