name: Integration Tests
on:
  push:
    paths: ['stacks/**', 'scripts/**', 'tests/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          cp .env.example .env
          chmod +x tests/run-tests.sh tests/lib/*.sh tests/stacks/*.sh
          
      - name: Start base stack
        run: |
          docker compose -f stacks/base/docker-compose.yml up -d
          sleep 30
          
      - name: Wait for healthy
        run: |
          timeout 60 bash -c 'until docker ps --filter "name=traefik" --format "{{.Status}}" | grep -q "healthy"; do sleep 2; done'
          timeout 60 bash -c 'until docker ps --filter "name=portainer" --format "{{.Status}}" | grep -q "healthy"; do sleep 2; done'
          
      - name: Run integration tests
        run: |
          ./tests/run-tests.sh --stack base --json
          
      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/results/
          
      - name: Fail if tests failed
        run: |
          if [ -f tests/results/report.json ]; then
            failed=$(jq -r '.summary.failed' tests/results/report.json)
            if [ "$failed" -gt 0 ]; then
              echo "::error:: $failed tests failed"
              exit 1
            fi
          fi
