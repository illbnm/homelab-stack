name: Integration Tests
on:
  push:
    paths: ['stacks/**', 'scripts/**', 'tests/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          cp .env.example .env
          chmod +x tests/run-tests.sh tests/lib/*.sh
      - name: Start base stack
        run: docker compose -f stacks/base/docker-compose.yml up -d
        continue-on-error: true
      - name: Wait for healthy
        run: |
          for i in $(seq 1 60); do
            docker ps --format '{{.Names}} {{.State}}' && break
            sleep 2
          done
      - name: Run base tests
        run: ./tests/run-tests.sh --stack base --json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: tests/results/
